<!doctype html>
<!-- app.tg/index.htm — tangoglobe: eventos y personas por zona, con mapa (doc.htm) -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG</title>

<script src="datajs/aux.js"></script>
<script src="datajs/datos.cifrados.js"></script>
<script src="datajs/fotoid.js"></script>
<script src="datajs/ciudades.js"></script>
<script src="datajs/paises.js"></script>

<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
  :root { --maxFoto: 110px;   /* tamaño máximo de las fotos (= ANCHO_CARA) */ --altoTira: 27px; --altoFila: 31px;   /* la fila de los selectores y las de la barra: así las migas quedan a la altura del mapa */ color-scheme: dark;
          /* la paleta: solo estos colores (en el script, con paleta()) */
          --azulOscuro: #2f5a8f; --azulClaro: #8ab4f8; --amarillo: #ffd500; --grisClaro: #999; --grisMedio: #444; --grisOscuro: #222; --negro: #000; --blanco: #fff;
          /* y los del mapa */
          --mapaMar: #0d1b2a; --mapaPais: #22406a; --mapaBorde: #888; --mapaMarca: #ffd8b0; --mapaAro: #e6d37e; --mapaLugar: #e53935; --mapaPaisSel: #f5c211;
          /* sus usos */
          --fondo: var(--negro); --barra: var(--grisOscuro); --tarjeta: var(--grisMedio); --sinfoto: var(--grisMedio);
          --texto: var(--blanco); --suave: var(--grisClaro); --enlace: var(--azulClaro); --borde: var(--negro);
          --acento: var(--amarillo); }
  .principal { --borde: var(--grisMedio); }   /* las líneas del listado, sobre el fondo negro */
  .panel, .barraLista, dialog, #sugs { --borde: var(--grisClaro); }   /* los controles, con borde claro */
  html { overflow-y: scroll; }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--fondo); color: var(--texto); }
  button, select, input, textarea, .leaflet-container { font-family: inherit; }   /* todo con la letra del body: los controles y leaflet no la heredan */
  a { color: var(--enlace); }
  html { scrollbar-color: var(--grisClaro) var(--grisMedio); }
  ::selection { background: var(--azulClaro); color: var(--negro); }
  ::placeholder { color: var(--suave); opacity: 1; }
  :focus-visible { outline-color: var(--azulClaro); }

  .teselaBase { filter: sepia(1) hue-rotate(180deg) saturate(3) brightness(.85); }
  .teselaNombres { filter: sepia(.6) hue-rotate(180deg) saturate(1.5); }
  #mapa.leaflet-container { background: var(--mapaMar); }

  #mapa .leaflet-control-attribution { background: transparent; color: var(--grisClaro); font-size: 9px; }
  #mapa .leaflet-control-attribution a { color: inherit; }
  .cuerpo a { text-decoration: none; font-weight: 600; }
  .cuerpo a:hover { color: var(--texto); }
  .cuerpo p.enlaces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .cuerpo p.enlaces a { display: inline-flex; align-items: center; gap: 5px; }
  .cuerpo .icono { height: 16px; width: auto; }
  /* dos columnas: a la izquierda el panel de control, vertical; a la derecha la barra (buscador y ruta) y el listado */
  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .panel { position: sticky; top: 0; z-index: 3; box-sizing: border-box; height: 100vh; height: 100dvh; overflow-y: auto; scrollbar-width: thin;
           display: flex; flex-direction: column; gap: 10px; padding: 8px 12px 12px; background: var(--barra); box-shadow: 1px 0 6px rgba(0,0,0,.6); }
  .principal { min-width: 0; padding: 0 16px 16px; }
  .barraLista { --altoTira: var(--altoFila); position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px;
                margin: 0 -16px 16px; padding: 8px 16px; background: var(--barra); box-shadow: 0 1px 6px rgba(0,0,0,.6); }
  select { height: var(--altoFila); box-sizing: border-box; font-size: 1em; padding: 0 6px; background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #buscar { font-size: 1em; padding: 0 6px; height: var(--altoFila); width: 100%; box-sizing: border-box;
             background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  select:focus, #buscar:focus { outline: none; border-color: var(--acento); }   /* con el foco, el borde amarillo de los botones activos (2026-11-10, el usuario: "borde amarillo si select activo", "tb para el searh con foco"; antes, el azul de los enlaces) */
  #info { display: flex; }
  .busca { flex: 1 1 0; min-width: 0; }
  #selArea, #selRol { width: 100%; box-sizing: border-box; }
  #sugs { position: fixed; width: min(28em, 90vw); z-index: 2;
          background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.6);
          max-height: calc(10 * 26px); overflow-y: auto; }
  #sugs div { height: 26px; line-height: 26px; padding: 0 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sugs div.activa, #sugs div:hover { background: var(--azulOscuro); }
  #sugs small { color: var(--suave); }
  #sugs .tipo { display: inline-block; width: 3.2em; margin-right: 6px; font-size: .75em; font-weight: 600;
                text-align: center; color: var(--suave); border: 1px solid var(--borde); border-radius: 3px; line-height: 1.5; }

  #sugs .tipo.geoARE, #sugs .tipo.geoCON { background: var(--blanco); border-color: var(--blanco); color: var(--negro); }
  #sugs .tipo.geoCIT { background: var(--amarillo); border-color: var(--amarillo); color: var(--negro); }
  #sugs .tipo.gente { background: var(--grisClaro); border-color: var(--grisClaro); color: var(--negro); }   /* personas de tipo people */
  #info img { width: 28px; height: 28px; opacity: .8; }
  #info:hover img { opacity: 1; }

  .parrilla { --cols: 8; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: stretch; }
  .parrilla .cara { flex: 0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols)); max-width: var(--maxFoto); }
  .cara { position: relative; margin: 0; background: var(--negro); display: flex; flex-direction: column;
           border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .cara img, .cara .sinfoto { display: block; flex: none; width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--negro); }   /* también los eventos: una cara cuadrada, la foto entera sobre negro (2026-10-28; antes dos caras, 16:9 y cover) */
  .cara img.sinfoto, .cuerpo > img.sinfoto { background: var(--sinfoto); }

  .cara figcaption { flex: none; height: calc(3.75em + 6px);   /* hasta 3 líneas */ box-sizing: border-box; padding: 3px; background: var(--barra); color: var(--texto);
                     font-size: .7em; line-height: 1.25; display: flex; align-items: center; justify-content: center;
                     text-align: center; overflow-wrap: anywhere; }
  .cara figcaption span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .yt { position: absolute; top: 3px; right: 3px; display: flex; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .yt img { width: 20px; height: 14px; }
  .cara img, .cara figcaption { cursor: pointer; }

  .cuerpo > img.conEnlace { cursor: pointer; }

  .cara.evt img.logo, .cuerpo > img.logo { object-fit: contain; background: var(--blanco); padding: 6%; box-sizing: border-box; }

  dialog { border: 1px solid var(--borde); border-radius: 8px; padding: 16px; width: min(520px, 90vw);
           background: var(--barra); color: var(--texto); box-shadow: 0 4px 24px rgba(0,0,0,.8); }
  dialog { margin-top: 56px; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .cuerpo { display: flex; gap: 14px; align-items: flex-start; }

  .cuerpo > img, .cuerpo > .sinfoto { flex: none; align-self: flex-start; width: min(50%, var(--maxFoto)); height: auto;
                                        aspect-ratio: 1; object-fit: cover; border-radius: 6px; }   /* cuadrada: el alto, el del ancho (antes el del texto) */
  .cuerpo > img { background: var(--negro); }
  .texto { flex: 1; min-width: 0; }
  dialog .texto { padding-right: 28px; }
  dialog .texto p.enlaces { margin-top: 0; }   /* el popup de KK: sin líneas en blanco */
  #kkTexto { display: block; width: 100%; height: 190px; border: 0; }   /* atribucionkk.htm; su alto, el que avisa (conecta) */
  .cuerpo h2 { margin: 0 0 8px; font-size: 1.1em; }
  .cuerpo p { margin: 0; font-size: .9em; overflow-wrap: anywhere; }   /* líneas de texto seguidas; los enlaces, aparte (p.enlaces) */
  .cuerpo p.enlaces + p.organiza, .cuerpo p.panelInfo + p.organiza { margin-top: 6px; }   /* los eventos que organiza: tras su lugar y sus enlaces, uno por línea */
  .cuerpo p.organiza .icono { vertical-align: -3px; margin-left: 2px; }   /* sus logos, tras su nombre */
  .cuerpo .triangulo { position: relative; top: -1px; margin-right: -10px; border: 0; background: none; padding: 0; color: var(--blanco); font-size: calc(1em + 3px); line-height: 1; cursor: pointer; }   /* abre el panel de rol, notas y contacto: blanco, 3 px más grande, 1 px más arriba y a 4 px del texto (la línea separa 14; el usuario) */
  .cuerpo .panelInfo { margin-top: 4px; }   /* el de las personas, un párrafo; el de los eventos, sus líneas (venue, org) */

  .listado { display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; font-size: 18px; }   /* 2px más que el body (16px); fechas, ciudades y salas, en proporción (.85em) */

  .linea1, .linea2 { display: flex; gap: 4px; align-items: center; }
  .linea2 label { flex: 1 1 0; min-width: 0; }
  #rBotones { margin-top: 20px; }   /* los roles privados, separados (con el hueco de .fechas, 24px) */
  .fechas { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; justify-content: center; min-width: 0; }   /* separado de los países, 24px con el hueco del panel */

  .fechas.sinFechas { display: none; }
  .tira { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .fechas button, #bMapa, #bListado { flex: none; font-size: .85em; padding: 3px 7px; white-space: nowrap; cursor: pointer;
                   background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  .tira button { border: 0; border-radius: 4px; background: var(--tarjeta); color: var(--texto); }
  .tira button { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; padding: 0 7px;
                 height: var(--altoTira); box-sizing: border-box; }   /* los meses y la ruta, de la misma altura */

  .tira { flex: 1 1 auto; }
  .tira button { flex: 1 0 auto; }
  .tipTira { position: fixed; z-index: 2000; pointer-events: none; padding: 2px 7px; font-size: 12px; white-space: nowrap;   /* el hover de las tiras: al momento y sin borde */
             background: var(--grisMedio); color: var(--texto); border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .fechas button.activo { background: var(--acento); color: var(--negro); position: relative; }
  .tira button:not(.activo):hover { background: var(--azulClaro); color: var(--negro); }   /* el botón bajo el ratón, como en la lista del mapa */
  .tira button.cero, .tira button.cero:hover { background: none; color: var(--grisClaro); cursor: default; }   /* a cero: sin clic (el contador, en el hover) */

  .listado.filas { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0; border-top: 1px solid var(--borde); }
  .listado.filas.conFecha { grid-template-columns: auto auto minmax(0, 1fr) auto; }
  .listado .fila { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; column-gap: 16px; align-items: center;
                   padding: 5.5px 10px; border-bottom: 1px solid var(--borde); border-left: 2px solid transparent; cursor: pointer; }   /* 2026-10-26: un 10% más baja (antes 7px) */
  .listado .fila:hover { background: var(--grisOscuro); }
  .listado .fila.abierta { background: var(--acento); color: var(--negro); }
  .listado .fila.abierta .fFecha, .listado .fila.abierta .fLugar { color: var(--grisMedio); }
  .listado .fila.encontrado { outline: 0; border-left-color: var(--enlace); }
  .ruta { height: var(--altoTira); box-sizing: border-box; padding: 0 10px; line-height: calc(var(--altoTira) - 2px); font-size: .85em;   /* la de los botones de meses y días */ background: var(--grisMedio); color: var(--suave); border: 1px solid var(--borde); border-radius: 4px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ruta .icono { height: 16px; width: auto; }
  /* todo lo de la caja, centrado en vertical: los tramos, los ›, el icono y el contador, que es más grande (2026-11-10, el usuario: "centra en vertical todos los
     elementos de la caja migas"; antes, sobre la línea base). Si la ruta no cabe, se cortan los tramos, cada uno con su …: el contador siempre se ve */
  #ruta { display: flex; align-items: center; height: 100%; }
  #ruta > * { flex: none; }
  #ruta > .sep { white-space: pre; }   /* con sus blancos */
  #ruta > .tramo { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #ruta > .cuenta { margin-left: .3em; }
  .ruta .paso { color: var(--enlace); cursor: pointer; }
  .ruta .paso:hover { text-decoration: underline; }
  .ruta .cuenta { color: var(--blanco); font-weight: bold; font-size: calc(1em + 4px); }   /* 4 px más que la ruta y en blanco (2026-11-10, el usuario: "aumenta 2px la fuente del contador de migas", "2px mas y blanco para el contador"; antes, amarillo) */
  .ruta { position: relative; padding-right: 30px; flex: 1; min-width: 0; }   /* a la derecha, el botón de copiar la url de la ruta */
  .lineaRuta { flex: 1 1 100%; min-width: 0; display: flex; gap: 4px; }   /* la ruta y, fuera de ella a la derecha, el botón list / grid */
  .rutaDer { position: absolute; top: 0; right: 8px; height: 100%; display: flex; align-items: center; }   /* el de copiar */
  #bListado, #bMapa, #bAgendas button { height: var(--altoTira); padding: 0 8px; box-sizing: border-box; text-align: center; }
  #bListado { width: 4.6em; }   /* cabe "▦ grid" */
  #bMapa { width: 100%; border: 0; }   /* sin mapa, en su fila; con mapa, dentro de él (.zonaMapa) */
  .ruta .copiaRuta { height: 100%; border: 0; background: none; color: var(--acento); padding: 0; cursor: pointer;
                     display: flex; align-items: center; }
  .ruta .copiaRuta:hover { color: var(--blanco); }
  .ruta .copiaRuta svg { width: 15px; height: 15px; display: block; }
  .fila span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }   /* todas con el mismo alto: centradas igual */
  .fila .fFecha, .fila .fLugar { color: var(--suave); font-size: .85em; font-variant-numeric: tabular-nums; }
  .fila .fFecha, #aDias small { font-family: "Courier New", Courier, monospace; }   /* las fechas, con todas las letras del mismo ancho: alineadas (2026-11-08, el usuario) */
  /* la fecha, 2 px más grande y más estrecha (2026-11-10, el usuario: "sube 2px la fuente de la fecha y hazla mas estrecha"): no hay un Courier estrecho en todos
     los dispositivos, así que cada trozo de letras o números (.fLetras) se pinta al 75 % de su ancho (--estrecha) en una caja de ese ancho: --n letras de 1ch */
  .fila .fFecha { font-size: calc(.85em + 2px); line-height: 1; --estrecha: .75; }   /* (el interlineado: la fila, del mismo alto que antes) */
  .fila .fFecha .fLetras { display: inline-block; overflow: visible; width: calc(var(--n) * 1ch * var(--estrecha)); transform: scaleX(var(--estrecha)); transform-origin: left center; }
  .fila .fFecha .fSigno { font-family: system-ui, sans-serif; line-height: 0; }   /* el punto y el guion, con la letra del body: en Courier ocupan una letra entera (2026-11-10, el usuario: "el . y - ocupan mucho espacio"); siguen alineadas: cada signo mide siempre lo mismo */
  .fila .fNombre { font-weight: 500; position: relative; top: -1px; }   /* su letra, mayor: sin esto queda 1px más baja que la fecha y la ciudad */
  .fila .fTexto { display: flex; align-items: center; gap: 16px; min-width: 0; }   /* el título y su ciudad, en la misma celda: el título llega hasta su ciudad */
  .fila .fNombre { flex: 0 1 auto; }
  .logoEspecial { height: 1em; width: 1em; margin-right: 6px; vertical-align: -.12em; }
  .cara figcaption img.logoEspecial { display: inline; width: 1em; height: 1em; aspect-ratio: auto; background: none; }   /* no es una foto de la cara */
  .listado .fila.abierta .logoEspecial { filter: brightness(0); }   /* la estrella, sobre el amarillo */
  .fila .fLugar { flex: none; margin-left: auto; text-align: right; max-width: 18em; }
  .fila .fIconos { display: flex; align-self: center; min-width: 16px; }
  .fila .fIconos img { height: 16px; width: 16px; display: block; }
  /* el logo de la fila con su propio hover (como en el detalle): sobre él se resalta el logo, no la fila */
  .fila .fIconos a { display: block; padding: 3px; margin: -3px; border-radius: 4px; }
  .fila .fIconos a:hover { background: var(--enlace); }
  .listado .fila:has(.fIconos a:hover):not(.abierta) { background: none; }
  .fila .fMini { align-self: stretch; height: auto; min-height: 1.2em; aspect-ratio: 16 / 9; width: auto; contain: size;   /* el alto de la fila (contain: no la agranda) */
                 object-fit: cover; justify-self: end; border-radius: 2px; display: block; }
  .fila .fMini.sinfoto { background: var(--sinfoto); }
  .fila .fMini.logo { object-fit: contain; background: var(--blanco); }
  @media (max-width: 600px) {
    .fila .fTexto { flex-direction: column; align-items: stretch; gap: 0; }   /* la ciudad, bajo el título */
    .fila .fLugar { margin-left: 0; text-align: left; max-width: none; }
    .listado .fila { column-gap: 8px; }   /* el ancho, para el título */
    .fila .fMini { min-height: 2.3em; }   /* las dos líneas de la fila: con este mínimo, su columna ya mide la miniatura entera */
  }

  .leaflet-tooltip { color: var(--negro); }
  .leaflet-tooltip.tipNombre { background: var(--grisMedio); color: var(--texto); border: 1px solid var(--borde); box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .leaflet-tooltip-top.tipNombre::before { border-top-color: var(--grisMedio); }
  .marcaLista { box-sizing: border-box; border-radius: 2px; background: var(--mapaMarca); color: var(--negro); }
  .marcaLista > div { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 8px; line-height: 1; }
  .mapaCaja { position: relative; z-index: 0; display: flex; gap: 6px; }   /* a la izquierda el mapa; a la derecha los países o ciudades */
  .zonaMapa { --altoMapa: 172px; --anchoLista: 150px; position: relative; min-width: 0; }
  .zonaMapa:has(.mapaCaja:not(.cerrado, .oculto)) #bMapa { position: absolute; z-index: 1; top: 6px; left: 6px; width: auto; }   /* dentro del mapa, arriba a la izquierda */
  /* las ciudades del mapa, a la izquierda en 1-2 columnas; en el hover, sus líneas del listado */
  .ciudadesMapa { flex: none; width: var(--anchoLista); box-sizing: border-box; height: var(--altoMapa); max-height: 24.5vh;   /* el alto del mapa */
                  overflow-y: auto; font-size: .85em; line-height: var(--altoTira); }   /* con más de los que caben, el scroll */
  .tipTira.circulo { box-sizing: border-box; min-width: 24px; height: 24px; padding: 0 5px;
               font-size: 13px; line-height: 22px; text-align: center; white-space: nowrap;   /* el contador, en un círculo (también el de meses y días) */
               background: var(--grisMedio); color: var(--texto); border: 1px solid var(--borde); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .ciudadesMapa { display: grid; grid-auto-rows: var(--altoTira); align-content: start; gap: 2px; scrollbar-width: thin; }   /* el resto del margen y el hueco entre columnas, en los nombres */
  option { background: var(--grisMedio); color: var(--blanco); }
  option:checked, option.actual { background: var(--amarillo); color: var(--negro); }   /* la elegida; .actual, mientras selArea se abre vacío (conecta) */
  #selRol option:not(.grupo, :first-child) { padding-left: calc(8px + 2ch); }   /* los tipos, sangrados bajo su grupo; all no tiene grupo */
  option.grupo { color: var(--blanco); font-weight: 700; }
  /* el desplegable con la paleta, también al pasar el ratón; sin base-select, el del navegador con las opciones de arriba */
  @supports (appearance: base-select) {
    select, ::picker(select) { appearance: base-select; }
    select { display: flex; align-items: center; }
    select::picker-icon { color: var(--blanco); }
    ::picker(select) { padding: 3px 0; background: var(--grisMedio); color: var(--blanco); border: 1px solid var(--grisClaro); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.6); }
    option { padding: 2px 8px; }
    option::checkmark { display: none; }
    option:not(:disabled):hover, option:not(:disabled):focus-visible { background: var(--azulClaro); color: var(--negro); outline: 0; }
    option:checked, option:checked:hover, option:checked:focus-visible { background: var(--amarillo); color: var(--negro); font-weight: 400; }
    option.grupo { padding-top: 6px; background: none; }
  }
  .ciudadesMapa > span { display: flex; gap: 6px; padding: 0 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                       align-items: center; border-radius: 4px; background: var(--tarjeta); color: var(--texto); }   /* cada país, una celda como los meses */
  .ciudadesMapa > span:hover { background: var(--azulClaro); color: var(--negro); }   /* el nombre bajo el ratón */
  .ciudadesMapa > span.atras:not(:hover), .ciudadesMapa > span.mas:not(:hover) { color: var(--amarillo); }   /* back y more..., en amarillo */
  .ciudadesMapa > span.atras, .ciudadesMapa > span.mas { justify-content: center; }
  .ciudadesMapa > span.sel, .ciudadesMapa > span.sel:hover { background: var(--acento); color: var(--negro); }   /* la ciudad elegida, del color de los botones activos */
  .ciudadesMapa > span.hueco, .ciudadesMapa > span.hueco:hover { background: var(--tarjeta); cursor: default; }
  .ciudadesMapa > span.cero, .ciudadesMapa > span.cero:hover { background: none; color: var(--grisClaro); cursor: default; }
  .ciudadesMapa .nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* el nombre, cortado con … si no cabe */
  .ciudadesMapa .num { flex: none; }   /* a su derecha, el contador */
  .ciudadesMapa span.atras svg { flex: none; width: 15px; height: 15px; margin-right: -3px; position: relative; top: -2px; }   /* la primera: volver al nivel de arriba, con su logo de volver, 2 px más arriba (2026-11-10, el usuario: "log back sube 2px") */
  .mapa { flex: 1; min-width: 0; height: var(--altoMapa); max-height: 24.5vh; border-radius: 6px; }
  #bMapa:disabled { opacity: .45; cursor: default; }
  .iParrilla { position: relative; top: -2px; }
  .iMapa { position: relative; top: -2px; }   /* el triángulo del botón map */
  .vacio { padding: 24px 12px; text-align: center; color: var(--suave); }   /* el listado a cero */
  .vacio button { margin-top: 10px; font-size: .9em; padding: 4px 10px; cursor: pointer; background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  @media (max-width: 600px) { .zonaMapa { --altoMapa: 122px; --anchoLista: 110px; } }
  .aviso { color: var(--suave); }
  .oculto { display: none !important; }

  .detalle { position: relative; box-sizing: border-box; margin: 0 0 16px; padding: 16px; background: var(--barra);
             border: 1px solid var(--borde); border-radius: 8px; }

  .detalle { position: sticky; top: calc(var(--altoBarra, 0px) + 16px); z-index: 1;
             box-shadow: 0 -16px 0 var(--fondo), 0 16px 0 var(--fondo); }
  .detalle .texto { margin-right: 30px; }
  .detalle.larga { position: relative; top: auto; }   /* sin scroll propio: la que no cabe en la ventana no se queda fija, se lee bajando la página */
  .detalle .texto > * { margin: 0; line-height: 22px; }   /* título, fecha, org, enlaces...: todas las líneas con el mismo interlineado */
  .detalle .texto p.enlaces { margin-top: 0; row-gap: 0; }
  #dCerrar, #fCerrar, #aCerrar { position: absolute; top: 6px; right: 8px; box-sizing: border-box; width: 26px; height: 26px; padding: 0; border: 2px solid currentColor; border-radius: 50%;
             display: flex; align-items: center; justify-content: center; background: none; color: var(--blanco); cursor: pointer; }
  #dCerrar svg, #fCerrar svg, #aCerrar svg { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }   /* la X dibujada: la × de la letra se descentraba según la fuente */
  #fCerrar, #aCerrar { top: 8px; }   /* el del popup, a la misma distancia arriba y a la derecha */
  #dCerrar:hover, #fCerrar:hover, #aCerrar:hover { border-radius: 4px; }   /* bajo el ratón, de círculo a cuadrado */
  /* la primera línea de la ficha: el nombre, su tipo y el logo de copiar el enlace, seguidos en la misma línea, el logo a un blanco del tipo; si no caben,
     saltan a la siguiente (2026-11-10, el usuario: "debe salir en la mismalinea : nombre+tipo+copy", "sino cabe salta", "copy ... separado 1 blanco,
     despues del tipo de evento"). La última palabra del nombre, el tipo y el logo no se separan (.finTitulo): el logo nunca queda solo en una línea */
  .cuerpo h2 .finTitulo { white-space: nowrap; }
  #dFuentes { position: absolute; right: 13px; bottom: 8px; width: 16px; height: 16px; border: 0; background: none; padding: 0; cursor: pointer; }
  #dFuentes svg { width: 100%; height: 100%; display: block; }
  dialog .fuentes a { display: block; margin: 8px 0; overflow-wrap: anywhere; }
  #dCopiar { display: inline-flex; vertical-align: -2px; margin-left: .3em; border: 0; background: none; color: var(--acento); padding: 0; cursor: pointer; }   /* .3em: un blanco */
  #dCopiar:hover { color: var(--blanco); }
  #dCopiar svg { width: 16px; height: 16px; display: block; }

  .detalle.filas { background: var(--fondo); border: 0; border-radius: 0; border-top: 1px solid var(--borde);
                   border-bottom: 1px solid var(--borde); padding: 14px 10px; }
  .detalle.filas h2 { font-weight: 500; font-size: 1.05em; }
  .detalle.filas p { color: var(--suave); }
  .detalle.filas h2 .hTipo, #ficha h2 .hTipo { color: var(--suave); font-size: .8em; font-weight: 400; margin-left: 10px; }
  .detalle.filas .cuerpo a { font-weight: 500; }
  .detalle.filas .cuerpo > img { border-radius: 3px; }

  /* pantalla ancha: el panel vertical. Bajo los selectores, el mapa; debajo los países o ciudades en 2 columnas, del alto de
     su contenido; al final, meses, días y roles, en rejilla (no caben en una tira) */
  /* OPEN SCHEDULER: sin scroll lateral, las 7 columnas caben siempre; cada milonga, dos líneas: la hora y el nombre, cortado si no cabe */
  #bAgendas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 20px; }   /* sin sitio para los dos, uno en cada línea; separados de los días como estos del mapa (24px con el hueco de .fechas) */
  #bAgendas button { flex: 1 1 auto; }
  #bAgendas button:hover, #aAtras:hover, #aSigue:hover { background: var(--azulClaro); color: var(--negro); }
  #agenda { box-sizing: border-box; width: min(1280px, calc(100vw - 16px)); max-width: none; max-height: calc(100dvh - 16px); margin: 8px auto; padding: 0; overflow: hidden; }
  #agenda[open] { display: flex; flex-direction: column; }
  #aCabeza { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 12px; }   /* el título, el cursor en el centro del popup y, en la tercera columna, la X */
  #aTitulo { margin: 0; font-size: 1em; }
  #aScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  #agenda table { --borde: var(--grisMedio); --topePrimera: 30%; display: grid; grid-template-columns: fit-content(var(--topePrimera)) repeat(7, minmax(0, 1fr)); width: 100%; font-size: .85em; }   /* la primera, del ancho de su contenido (con tope: si no, se come los días); los días, iguales */
  #agenda thead, #agenda tbody, #agenda tr { display: contents; }
  #agenda th, #agenda td { box-sizing: border-box; padding: 3px; border-top: 1px solid var(--borde); border-left: 1px solid var(--borde); overflow-wrap: anywhere; font-weight: 400; }
  #agenda tr > :first-child { padding-left: 12px; padding-right: 8px; border-left: 0; text-align: left; }
  #agenda td.vacio { grid-column: 1 / -1; padding: 12px; color: var(--suave); }
  #aDias th { position: sticky; top: 0; z-index: 1; background: var(--barra); color: var(--suave); text-align: center; align-content: center; font-variant-numeric: tabular-nums; }
  #aDias small { font-size: .9em; }
  #aDias .hoy { background: var(--acento); color: var(--negro); }
  #aAtras, #aSigue { width: 2.6em; height: var(--altoTira); margin: 0 2px; padding: 0; font-size: 1.2em; line-height: 1; cursor: pointer;
                     background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  .sesion { display: block; box-sizing: border-box; width: 100%; padding: 2px 4px; border: 0; border-radius: 3px; font-size: inherit; text-align: left; cursor: pointer;
            background: var(--tarjeta); color: var(--texto); }
  .sesion + .sesion { margin-top: 2px; }
  .sesion:hover { background: var(--azulClaro); color: var(--negro); }
  .sesion.local { padding: 2px 4px; text-align: left; }   /* el nombre del local, en la primera columna */
  .sesion .hora, .sesion .nom { display: block; min-height: 1.2em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* el nombre entero, en el hover y en su ficha */
  .sesion .hora { color: var(--suave); font-variant-numeric: tabular-nums; }
  .sesion:hover .hora { color: inherit; }
  @media (max-width: 800px) {   /* el popup, estrecho: su límite es el del ancho de la ventana, no el del panel (720 px) */
    #agenda table { --topePrimera: 26%; font-size: 12px; }
    #agenda th, #agenda td { padding: 2px 1px; }
    #agenda tr > :first-child { padding-left: 6px; padding-right: 3px; }
    #agenda td.vacio { padding: 12px; }
    .sesion { padding: 2px 0; text-align: center; }
    .sesion .hora, .sesion .nom { font-size: min(12px, 3.3vw); }   /* en las 7 columnas, la hora entera */
    .sesion .hora { color: inherit; }
    .sesion .logoEspecial { margin-right: 0; }
  }
  @media (max-width: 600px) {   /* junto al cursor, una línea: solo el lugar */
    .aRol { display: none; }
    #aTitulo { font-size: .9em; }
    #aAtras, #aSigue { width: 2em; }
  }
  /* el límite del panel vertical: 720 px (2026-11-10, el usuario: "mueve el punto de ruptura para ver a media pantalla el menú lateral"; antes 800,
     y Brave a media pantalla mide 768). El mismo en estos tres @media y en isMovil() */
  @media (min-width: 721px) {
    .tira { flex: none; flex-wrap: wrap; gap: 2px; overflow: visible; }
    .tira button { flex: 1 0 auto; padding: 0 4px; }
    .tira[data-tira="meses"], .tira[data-tira="dias"] { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .tira[data-tira="dias"] button { grid-column: span 3; }
    .tira[data-tira="meses"] button { grid-column: span 3; order: 2; }   /* los 12 meses, de 4 en 4 */
    .tira[data-tira="meses"] button:nth-child(-n+2), .tira[data-tira="meses"] button:last-child { grid-column: span 4; order: 1; }   /* antes, los años y this year en su línea */
    .zonaMapa { display: flex; flex-direction: column; min-height: 0; }
    .zonaMapa:has(.mapaCaja.cerrado) #bMapa { margin-bottom: 6px; }
    /* el mapa, a 2 px de lo de arriba (los selectores) y de lo de abajo (los países), como las celdas entre sí (2026-11-10, el usuario: "margin 2px del mapa arriba
       y abajo"; antes 10 y 6): arriba, el hueco del panel (10 px) menos 8 */
    .zonaMapa:has(.mapaCaja:not(.cerrado, .oculto)) { margin-top: -8px; }
    .mapaCaja { flex-direction: column; min-height: 0; gap: 2px; }
    .mapa { flex: none; box-sizing: border-box; height: auto; aspect-ratio: 1; max-height: none; }   /* cuadrado, del ancho del panel (2026-11-10, el usuario: "haz el mapa cuadrado, manten el mismo ancho"; antes, 142 px de alto) */
    .ciudadesMapa { flex: 0 1 auto; min-height: 0; width: auto; height: auto; max-height: none;   /* del alto de su contenido: siempre 6 líneas, por páginas */
                    grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(var(--filas, 1), var(--altoTira)); }   /* se llena por columnas: primero la de la izquierda (--filas, en pintaCiudades) */
    .ciudadesMapa:empty { display: none; }
  }
  @media (min-width: 721px) and (max-height: 460px) { .zonaMapa { flex: none; } }   /* ventana baja: no cabe; scroll en el panel */
  /* el listado estrecho junto al panel (menos de 600 px, como en el móvil): la fecha, más pequeña y apretada, y menos hueco entre columnas: el ancho, para el título
     (2026-11-10, el usuario: "la fecha puede hacerse q ocupe menos ancho ?") */
  @media (min-width: 721px) and (max-width: 920px) {
    .listado .fila { column-gap: 8px; padding-left: 6px; padding-right: 6px; }
    .fila .fFecha { font-size: calc(.7em + 2px); }
    .fila .fTexto { gap: 10px; }
  }
  /* pantalla estrecha: una columna, como la cabecera de antes: el panel arriba y debajo la barra, los dos fijos */
  @media (max-width: 720px) {
    .app { display: block; }
    .panel { height: auto; overflow: visible; flex-flow: row wrap; align-items: center; gap: 4px; padding: 4px 16px; box-shadow: none; }
    .linea1, .linea2 { flex: 0 0 100%; }
    .zonaMapa, .fechas { flex: 0 0 100%; min-width: 0; }
    #rBotones, #bAgendas, .fechas { margin-top: 0; }
    .mapaCaja.cerrado { display: none; }   /* aquí cerrar el mapa libera sitio: se van los dos */
    .barraLista { top: var(--altoPanel, 0px); gap: 4px 8px; padding: 6px 16px; }
    .detalle { top: calc(var(--altoPanel, 0px) + var(--altoBarra, 0px) + 16px); }
  }
</style>

<body>
<div class="app">
 <aside id="panel" class="panel">

  </div>
  <div id="detalle" class="detalle oculto"><button id="dCerrar" title="close"><svg viewBox="0 0 14 14"><path d="M1.5 1.5l11 11M12.5 1.5l-11 11"/></svg></button><button id="dCopiar" title="copy link"></button><div id="dCuerpo" class="cuerpo"></div><button id="dFuentes" class="oculto" title="sources"><svg viewBox="0 0 24 24" fill="none" stroke="#8ab4f8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V6M12 6c0-3 5-3.5 6 1v2M12 6c0-3-5-3.5-6 1v2"/><path d="M3.5 14h17c0 3.8-3.5 5.5-8.5 5.5S3.5 17.8 3.5 14zM8.5 22h7"/></svg></button></div>

 </main>

<script>
const FOTOS = 'foto';
const TODOS = '*';
history.scrollRestoration = 'manual';   // al cargar (o recargar), arriba: a la vista la primera línea del listado
const MAX_FILAS_PANEL = 6;   // las celdas por columna del panel de países y ciudades, con back y more... (2026-11-04, el usuario: "mas de celdas por columna es 6")
let enListado = true;   // listado o parrilla de caras (botón list; ?c=grid / ?c=list)
const ANCHO_CARA = 110;   // = --maxFoto del CSS: tamaño máximo de las fotos
function columnasParrilla(){
  const div = $('parrilla'), w = div.clientWidth || window.innerWidth;
  div.style.setProperty('--cols', Math.max(4, Math.floor((w + 6) / (ANCHO_CARA + 6))));   // un evento, una cara (2026-10-28; antes dos)   // sin tope: cada cara, ANCHO_CARA como mucho (--maxFoto)
}
const EVT = 'evt';   // un evento; en el selector, festivals (rolesEvento)
const FES = 'fes';
const SEM = 'sem';
const ACA = 'aca';
const MIL = 'mil';
const PRA = 'pra';
const regular = r => r == MIL || r == PRA;   // milongas y prácticas: por días de la semana
const deEventos = r => r == FES || r == SEM || r == ACA || regular(r);
const sinFecha = r => r == ACA || regular(r);
const rolEvento = t => String(t).indexOf('seminar') != -1 ? SEM : String(t).indexOf('academy') != -1 ? ACA
                     : String(t).split(' ')[0] == 'milonga' ? MIL : String(t).split(' ')[0] == 'practica' ? PRA : EVT;
const PEO = 'peo';
const TIPOS_P = Object.keys(TIPOS_PERSONA).filter(t => t != 'person');   // group, couple: en el selector, sin tiras
const LIS = 'lis';
const MUNDIAL = 'World';
const $ = id => document.getElementById(id);
// la única pregunta al navegador por el móvil: pantalla estrecha (sin panel vertical; el mismo límite que los @media de 720 px del CSS, donde no caben variables)
// y, con conDedo, también sin ratón (el dedo: una tableta ancha); la colocación solo mira el ancho, para ir con el CSS
const isMovil = (conDedo = false) => matchMedia('(max-width: 720px)').matches || (conDedo && !matchMedia('(pointer: fine)').matches);

function foto(idfoto, evento){
  const f = fotoDeId(idfoto, evento);
  return f ? FOTOS + f.carpeta + '/' + f.fichero : '';
}

const coordCiudad = r => (typeof CIUDADES_COORD == 'undefined' ? null
                          : CIUDADES_COORD[String(r[CAMPO.country]).trim() + '|' + String(r[CAMPO.city]).trim()]) || null;
function coordDe(r){
  const v = leeVarios(r), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  return !isNaN(la) && !isNaN(lo) ? [la, lo] : coordCiudad(r);
}
let _venues = null;
function venueDe(e){
  const loc = (leeVarios(e).loc || [])[0];
  if (!loc) return null;
  if (!_venues || !_venues.size) _venues = new Map(eventosTango().filter(x => x[CAMPO.tipo] == 'venue')
                                 .map(x => [x[CAMPO.country] + '|' + x[CAMPO.city] + '|' + x[CAMPO.name], x]));
  return _venues.get(e[CAMPO.country] + '|' + e[CAMPO.city] + '|' + loc) || null;
}
function urlSala(e){   // el Facebook (o la web) del venue de su sala, si lo tiene
  const v = venueDe(e), u = v ? String(v[CAMPO.urlfb] || '') : '';
  return /^https?:\/\//.test(u) ? u : '';
}
function dirSala(e){   // la dirección (dir) de la milonga o, si no la tiene, la de su venue
  const v = venueDe(e);
  const d = (leeVarios(e).dir || (v ? leeVarios(v).dir : null) || [''])[0];
  return d == '?' ? '' : d;     // (? = sala sin dirección: el mapa usa su ciudad)
}
function posEvento(e){   // de momento, un círculo por ciudad: el centro de su ciudad; sin él, su lat/lon o la de su sala
  if (coordCiudad(e)) return coordCiudad(e);
  const v = leeVarios(e), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  if (!isNaN(la) && !isNaN(lo)) return [la, lo];
  const venue = venueDe(e);
  return venue ? coordDe(venue) : coordCiudad(e);
}
function fotoEvento(e){
  const venue = venueDe(e);
  return foto(e[CAMPO.idfoto], true) || (venue ? foto(venue[CAMPO.idfoto], true) : '');
}

let personas = [];
function cargaFilas(filas){
  const porClave = new Map();
  for (const c of filas){
    const f = foto(c[CAMPO.idfoto], false);
    const url = c[CAMPO.urlfb] && c[CAMPO.urlfb] != '-' ? c[CAMPO.urlfb] : '';
    const clave = f || url || 'nombre:' + c[CAMPO.name];
    const v = leeVarios(c);
    const coments = [...(v.txt || []), ...(v.ins || []).map(u => 'Instagram @' + u), ...(v.wec || []).map(w => 'WeChat ' + w),
                     ...(v.kak || []).map(k => 'Kakao ' + k), ...(v.tel || []).map(t => '☎ ' + t), ...(v.ema || [])];
    const notas = [...(v.vid || []), ...(v.www || []), ...(v.prv || [])].filter(x => x && x != '-').join(',');
    const fb = /facebook\.com\//.test(url) ? url : '';
    const area  = c[CAMPO.area] && c[CAMPO.area] != '-' ? c[CAMPO.area] : '-';
    const pais  = c[CAMPO.country] && c[CAMPO.country] != '-' ? c[CAMPO.country] : '-';
    const lugar = [c[CAMPO.city], c[CAMPO.country]].filter(x => x && x != '-').join(', ');
    const ciudad = c[CAMPO.city] && c[CAMPO.city] != '-' ? String(c[CAMPO.city]).trim() : '';
    const roles = String(c[CAMPO.roles] || '').split(',').map(r => r.trim()).filter(r => ROLES[r]);   // el import ya los deja con su nombre de ROLES
    const video = (v.vid || [''])[0];
    const p = porClave.get(clave);

function proximaReg(f, solo){   // solo: días de la semana (0 = domingo) a los que se limita
  const r = leeReg(f), hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const dias = r ? r.dias.filter(d => !solo || solo.includes(d)) : [];
  if (!dias.length) return null;
  if (r.frec == 'Q'){     // cada 2 semanas: el primero de los 14 días que viene que le toca (aux.js saleReg)
    for (let k = 0; k < 14; k++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
      if (dias.includes(d.getDay()) && saleReg(r, d)) return d;
    }
    return null;
  }
  if (r.frec != 'M'){
    const k = Math.min(...dias.map(d => (d - hoy.getDay() + 7) % 7));
    return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
  }
  const fechas = [0, 1].flatMap(m => r.semanas.map(s => {
    const primero = new Date(hoy.getFullYear(), hoy.getMonth() + m, 1);
    const dia1 = 1 + (dias[0] - primero.getDay() + 7) % 7;
    const ult = new Date(primero.getFullYear(), primero.getMonth() + 1, 0).getDate();
    const dia = s == 'L' ? dia1 + 7 * Math.floor((ult - dia1) / 7) : dia1 + 7 * (s - 1);
    return dia <= ult ? new Date(primero.getFullYear(), primero.getMonth(), dia) : null;
  }));
  return fechas.filter(d => d && d >= hoy).sort((a, b) => a - b)[0] || null;
}
function mapaDe(e){

  const trozos = [locDe(e), dir, ...lugar].join(', ').split(',').map(x => x.trim()).filter(Boolean);
  const texto = trozos.filter((x, i) => trozos.findIndex(y => y.toLowerCase() == x.toLowerCase()) == i).join(', ');
  const la = parseFloat((v.lat || vv.lat || [])[0]), lo = parseFloat((v.lon || vv.lon || [])[0]);

}

function centroPais(pais){
  if (typeof PAISES_GEO == 'undefined') return null;
  const f = PAISES_GEO.features.find(f => f.properties.nombres.includes(pais));
  if (!f) return null;
  const polis = f.geometry.type == 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const cajas = polis.map(p => { const xs = p[0].map(c => c[0]), ys = p[0].map(c => c[1]);
                                 return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const [x0, y0, x1, y1] = cajas.reduce((m, c) => (c[2] - c[0]) * (c[3] - c[1]) > (m[2] - m[0]) * (m[3] - m[1]) ? c : m);
  return [(y0 + y1) / 2, (x0 + x1) / 2];
}

function filasMilongas(lista){   // [{p, dia}] por fecha desde hoy: con días elegidos, una por cada uno en que se hace

    const r = b.getBoundingClientRect();
    t.style.left = Math.max(2, Math.min(r.left + (r.width - t.offsetWidth) / 2, innerWidth - t.offsetWidth - 2)) + 'px';
    const arriba = r.top - t.offsetHeight - 4;   // encima del botón; si no cabe, debajo
    t.style.top = (arriba >= 2 ? arriba : r.bottom + 4) + 'px';
  };
  b.onmouseleave = fuera;
  b.addEventListener('click', fuera);   // al pulsar se repinta la tira: el botón se va sin su mouseleave
}

function rellenaPersona(c, p){
  const img = cara(p);
  c.appendChild(img);
  const d = document.createElement('div');
  d.className = 'texto';
  c.appendChild(d);
  titulo(d, p);
  const lineaLugar = d.lastElementChild.tagName == 'P' ? d.lastElementChild : null;    // la de su lugar, si titulo la pone (tras el h2 del nombre)
  // rol, org, comentarios y prv: un solo párrafo, seguidos y separados por " · "
  const par = document.createElement('p');
  const linea = (etiqueta, ...nodos) => {   // etiqueta (rol, org...) resaltada; sin etiqueta, solo el texto
    if (par.childNodes.length) par.append(' · ');
    if (etiqueta){
      const b = document.createElement('b');
      b.textContent = etiqueta + ': ';
      par.append(b);
    }
    par.append(...nodos);
  };
  const roles = p.roles.filter(r => ROLES[r]);
  const publicos = roles.filter(r => ROLES[r].publico), privados = roles.filter(r => !ROLES[r].publico);
  if (p.sala) linea('venue', p.salaFb ? enlace(p.salaFb, p.sala) : p.sala);
  if (p.tipoP && p.tipoP != 'person') linea('type', PRIMEROS[p.tipoP] || p.tipoP);   // como en el selector: artist couple
  if (publicos.length) linea('rol', publicos.map(textoRol).join(', '));
  if (privados.length) linea('pr', privados.map(textoRol).join(', '));
  const coments = [];
  for (const n of p.coment) for (const t of n.split(/,/).map(x => x.trim()))
    if (t && !coments.includes(t)) coments.push(t);
  if (coments.length) linea('', coments.join(', '));
  const urls = [], textos = [];
  for (const n of p.notas) for (const linea of n.split(/\s+\/\s+|,(?!\s)/)){
    let texto = '';
    for (const trozo of linea.split(/(https?:\/\/[^\s,]+)/)){
      if (/^https?:\/\//.test(trozo)){ if (!urls.includes(trozo)) urls.push(trozo); }
      else texto += trozo;
    }
    texto = texto.replace(/^[\s,]+|[\s,]+$/g, '');
    if (texto && !textos.includes(texto) && !coments.includes(texto)) textos.push(texto);
  }
  if (textos.length) linea('prv', textos.join(', '));
  if (par.childNodes.length){
    // rol, notas y contacto, en un panel que abre y cierra el triángulo al principio de la línea de su lugar (o de su nombre); cerrado al pintar (2026-11-08, el usuario)
    trianguloPanel(par, lineaLugar || d.lastElementChild);     // (al principio de la línea de su lugar; sin ella, de su nombre: el usuario)
    d.appendChild(par);
  }
  const fb = p.fb && esFb(p.fb) ? p.fb : '';
  // (sin las webs que ya salen en la lista de sus eventos: milonguero-milonguero.com en Victoria Huang; 2026-11-08, el usuario: "estan repetidos, no ponerlos")
  const eventos = organizaDe(p.nombre);
  const pagina = u => String(u).toLowerCase().replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/+$/, '');
  const deEventos = new Set(eventos.flatMap(ev => [ev.fb, ev.www]).filter(Boolean).map(pagina));
  // sus enlaces (Facebook, YouTube, sus webs), en la misma línea que su lugar: "▸ Benidorm, Spain  facebook  video" (2026-11-08, el usuario: "poner en una
  // linea los enlaces FB YT"); sin lugar, en la suya
  const logos = document.createElement('div');
  logosFicha(logos, img, {fb, www: [...(p.fb && !fb ? [p.fb] : []), ...urls.filter(u => !/youtu/.test(u) && u != p.fb)].filter(u => !deEventos.has(pagina(u))),
                              video: urls.find(u => /youtu/.test(u)) || ''});
  if (logos.firstElementChild){
    if (lineaLugar) lineaLugar.append(...logos.firstElementChild.childNodes);
    else d.insertBefore(logos.firstElementChild, par.parentNode == d ? par : null);
  }
  // los eventos que organiza (de los eventos: su org), tras la línea de su Facebook y su YouTube: uno por línea, con un punto, su nombre y
  // luego los logos de su Facebook y su web, si los tiene (2026-11-08, el usuario)
  for (const ev of eventos){
    const e = document.createElement('p');
    e.className = 'organiza';
    e.append('• ' + ev.nombre);
    for (const [u, icono] of [[ev.fb, 'img/perfil.svg'], [ev.www, 'img/web.svg']]) if (u){
      const a = enlace(u, '', icono);
      a.title = u;
      e.append(' ', a);
    }
    d.appendChild(e);
  }
}

function desdeHoy(p){
  if (isNaN(p.mes)) return 9999;
  if (enCursoEvt(p.fechaOrig)) return 0;   // empezado y sin terminar: el primero (antes, detrás de todo: como si fuera el año que viene)
  const hoy = new Date(), n = (m, d) => m * 31 + d;
  return (n(p.mes, p.dia) - n(hoy.getMonth(), hoy.getDate()) + 372) % 372;
}

let _centros = null;
const _centroDe = new Map();   // el centro de cada posición, una vez (2026-11-10: se pedía por cada persona en cada pinta)
function centroPos(pos){
  if (_centroDe.has(pos)) return _centroDe.get(pos);
  if (!_centros){
    _centros = new Map();
    for (const c of Object.values(typeof CIUDADES_COORD == 'undefined' ? {} : CIUDADES_COORD)){
      if (!c) continue;
      const k = Math.round(c[0] * 100) + ',' + Math.round(c[1] * 100);
      if (!_centros.has(k)) _centros.set(k, []);
      _centros.get(k).push(c);
    }
  }
  const la = Math.round(pos[0] * 100), lo = Math.round(pos[1] * 100), cos = Math.cos(pos[0] * Math.PI / 180);
  let mejor = null, dMejor = 1;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++)
    for (const c of _centros.get((la + i) + ',' + (lo + j)) || []){
      const d = 111.2 * Math.hypot(c[0] - pos[0], (c[1] - pos[1]) * cos);
      if (d <= dMejor){ mejor = c; dMejor = d; }
    }
  _centroDe.set(pos, mejor || pos);
  return mejor || pos;
}
const clavePos = pos => centroPos(pos).map(x => x.toFixed(3)).join(',');

const RADIOS = [[1, 4.5], [2, 6.75], [4, 9], [8, 11.25], [16, 13.5], [32, 15.75]];
function radioDe(n){
  for (let i = 1; i < RADIOS.length; i++){
    const [n0, r0] = RADIOS[i - 1], [n1, r1] = RADIOS[i];
    if (n <= n1) return r0 + (r1 - r0) * (n - n0) / (n1 - n0);
  }
  return RADIOS[RADIOS.length - 1][1];
}
const ESTILO_PAIS = {fill: true, fillOpacity: 1, fillColor: paleta('mapaPais'), weight: .6, color: paleta('mapaBorde'), opacity: 1};

function boundsPais(l){
  const partes = l.getLatLngs().map(p => L.latLngBounds(p[0]));
  const tam = b => (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
  const mayor = Math.max(...partes.map(tam));
  return partes.filter(b => tam(b) >= mayor / 4)
               .reduce((a, b) => a ? a.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()), null);
}
const VISTA_AREA = {Europe: [[34, -25], [71, 45]], Asia: [[-11, 60], [55, 150]], America: [[-56, -130], [60, -34]],
                    Africa: [[-35, -18], [38, 52]], Oceania: [[-48, 110], [0, 180]]};
function encuadra(conPos){
  const locales = conPos.filter(p => !p.zona);
  if (locales.length) conPos = locales;
  if (paisSel){
    const suyos = conPos.filter(p => paisSel.feature.properties.nombres.includes(p.pais));
    const bp = boundsPais(paisSel);
    return vuela(suyos.length ? L.latLngBounds(suyos.map(p => p.pos)) : bp, bp);     // (b son los puntos: vuela los encaja)
  }
  if (areaMapa && VISTA_AREA[areaMapa]){
    const b = L.latLngBounds(VISTA_AREA[areaMapa]);
    for (const p of conPos) b.extend(p.pos);
    return vuela(b, null, MAS_AREA, conPos.length ? L.latLngBounds(conPos.map(p => p.pos)) : b);
  }
  if (!conPos.length) return;
  const paises = new Set(conPos.map(p => p.pais));
  let tope = null;
  if (capaPaises) capaPaises.eachLayer(l => {
    if (!l.feature.properties.nombres.some(n => paises.has(n))) return;
    const bp = boundsPais(l);
    tope = tope ? tope.extend(bp) : bp;
  });

}
const MAS_PAIS = .5;
const MAS_AREA = .5;
let vistaMapa = null;   // [centro, zoom] del último encuadre (vuela)
const mapaMovido = () => !!(mapa && mapaAbierto && vistaMapa)
  && (Math.abs(mapa.getZoom() - vistaMapa[1]) > .01 || mapa.latLngToContainerPoint(vistaMapa[0]).distanceTo(mapa.getSize().divideBy(2)) > 2);
function vuela(b, tope, mas = 0, puntos = b){   // puntos: los de los marcadores (b puede ser más grande: el área entera)
  // (el margen: el círculo mayor y 4 px, también arriba y abajo; antes VERT = PAD + 26, por el botón map: en el mapa del panel, de 142 px de alto, 92 eran margen y
  // los puntos cabían en 50; 2026-11-08, el usuario: "aumenta el zoom del mapa para tener menos padding")
  const PAD = Math.ceil(RADIOS[RADIOS.length - 1][1]) + 4;
  const z = x => mapa.getBoundsZoom(x, false, L.point(2 * PAD, 2 * PAD));
  // los marcadores de los extremos, siempre dentro (2026-11-08, el usuario: "los marcadores maximos deben estar dentro del mapa, alto,bajo,derecha,izquierda"):
  // nunca más zoom del que los encaja, y el centro movido lo justo para que quepan
  let zoom = Math.min(z(b) + mas, z(puntos), 10);
  if (tope) zoom = Math.min(zoom, z(tope.extend(b)) + MAS_PAIS);
  const px = p => mapa.project(p, zoom), medio = mapa.getSize().divideBy(2);
  const c = px(b.getNorthWest()).add(px(b.getSouthEast())).divideBy(2), nw = px(puntos.getNorthWest()), se = px(puntos.getSouthEast());
  const entre = (v, lo, hi) => lo > hi ? (lo + hi) / 2 : Math.min(Math.max(v, lo), hi);
  c.x = entre(c.x, se.x + PAD - medio.x, nw.x - PAD + medio.x);
  c.y = entre(c.y, se.y + PAD - medio.y, nw.y - PAD + medio.y);
  const centro = mapa.unproject(c, zoom);
  vistaMapa = [centro, zoom];
  if (mapa._loaded) mapa.flyTo(centro, zoom, {duration: .8});
  else mapa.setView(centro, zoom);
}

function pintaMapa0(lista, area, conMapa){
  const div = $('mapa'), caja = $('mapaCaja'), conPos = posMapa = lista.filter(p => p.pos), hay = conPos.length || conMapa;
  $('bMapa').disabled = !hay;
  $('bMapa').innerHTML = (!hay ? '•' : '<span class="iMapa">' + (mapaAbierto ? '▴' : '▾') + '</span>') + ' map';
  $('bMapa').title = !hay ? 'map: not applicable here' : 'show / hide the map';
  caja.classList.toggle('cerrado', !mapaAbierto);
  div.classList.toggle('oculto', !mapaAbierto);
  if (!mapaAbierto){ caja.classList.toggle('oculto', !hay); mapaPendiente = [lista, area, conMapa]; return pintaCiudades(); }
  mapaPendiente = null;
  areaMapa = area == TODOS ? null : area;
  if (typeof L == 'undefined') return avisoMapa('no se ha podido cargar Leaflet (leaflet/leaflet.js)');
  caja.classList.toggle('oculto', !hay);
  if (!hay) return;
  if (!mapa){
    mapa = L.map(div, {worldCopyJump: true, zoomSnap: .25, zoomControl: false});   // sin el + y el -: zoom con la rueda, el pellizco o el doble clic
    mapa.attributionControl.setPrefix(false);
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
    L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                {maxZoom: 16, className: 'teselaBase', attribution: '&copy; Esri, OpenStreetMap'}).addTo(mapa);
    const paises = mapa.createPane('paises');
    paises.style.zIndex = 250;
    paises.style.transition = 'opacity .3s';
    const atenua = () => paises.style.opacity = Math.max(.1, Math.min(1, 1 - (mapa.getZoom() - 7) * .45));
    mapa.on('zoomend', atenua);
    const nombres = mapa.createPane('nombres');
    nombres.style.zIndex = 260;
    nombres.style.pointerEvents = 'none';
    L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, className: 'teselaNombres', pane: 'nombres'}).addTo(mapa);
    if (creaPaises()) capaPaises.addTo(mapa);
    capaMapa = L.layerGroup().addTo(mapa);
    mapa.on('moveend', pintaCiudades);
  }
  mapa.invalidateSize();
  capaMapa.clearLayers();
  const porLugar = new Map();
  for (const p of conPos){
    const k = claveMarca(p);
    if (!porLugar.has(k)) porLugar.set(k, []);
    porLugar.get(k).push(p);
  }
  marcadores.clear();
  porLugarMapa = porLugar;
  for (const [k, ps] of porLugar){
    const ciudad = deCiudadSel(k) || k == marcaFicha;
    const estilo = k == marcaFicha ? ESTILO_CIUDAD : ciudad ? ESTILO_LUGAR : {color: BORDE_MARCA, fillColor: COLOR_MARCA, weight: 1, fillOpacity: 0};
    const m = ps.every(p => p.lista) ? marcaLista(centroPos(ps[0].pos), estilo)
            : (ps.some(p => p.zona) ? marcaCuadrada : L.circleMarker)(centroPos(ps[0].pos), {radius: radioDe(ps.length), opacity: 1, ...estilo});
    const nombre = nombreMarca(ps);
    if (nombre) m.bindTooltip(nombre + ' (' + ps.length + ')', {direction: 'top', offset: [0, -6], className: 'tipNombre'});   // al pasar por encima: su ciudad o país (cuántos)
    m.on('tooltipopen', () => { if (trasClic) m.closeTooltip(); });
    m.on('mouseout', () => { trasClic = false; });
    m.on('click', () => {
      trasClic = true;
      m.closeTooltip();
      lugarSel = lugarSel == k ? null : k;
      ciudadSel = null;
      soloBuscado = false;
      // con la ciudad, su país: en el mapa el país con sus ciudades (encuadrado si cambia) y la elegida resaltada
      const antes = paisSel;
      if (lugarSel && capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(ps[0].pais)) paisSel = l; });
      if (lugarSel) etiqueta(centroPos(ps[0].pos), nombre, 'lugar');   // al pulsar: solo el nombre (su ciudad o país)
      sinEncuadre = paisSel === antes;
      pinta();
    });
    capaMapa.addLayer(m);
    marcadores.set(k, m);
    if (ciudad) m.bringToFront();
  }
  estiloPaises();
  if (etiquetaDe && !{pais: paisSel, lugar: lugarSel, ciudad: ciudadSel}[etiquetaDe]) mapa.closeTooltip(tipMapa);
  if (!sinEncuadre) encuadra(conPos);
  sinEncuadre = false;
  pintaCiudades();   // y otra vez al acabar de encuadrar (moveend)
}

// los lugares de las marcas que se ven en el mapa, en su panel a la derecha del mapa: en el nivel de área los
// países (de baseLugares: todo el listado sin el país); con un país, una ciudad o un lugar elegidos, sus ciudades.
// Primero los de más líneas en el listado (lineasCiudad y lineasPais, de pinta); con más de los que caben, el
// scroll. Al lado de cada nombre, ese número; al pulsarlo, se elige
let lineasCiudad = () => 0, lineasPais = () => 0, baseLugares = [];
// al pulsar una ciudad de la lista (con líneas en el listado) o elegirla en el buscador (CIT): como su marca,
// la ciudad c (pais|ciudad) elegida en el listado y en el mapa, con su país
function eligeCiudad(c, nombre){
  const pais = c.split('|')[0], p = personas.find(p => ciudadDe(p) == c && p.pos), antes = paisSel;
  lugarSel = null;
  ciudadSel = c;
  soloBuscado = false;
  if (capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(pais)) paisSel = l; });
  if (p && mapa) etiqueta(centroPos(p.pos), nombre, 'ciudad');
  sinEncuadre = paisSel === antes;
  pinta();
}
// al pulsar un país de la lista (nivel de área): como pulsarlo en el mapa
function eligePais(pais){
  let l = null;
  if (capaPaises) capaPaises.eachLayer(x => { if (!l && x.feature.properties.nombres.includes(pais)) l = x; });
  if (!l) return;
  paisSel = l;
  lugarSel = ciudadSel = null;
  soloBuscado = false;
  etiqueta(boundsPais(l).getCenter(), l.feature.properties.pais, 'pais');
  pinta();
}
function pintaCiudades(){
  const div = $('ciudadesMapa'), vista = mapa && mapaAbierto ? mapa.getBounds() : null, nombres = new Map(), dePais = !!(ciudadSel || lugarSel || paisSel);   // con país, ciudad o lugar elegidos: las ciudades (del país); si no, países
  for (const p of dePais ? posMapa : baseLugares){   // las ciudades, de lo que pinta el mapa (con un país elegido, solo las suyas); los países, de todo el listado
    if (vista && !vista.contains(centroPos(p.pos))) continue;   // con el mapa oculto, todos: la lista sigue viva
    if (dePais && p.ciudad) nombres.set(ciudadDe(p), p.ciudad);
    else if (!dePais && p.pais && p.pais != '-') nombres.set(p.pais, p.pais);
  }
  const lineas = dePais ? lineasCiudad : lineasPais, elige = dePais ? eligeCiudad : eligePais;
  const n = new Map([...nombres.keys()].map(c => [c, lineas(c)]));
  const ciudades = [...nombres].sort((x, y) => n.get(y[0]) - n.get(x[0]) || x[1].localeCompare(y[1]));   // primero las de más líneas
  div.scrollTop = 0;
  // back, con el logo de volver: la flecha que gira a la izquierda (2026-11-10, el usuario: "para << usa un logo de volver"; antes, el doble chevron «)
  const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
               '<path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>back';
  const navega = (clase, html, pulsa) => { const s = document.createElement('span'); s.className = clase; s.innerHTML = html; s.onclick = pulsa; return s; };
  const atras = dePais && navega('atras', BACK, () => {   // de las ciudades (con país, ciudad o lugar elegidos), a los países del área; las fechas (año y mes), los días y los roles, a cero
    lugarSel = ciudadSel = paisSel = null;
    fechaSel = F_DOCE;
    diasSel.clear();
    rolesSel.clear();
    soloBuscado = false;
    pinta();
  });
  const lugar = lugarSel && (porLugarMapa.get(lugarSel) || [])[0];
  const elegida = ciudadSel || (lugar ? ciudadDe(lugar) : null);   // la ciudad elegida (o la del lugar elegido)
  const celdas = ciudades.map(([c, nombre]) => {
    const s = document.createElement('span');
    s.classList.toggle('sel', dePais && c == elegida);
    const nom = document.createElement('span'), num = document.createElement('span');
    nom.className = 'nom';
    nom.textContent = nom.title = nombre;
    num.className = 'num';
    num.textContent = n.get(c);
    s.append(nom, num);
    s.classList.toggle('cero', !n.get(c));   // con el listado a cero, sin clic
    s.onclick = () => {   // con el listado a cero, nada; si no, sale la etiqueta blanca del mapa
      if (!n.get(c)) return;
      elige(c, nombre);
    };
    return s;
  });
  // por páginas, de 2 columnas: en la primera celda back, en la última more... (en pantalla estrecha, scroll)
  const cabe = !isMovil() ? 2 * MAX_FILAS_PANEL : Infinity;
  const vistas = [];   // dónde empezaba cada página anterior
  const pagina = desde => {
    const vuelve = vistas.length ? navega('atras', BACK, () => pagina(vistas.pop())) : atras;
    let sitio = cabe - (vuelve ? 1 : 0);
    const hayMas = celdas.length - desde > sitio;
    if (hayMas) sitio--;
    const mas = hayMas && navega('mas', 'more ...', () => { vistas.push(desde); pagina(desde + sitio); });
    const vista = [vuelve, ...celdas.slice(desde, desde + sitio), mas].filter(Boolean);
    if (cabe < Infinity) while (vista.length < cabe) vista.push(navega('hueco', '', null));   // siempre todas las celdas: las que falten, de relleno (2026-11-04, el usuario: "siempre 12 celdas")
    div.replaceChildren(...vista);
    div.style.setProperty('--filas', Math.ceil(vista.length / 2));
  };
  pagina(0);
  const sel = celdas.find(s => s.classList.contains('sel'));
  while (sel && !sel.isConnected) div.querySelector('.mas').click();   // la elegida, a la vista

const PRIMEROS = {[LIS]: 'sources',   /* (2026-11-10, el usuario: "cambia sources por link en el selector de tipo"; antes, links) */ [FES]: 'festival', [SEM]: 'seminar', [ACA]: 'academy', [MIL]: 'milonga', [PRA]: 'practica', [PEO]: 'tanguer@', couple: 'artist couple',   /* (2026-11-10, el usuario: "usa artis couple en vez de couple") */ org: 'organizer', art: 'artist'};

  const lugar = lugarSel && ((porLugarMapa.get(lugarSel) || [])[0] || personas.find(p => p.pos && claveMarca(p) == lugarSel));   // con el mapa cerrado, porLugarMapa puede no tenerlo

  const quitaResto = () => { fechaSel = F_DOCE; diasSel.clear(); rolesSel.clear(); soloBuscado = false; };
  const conResto = () => fechaSel != F_DOCE || diasSel.size || rolesSel.size || soloBuscado;

  const aNivel = (yaEsta, quita) => () => {

                  [r == TODOS ? 'all' : PRIMEROS[r] || textoRol(r)],   // el tipo, sin clic: se cambia en su selector

// la url de la ruta (lo de las migas, sin el mapa ni la vista): ?a= área, b= tipo; lo buscado, ?id=; si no, pa= país,
// ci= ciudad (pais|ciudad), lu= lugar (su marca), f= fecha (2026, 2026-12; sin f, this year), w= días (0-6), r= roles
function buscaRuta(){   // el ?... de la ruta
  const q = new URLSearchParams(), sa = $('selArea');
  const a = paisSel ? areaPrevia : sa.value || sa.dataset.inicial;
  if (a) q.set('a', a);
  q.set('b', $('selRol').value || $('selRol').dataset.inicial || TODOS);
  const id = soloBuscado && buscado && (buscado.ids || [])[0];
  if (id) q.set('id', id);
  else {
    if (lugarSel) q.set('lu', lugarSel);
    else if (ciudadSel) q.set('ci', ciudadSel);
    else if (paisSel) q.set('pa', paisSel.feature.properties.nombres[0]);
    const f = FECHAS[fechaSel];
    if (f && !f.doce) q.set('f', f.anyo + (f.mes === undefined ? '' : '-' + (f.mes + 1)));
    if (diasSel.size) q.set('w', [...diasSel].join(','));
    if (rolesSel.size) q.set('r', [...rolesSel].join(','));
  }
  return '?' + q.toString().replace(/%2C/g, ',').replace(/%7C/g, '|');
}
function urlRuta(tw){   // tw: la de tangoworld (los mismos parámetros; publicada, /i del Worker; en local, app.tw)
  const busca = tw ? buscaRuta().replace(/([?&]b=)fes\b/, '$1' + EVT) : buscaRuta();   // tangoworld solo conoce evt
  if (tw) return URL_FICHA ? URL_FICHA.replace(/\/w$/, '/i') + busca : new URL('../app.tw/index.htm', location.href).href + busca;
  return URL_FICHA ? URL_FICHA + busca : location.origin + location.pathname + busca + location.hash;   // publicada, el Worker (/w; /i para tangoworld): sin la clave a la vista
}

  const orden = (x, y) => x.clave.startsWith(q) == y.clave.startsWith(q) ? porNombre(x.nombre, y.nombre) : x.clave.startsWith(q) ? -1 : 1;
  const ordenGeo = (x, y) => x.clave.startsWith(q) == y.clave.startsWith(q) ? y.n - x.n || x.nombre.localeCompare(y.nombre) : x.clave.startsWith(q) ? -1 : 1;
  encontradas = !q ? [] : [...lugaresSug().filter(g => g.clave.includes(q)).sort(ordenGeo),
                           ...personas.filter(p => p.clave.includes(q)).sort(orden)].slice(0, MAX_SUGS);
  activa = encontradas.length ? 0 : -1;
  d.innerHTML = '';
  encontradas.forEach((p, i) => {
    const o = document.createElement('div');
    const tipo = document.createElement('span');
    tipo.className = 'tipo' + (p.geo ? ' geo' + p.geo : !p.evento && !p.lista && p.tipoP == 'person' ? ' gente' : '');
    tipo.textContent = tipoSug(p);
    o.appendChild(tipo);
    o.append(p.nombre + ' ');
    const s = document.createElement('small');
    s.textContent = '— ' + detalle(p);
    o.appendChild(s);
    if (i == activa) o.className = 'activa';
    o.onmousedown = e => { e.preventDefault(); ir(p); };
    d.appendChild(o);
  });
  d.classList.toggle('oculto', !encontradas.length);
  colocaSugs();
}
function marca(i){
  activa = (i + encontradas.length) % encontradas.length;
  [...$('sugs').children].forEach((o, k) => o.classList.toggle('activa', k == activa));
  $('sugs').children[activa].scrollIntoView({block: 'nearest'});
}
// lo elegido en el buscador siempre se ve: pinta() deja todo como estaba si se queda a cero. Entonces, con todas las
// fechas y el primer tipo que tenga líneas allí (Madrid no tiene seminar: festivals); si ninguno, el listado vacío
function conLineas(elige, hecho){
  elige();
  if (hecho()) return;
  const tipo = $('selRol').value;
  for (const r of [tipo, FES, SEM, MIL, PRA, ACA, PEO]){
    $('selRol').value = r;
    fechaSel = F_DOCE;
    diasSel.clear();
    rolesSel.clear();
    elige();
    if (hecho()) return;
  }
  $('selRol').value = tipo;
  deTira = true;
  elige();
}
function irGeo(g){
  soloBuscado = false;
  buscado = null;
  enListado = true;
  if (g.geo == 'CIT'){   // una ciudad: lo mismo que pulsarla en el mapa
    mapaAbierto = true;
    conLineas(() => eligeCiudad(g.ciudad, g.nombre), () => ciudadSel == g.ciudad);
  } else if (g.geo == 'ARE'){
    lugarSel = ciudadSel = paisSel = null;
    conLineas(() => { $('selArea').value = g.nombre; pinta(); }, () => $('selArea').value == g.nombre);
  } else {
    lugarSel = ciudadSel = paisSel = null;
    mapaAbierto = true;
    sinEncuadre = true;
    pinta();
    const delPais = l => l && l.feature.properties.nombres.includes(g.nombre);
    conLineas(() => { if (capaPaises) capaPaises.eachLayer(l => { if (!delPais(paisSel) && delPais(l)) paisSel = l; }); pinta(); }, () => delPais(paisSel));
    if (delPais(paisSel)) etiqueta(boundsPais(paisSel).getCenter(), g.nombre, 'pais');
  }
  $('buscar').value = '';
  $('sugs').classList.add('oculto');
  $('buscar').blur();
}
function ir(p){
  if (p.geo) return irGeo(p);
  buscado = p;
  soloBuscado = true;
  enListado = true;
  $('selRol').value = p.evento || p.lista ? p.roles[0] : TIPOS_P.includes(p.tipoP) ? p.tipoP : PEO;   // (group, couple: no están en people, enRol)
  $('selArea').value = p.area == MUNDIAL ? TODOS : p.area;
  fechaSel = F_DOCE;
  lugarSel = ciudadSel = paisSel = null;
  if (capaPaises) capaPaises.eachLayer(l => { if (!paisSel && l.feature.properties.nombres.includes(p.pais)) paisSel = l; });
  pinta();
  if (paisSel) etiqueta(p.pos || paisSel.getBounds().getCenter(), paisSel.feature.properties.pais, 'pais');
  iluminaFicha(p);
  const c = document.getElementById('f' + p.id);
  if (c){
    c.classList.add('encontrado');
    c.scrollIntoView({block: 'center'});
  }
  $('buscar').value = '';
  $('sugs').classList.add('oculto');
  $('buscar').blur();
}
function teclaBuscar(e){
  if (!encontradas.length) return;
  if (e.key == 'ArrowDown'){ marca(activa + 1); e.preventDefault(); }
  else if (e.key == 'ArrowUp'){ marca(activa - 1); e.preventDefault(); }
  else if (e.key == 'Enter') ir(encontradas[activa]);
  else if (e.key == 'Escape') $('sugs').classList.add('oculto');
}

function muestraInfo(){
  $('fCuerpo').innerHTML = '';
  const d = document.createElement('div');
  d.className = 'texto';
  d.innerHTML = '<iframe id="kkTexto" src="atribucionkk.htm?v=public version" title="KoKoTango"></iframe>' +   // el mismo que tangoworld
                '<p class="enlaces"><a id="aTw" href="#" target="_blank" rel="noopener">⇒ go to tangoworld</a></p>';   // con la ruta de las migas
  $('fCuerpo').appendChild(d);
  $('aTw').onclick = () => { $('aTw').href = urlRuta(true); };
  $('ficha').showModal();
  return false;
}

// OPEN SCHEDULER: las milongas (o prácticas) de una ciudad en una semana, de lunes a domingo: una fila por local y una columna por día, con su fecha debajo
let semanaAgenda = 0;   // semanas desde la actual (el cursor)
let horasAgenda = false;   // BY TIME: una fila por hora de inicio; BY VENUE, una por local
let agendaDe = () => [];   // las de la ciudad elegida: la pone pinta()
const localDe = p => p.sala || p.nombre;   // sin sala conocida, la propia milonga
function saleEl(p, d){   // la milonga p se hace el día d (a medianoche); las de fecha EVT, todos sus días
  const e = leeEvt(p.fechaOrig);
  return e ? !!e.ini && e.ini <= d && d <= e.fin : saleReg(p.fechaOrig, d);
}
function fichaEncima(p){   // la ficha de p, sobre la tabla: al cerrarla se sigue en la misma semana
  $('fCuerpo').innerHTML = '';
  rellena($('fCuerpo'), p);
  $('ficha').showModal();
}
function botonLocal(f){   // su enlace (el de la línea venue de la ficha) o, sin él, su mapa; sin ninguno, la ficha de su primera milonga
  const ps = f.celdas.flat(), url = [...ps.map(p => p.salaFb), ...ps.map(p => p.mapa)].find(Boolean);
  const b = document.createElement('button');
  b.className = 'sesion local';
  b.textContent = f.nombre;
  b.onclick = () => url ? window.open(url, '_blank', 'noopener') : fichaEncima(ps[0]);
  return b;
}
function botonSesion(p){   // por locales, dos líneas: la hora (y la estrella de las especiales, que no tienen hora) y el nombre; por horas, una: el local, y la milonga en el hover. Al pulsar, su ficha encima de la tabla
  const b = document.createElement('button');
  const linea = clase => { const s = document.createElement('span'); s.className = clase; b.appendChild(s); return s; };
  const primera = linea(horasAgenda ? 'nom' : 'hora');
  b.className = 'sesion';
  b.title = p.nombre;
  if (especial(p)) primera.appendChild(logoEspecial());
  if (horasAgenda) primera.append(localDe(p));
  else {
    if (horaDe(p) != '9999') primera.append(horaDe(p));
    linea('nom').textContent = p.nombre;
  }
  b.onclick = () => fichaEncima(p);
  return b;
}
function pintaAgenda(){
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const lunes = hoy.getDate() - (hoy.getDay() + 6) % 7 + 7 * semanaAgenda;
  const dias = [0, 1, 2, 3, 4, 5, 6].map(k => new Date(hoy.getFullYear(), hoy.getMonth(), lunes + k));
  const grupos = new Map();
  for (const p of agendaDe()) dias.forEach((d, k) => {
    if (!saleEl(p, d)) return;
    const nombre = horasAgenda ? horaDe(p) : localDe(p), clave = sinAcentos(nombre);
    if (!grupos.has(clave)) grupos.set(clave, {nombre, celdas: dias.map(() => [])});
    grupos.get(clave).celdas[k].push(p);
  });
  const filas = [...grupos.values()].sort((x, y) => x.nombre.localeCompare(y.nombre));   // por horas, 9999 (sin hora) al final
  const donde = textoDonde($('selArea').value), nombreRol = PRIMEROS[$('selRol').value] + 's';
  const celda = (tipo, clase) => {
    const c = document.createElement(tipo);
    if (clase) c.className = clase;
    return c;
  };
  const claseDia = d => d.getTime() == hoy.getTime() ? 'hoy' : '';
  const rol = celda('span', 'aRol');
  rol.textContent = nombreRol + ' in ';
  $('aTitulo').replaceChildren(rol, donde);
  const cabeza = celda('th');
  cabeza.textContent = horasAgenda ? 'time' : 'venue';
  $('aDias').replaceChildren(cabeza, ...dias.map(d => {
    const c = celda('th', claseDia(d)), f = celda('small');
    f.append(MESES[d.getMonth()] + '.', document.createElement('wbr'), dos(d.getDate()));   // sin sitio, en dos líneas
    c.append(DIAS_SEM[d.getDay()], document.createElement('br'), f);
    return c;
  }));
  $('aFilas').replaceChildren(...filas.map(f => {
    const tr = celda('tr'), local = celda('th');
    if (horasAgenda) local.textContent = f.nombre == '9999' ? 'no time' : f.nombre;
    else local.appendChild(botonLocal(f));
    local.scope = 'row';
    tr.appendChild(local);
    for (const ps of f.celdas){
      const c = celda('td');
      ps.sort((x, y) => horaDe(x).localeCompare(horaDe(y)) || localDe(x).localeCompare(localDe(y)) || x.nombre.localeCompare(y.nombre)).forEach(p => c.appendChild(botonSesion(p)));
      tr.appendChild(c);
    }
    return tr;
  }));
  if (!filas.length){
    const c = celda('td', 'vacio'), tr = celda('tr');
    c.textContent = 'No ' + nombreRol + ' in ' + donde + ' this week';
    tr.appendChild(c);
    $('aFilas').appendChild(tr);
  }
  $('aScroll').scrollTop = 0;
}
const mueveSemana = n => { semanaAgenda += n; pintaAgenda(); };

function conecta(){
  $('buscar').oninput = muestra;
  $('buscar').onfocus = muestra;
  $('buscar').onblur = () => $('sugs').classList.add('oculto');
  $('buscar').onkeydown = teclaBuscar;
  $('info').onclick = muestraInfo;
  window.addEventListener('message', e => {
    const f = $('kkTexto');
    if (f && e.source == f.contentWindow && e.data.kkAlto > 0) f.style.height = e.data.kkAlto + 'px';
  });
  $('fCerrar').onclick = () => $('ficha').close();
  const abreAgenda = porHoras => { horasAgenda = porHoras; semanaAgenda = 0; pintaAgenda(); $('agenda').showModal(); };
  $('bAgenda').onclick = () => abreAgenda(false);
  $('bAgenda2').onclick = () => abreAgenda(true);
  $('aCerrar').onclick = () => $('agenda').close();
  $('agenda').onclick = e => { if (e.target == $('agenda')) $('agenda').close(); };
  $('agenda').onkeydown = e => { if (e.key == 'ArrowLeft') mueveSemana(-1); else if (e.key == 'ArrowRight') mueveSemana(1); };
  $('aAtras').onclick = () => mueveSemana(-1);
  $('aSigue').onclick = () => mueveSemana(1);
  $('ficha').onclick = e => { if (e.target == $('ficha')) $('ficha').close(); };
  $('dCerrar').onclick = cierraFicha;
  $('bMapa').onclick = abreCierraMapa;
  $('bListado').onclick = () => { enListado = !enListado; sinEncuadre = true; pinta(); };
  window.addEventListener('resize', () => { if (!enListado) columnasParrilla(); });
  document.addEventListener('keydown', e => {
    if (e.key == 'Escape') return cierraFicha();
    if ((e.key != 'ArrowDown' && e.key != 'ArrowUp') || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    // los cursores, para el listado: no con la parrilla, ni con un popup abierto, ni en un selector, ni en el buscador con texto o con sugerencias (son suyos)
    const t = e.target, deOtro = /^(SELECT|OPTION|TEXTAREA)$/.test(t.tagName) || (t.tagName == 'INPUT' && (t.value || encontradas.length));
    if (!enListado || deOtro || document.querySelector('dialog[open]')) return;
    e.preventDefault();   // sin mover la página
    mueveFila(e.key == 'ArrowDown' ? 1 : -1);
  });
  $('selArea').onchange = () => { lugarSel = ciudadSel = paisSel = null; soloBuscado = false; pinta(); };
  $('selRol').onchange = () => {   // la ciudad elegida se mantiene: el lugar pinchado en el mapa pasa a ser su ciudad
    const p = lugarSel && (porLugarMapa.get(lugarSel) || []).find(p => p.ciudad);
    if (p) ciudadSel = ciudadDe(p);
    lugarSel = null;
    soloBuscado = false;
    pinta();
  };
  // volver a elegir el área que ya se ve quita el país (change no salta): en base-select, con el clic en su opción
  if (CSS.supports('appearance', 'base-select')) $('selArea').addEventListener('click', e => {
    const o = e.target.closest('option');
    if (o && o.value == $('selArea').value && (paisSel || ciudadSel || lugarSel)) $('selArea').onchange();
  });
  else {   // en el desplegable del navegador, vacío mientras está abierto: cualquier opción salta
    let areaAntes = null;
    $('selArea').addEventListener('pointerdown', () => {
      if ($('selArea').selectedIndex < 0) return;
      areaAntes = $('selArea').value;
      $('selArea').selectedOptions[0].classList.add('actual');
      $('selArea').selectedIndex = -1;
    });
    $('selArea').addEventListener('blur', () => {
      if ($('selArea').selectedIndex < 0 && areaAntes !== null) $('selArea').value = areaAntes;
      for (const o of $('selArea').options) o.classList.remove('actual');
      areaAntes = null;
    });
  }
}

function deUrl(){
  const q = new URLSearchParams(location.search);
  if (q.get('a')) $('selArea').dataset.inicial = q.get('a');
  if (q.get('b')) $('selRol').dataset.inicial = q.get('b') == EVT || q.get('b') == 'mar' ? FES : q.get('b');   // los enlaces de antes, con b=evt o b=mar
  if (q.has('c')) enListado = !/^(grid|0|off|no)$/i.test(q.get('c'));
  if (q.has('d')) mapaAbierto = !/^(off|0|no)$/i.test(q.get('d'));
  idInicial = (q.get('id') || '').trim();
  rutaInicial = {pa: q.get('pa'), ci: q.get('ci'), lu: q.get('lu'), f: q.get('f'), w: q.get('w'), r: q.get('r')};
}
// el resto de la ruta de la url (urlRuta): la fecha, los días y los roles; luego el lugar, la ciudad o el país, como al pulsarlos
let rutaInicial = {};
function abreRuta(){
  const {pa, ci, lu, f, w, r} = rutaInicial;
  if (f){
    const [anyo, mes] = f.split('-').map(Number), i = FECHAS.findIndex(x => !x.doce && x.anyo == anyo && (mes ? x.mes == mes - 1 : x.mes === undefined));
    if (i >= 0) fechaSel = i;
  }
  if (w) diasSel = new Set(w.split(',').map(Number).filter(d => d >= 0 && d <= 6));
  if (r) rolesSel = new Set(r.split(',').filter(Boolean));
  if (f || w || r) pinta();
  const enLu = lu && personas.find(p => p.pos && claveMarca(p) == lu);
  if (enLu){   // como pulsar su marca (aunque el mapa esté cerrado): el lugar, con su país
    lugarSel = lu;
    if (capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(enLu.pais)) paisSel = l; });
    pinta();
  }
  else if (ci) eligeCiudad(ci, ci.split('|')[1] || ci.split('|')[0]);
  else if (pa) eligePais(pa);
}
// ?id=<id del registro> (campo 10): abre esa ficha (evento, persona o lista) sola en el listado, como el buscador
let idInicial = '';
function abreId(){
  const p = idInicial && personas.find(x => (x.ids || []).includes(idInicial));
  if (!p) return;
  ir(p);
  abreFicha(p);
}

async function arranca(){
  if (!await descifra(t => $('listado').textContent = t)) return;
  deUrl();
  creaPaises();
  conecta();
  cargaFilas(personasTango());
  abreRuta();
  abreId();
  sinHistoria = false;
  if (!isMovil(true)) $('buscar').focus({preventScroll: true});   // al cargar, el foco en search (en el móvil no: sacaría el teclado)
}

arranca();
