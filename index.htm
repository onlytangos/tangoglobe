<!doctype html>
<!-- wwt/index.htm — wwt: eventos y personas por zona, con mapa (doc.htm) -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG</title>

<script src="datajs/aux.js"></script>
<script src="datajs/datos.cifrados.js"></script>
<script src="datajs/fotoid.js"></script>
<script src="datajs/ciudades.js"></script>
<script src="datajs/paises.js"></script>

<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
  :root { --maxFoto: 110px;   /* tamaño máximo de las fotos (= ANCHO_CARA) */ --altoTira: 27px; color-scheme: dark;
          --fondo: #222; --barra: #444; --tarjeta: #3a3a3a; --sinfoto: #474747;
          --texto: #eee; --suave: #999; --enlace: #8ab4f8; --borde: #555;
          --acento: #ffd8b0; }
  html { overflow-y: scroll; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--fondo); color: var(--texto); }
  a { color: var(--enlace); }

  .teselaBase { filter: sepia(1) hue-rotate(180deg) saturate(3) brightness(.85); }
  .teselaNombres { filter: sepia(.6) hue-rotate(180deg) saturate(1.5); }
  #mapa.leaflet-container { background: #0d1b2a; }

  #mapa .leaflet-control-attribution { background: transparent; color: #8899aa; font-size: 9px; }
  #mapa .leaflet-control-attribution a { color: inherit; }
  .creditos { font-size: .8em; color: var(--suave); }

  #mapa .leaflet-control-zoom { border: 1px solid var(--acento); }
  #mapa .leaflet-control-zoom a { background: var(--acento); color: #000; border-bottom-color: #0003;
                                 width: 20px; height: 20px; line-height: 20px; font-size: 15px; }
  #mapa .leaflet-control-zoom a:hover { background: #ffc890; }
  #mapa .leaflet-control-zoom a.leaflet-disabled { background: var(--acento); color: #0006; }
  .cuerpo a { text-decoration: none; font-weight: 600; }
  .cuerpo a:hover { color: var(--texto); }
  .cuerpo p.enlaces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .cuerpo p.enlaces a { display: inline-flex; align-items: center; gap: 5px; }
  .cuerpo .icono { height: 16px; width: auto; }
  .filtros { display: flex; justify-content: center; margin: -16px -16px 16px; padding: 4px 16px;
             position: sticky; top: 0; z-index: 2; background: var(--barra); box-shadow: 0 1px 6px rgba(0,0,0,.6); }
  select { font-size: 1em; padding: 4px 6px; background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #buscar { font-size: 1em; padding: 4px 6px; width: 100%; box-sizing: border-box;
             background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #info { display: flex; }
  .cuerpo.encontrado { outline: 2px solid var(--enlace); }
  .busca { position: relative; flex: 1 1 8.5em; min-width: 8.5em; }
  #selArea, #selRol { width: 9.5em; box-sizing: border-box; }
  #sugs { position: absolute; left: 0; top: 100%; margin-top: 4px; width: min(28em, 90vw); z-index: 2;
          background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.6);
          max-height: calc(10 * 26px); overflow-y: auto; }
  #sugs div { height: 26px; line-height: 26px; padding: 0 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sugs div.activa, #sugs div:hover { background: var(--barra); }
  #sugs small { color: var(--suave); }
  #sugs .tipo { display: inline-block; width: 3.2em; margin-right: 6px; font-size: .75em; font-weight: 600;
                text-align: center; color: var(--suave); border: 1px solid var(--borde); border-radius: 3px; line-height: 1.5; }

  #sugs .tipo.geoARE { background: #fffbe8; border-color: #fffbe8; color: #333; }
  #sugs .tipo.geoCON { background: #fff3b8; border-color: #fff3b8; color: #333; }
  #sugs .tipo.geoCIT { background: #ffe680; border-color: #ffe680; color: #333; }
  #sugs .tipo.gente { background: #9be39b; border-color: #9be39b; color: #333; }   /* personas de tipo people */
  #info img { width: 28px; height: 28px; opacity: .8; }
  #info:hover img { opacity: 1; }

  .parrilla { --cols: 8; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: stretch; }
  .parrilla .cara { flex: 0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols)); max-width: var(--maxFoto); }
  .cara { position: relative; margin: 0; background: #000; display: flex; flex-direction: column;
           border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .cara img, .cara .sinfoto { display: block; flex: none; width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; }
  .cara img.sinfoto, .cuerpo > img.sinfoto { background: var(--sinfoto); }

  .parrilla:not(.evts) .cara.evt { flex-basis: calc(2 * (100% - (var(--cols) - 1) * 6px) / var(--cols) + 6px); }
  .parrilla .cara.evt { max-width: calc(2 * var(--maxFoto) + 6px); }   /* un evento ocupa dos caras */
  .cara.evt img, .cara.evt .sinfoto { aspect-ratio: 16 / 9; object-fit: cover; }
  .cara figcaption { flex: none; height: calc(2.5em + 6px); box-sizing: border-box; padding: 3px; background: var(--barra); color: var(--texto);
                     font-size: .7em; line-height: 1.25; display: flex; align-items: center; justify-content: center;
                     text-align: center; overflow-wrap: anywhere; }
  .cara figcaption span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .yt { position: absolute; top: 3px; right: 3px; display: flex; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .yt img { width: 20px; height: 14px; }
  .cara img, .cara figcaption { cursor: pointer; }

  .cuerpo > img.conEnlace { cursor: pointer; }

  .cara.evt img.logo, .cuerpo > img.logo { object-fit: contain; background: #fff; padding: 6%; box-sizing: border-box; }

  .cuerpo > img.portada { flex: none; align-self: stretch; width: auto; height: auto; min-height: 90px;
                           max-width: min(50%, var(--maxFoto)); max-height: var(--maxFoto); aspect-ratio: 16 / 9; object-fit: cover; contain: size; }

  dialog { border: 1px solid var(--borde); border-radius: 8px; padding: 16px; width: min(520px, 90vw);
           background: var(--barra); color: var(--texto); box-shadow: 0 4px 24px rgba(0,0,0,.8); }
  dialog { margin-top: 56px; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .cuerpo { display: flex; gap: 14px; align-items: flex-start; }

  .cuerpo > img, .cuerpo > .sinfoto { flex: none; align-self: stretch; width: auto; height: auto; min-height: 90px;
                                        max-width: min(50%, var(--maxFoto)); max-height: var(--maxFoto); aspect-ratio: 1; object-fit: cover; border-radius: 6px;
                                        contain: size; }
  .cuerpo > img { background: #000; }
  .texto { flex: 1; min-width: 0; }
  dialog .texto { padding-right: 28px; }
  .cuerpo h2 { margin: 0 0 8px; font-size: 1.1em; }
  .cuerpo p { margin: 0; font-size: .9em; overflow-wrap: anywhere; }   /* líneas de texto seguidas; los enlaces, aparte (p.enlaces) */

  .listado { display: flex; flex-direction: column; gap: 8px; width: var(--anchoCab, 640px); max-width: 100%; box-sizing: border-box; margin: 0 auto; }
  .listado .cuerpo { padding: 12px; background: var(--barra); border: 1px solid var(--borde); border-radius: 8px; }
  .listado .cuerpo > img, .listado .cuerpo > .sinfoto { aspect-ratio: 16 / 9; }

  .cabecera { display: flex; flex-direction: column; gap: 4px; width: 41em; max-width: 100%; min-width: 0; }
  .linea1 { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center; }

  .cabecera:has(#fechas:not(.oculto)) .linea1 { width: 0; min-width: 100%; flex-wrap: nowrap; }
  .cabecera:has(#fechas:not(.oculto)) .linea1 > label { flex: 0 1 9.5em; min-width: 4.5em; }
  .cabecera:has(#fechas:not(.oculto)) .linea1 select { width: 100%; }
  .cabecera:has(#fechas:not(.oculto)) .busca { flex-basis: 5em; min-width: 5em; }
  .fechas { display: flex; flex-direction: column; gap: 4px; align-items: stretch; justify-content: center; min-width: 0; }

  .fechas.sinFechas { visibility: hidden; height: 0; overflow: hidden; margin-top: -4px; }
  .tira { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .fechas button, #bMapa, #bListado { flex: none; font-size: .85em; padding: 3px 7px; white-space: nowrap; cursor: pointer;
                   background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  .tira button { border-radius: 0; margin-left: -1px; }
  .tira button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .tira button:last-child { border-radius: 0 4px 4px 0; }
  .tira button { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; padding: 0 7px;
                 height: var(--altoTira); box-sizing: border-box; }   /* los meses y la ruta, de la misma altura */

  .tira { flex: 1 1 auto; }
  .tira button { flex: 1 0 auto; }
  .tira button.vacio { cursor: default; }
  .fechas button.activo { background: var(--acento); border-color: var(--acento); color: #000; position: relative; }

  .listado .cuerpo.linea { padding: 6px 12px; cursor: pointer; }
  .listado .linea h2 { flex: 1; min-width: 0; margin: 0; font-size: 1em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .listado .linea:hover { border-color: var(--enlace); }

  .listado.filas { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 0; border-top: 1px solid var(--borde); }
  .listado.filas.conFecha { grid-template-columns: auto auto minmax(0, 1fr) auto auto; }
  .listado .fila { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; column-gap: 16px; align-items: center;
                   padding: 5.5px 10px; border-bottom: 1px solid var(--borde); border-left: 2px solid transparent; cursor: pointer; }   /* 2026-10-26: un 10% más baja (antes 7px) */
  .listado .fila:hover { background: rgba(255, 255, 255, .04); }
  .listado .fila.abierta { background: var(--acento); color: #000; }
  .listado .fila.abierta .fFecha, .listado .fila.abierta .fLugar { color: #5c4a38; }
  .listado .fila.encontrado { outline: 0; border-left-color: var(--enlace); }
  .ruta { height: var(--altoTira); box-sizing: border-box; padding: 0 10px; line-height: calc(var(--altoTira) - 1px); font-size: .85em;   /* la de los botones de meses y días */ background: #333; color: var(--suave); border-bottom: 1px solid var(--borde);
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ruta .icono { height: 16px; width: auto; vertical-align: -3px; }
  .ruta .paso { color: var(--enlace); cursor: pointer; }
  .ruta .paso:hover { text-decoration: underline; }
  .fila span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }   /* todas con el mismo alto: centradas igual */
  .fila .fFecha, .fila .fLugar { color: var(--suave); font-size: .85em; font-variant-numeric: tabular-nums; }
  .fila .fNombre { font-weight: 500; position: relative; top: -1px; }   /* su letra, mayor: sin esto queda 1px más baja que la fecha y la ciudad */
  .fila .fNombre .fSala { color: var(--suave); font-size: .85em; font-weight: 400; }   /* milongas y prácticas: " - sala", con la letra de la ciudad */
  .listado .fila.abierta .fSala { color: #5c4a38; }
  .fila .fLugar { text-align: right; max-width: 18em; }
  .fila .fIconos { display: flex; align-self: center; min-width: 16px; }
  .fila .fIconos img { height: 16px; width: 16px; display: block; }
  /* el logo de la fila con su propio hover (como en el detalle): sobre él se resalta el logo, no la fila */
  .fila .fIconos a { display: block; padding: 3px; margin: -3px; border-radius: 4px; }
  .fila .fIconos a:hover { background: var(--enlace); }
  .listado .fila:has(.fIconos a:hover):not(.abierta) { background: none; }
  .fila .fMini { align-self: stretch; height: auto; min-height: 1.2em; aspect-ratio: 16 / 9; width: auto; contain: size;   /* el alto de la fila (contain: no la agranda) */
                 object-fit: cover; justify-self: end; border-radius: 2px; display: block; }
  .fila .fMini.sinfoto { background: var(--sinfoto); }
  .fila .fMini.logo { object-fit: contain; background: #fff; }
  @media (max-width: 600px) {
    .listado.filas { grid-template-columns: auto minmax(0, 1fr) auto; }
    .listado.filas.conFecha { grid-template-columns: auto auto minmax(0, 1fr) auto; }
    .fila .fLugar { grid-column: 2; text-align: left; max-width: none; }
    .conFecha .fila .fLugar { grid-column: 3; }
    .fila .fFecha, .fila .fIconos { grid-row: 1 / span 2; }
    .fila .fMini { grid-column: 3; grid-row: 1 / span 2; }
    .conFecha .fila .fMini { grid-column: 4; }
  }

  .leaflet-tooltip.tipNombre { background: #444; color: var(--texto); border: 1px solid var(--borde); box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .leaflet-tooltip-top.tipNombre::before { border-top-color: #444; }
  .marcaLista { box-sizing: border-box; border-radius: 2px; background: var(--acento); color: #000; }
  .marcaLista > div { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 8px; line-height: 1; }
  .mapaCaja { position: relative; z-index: 0; }
  .mapaCaja.cerrado { display: none; }
  /* las ciudades del mapa, a la izquierda en 1-2 columnas; en el hover, sus líneas del listado */
  .ciudadesMapa { position: absolute; top: 4px; left: 6px; z-index: 1000;   /* sobre las capas de Leaflet (400-1000) */ display: grid; grid-auto-flow: column; column-gap: 10px;
                  justify-items: start; font-size: 13px; line-height: 16px; pointer-events: none; }   /* 16px = ALTO_CIUDAD */
  .tipCiudad { position: absolute; z-index: 1001; pointer-events: none; box-sizing: border-box; min-width: 20px; height: 20px; padding: 0 4px;
               font-size: 11px; line-height: 18px; text-align: center; white-space: nowrap;   /* el contador, en un círculo */
               background: #444; color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .ciudadesMapa { background: rgba(47, 90, 143, .75); padding: 3px 7px; border-radius: 4px; }   /* azul (el de las áreas del mapa) al 75% */
  .ciudadesMapa:empty { display: none; }
  .ciudadesMapa span { pointer-events: auto; cursor: pointer; white-space: nowrap; color: var(--texto); text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .mapa { height: 202px; max-height: 28.8vh; border: 1px solid var(--borde); border-radius: 6px; }
  #bMapa:disabled { opacity: .45; cursor: default; }
  .linea1 #bMapa, .linea1 #bListado { font-size: 1em; padding: 4px 6px; width: 4.8em; box-sizing: border-box; text-align: center; }
  .iParrilla { position: relative; top: -2px; }
  @media (max-width: 600px) { .mapa { height: 144px; } }
  .aviso { color: var(--suave); }
  .oculto { display: none !important; }
  #fCerrar { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--suave); font-size: 1.3em; cursor: pointer; }
  #fCerrar:hover { color: var(--texto); }

  .detalle { position: relative; width: var(--anchoCab, 640px); max-width: 100%; box-sizing: border-box; margin: 0 auto 16px; padding: 16px; background: var(--barra);
             border: 1px solid var(--borde); border-radius: 8px; }

  .detalle { position: sticky; top: calc(var(--altoBarra, 0px) + 16px); z-index: 1; max-height: 60vh; overflow-y: auto;
             box-shadow: 0 -16px 0 var(--fondo), 0 16px 0 var(--fondo); }
  .detalle .texto { padding-right: 28px; }
  .detalle .texto > * { margin: 0; line-height: 22px; }   /* título, fecha, org, enlaces...: todas las líneas con el mismo interlineado */
  .detalle .texto p.enlaces { margin-top: 0; row-gap: 0; }
  #dCerrar { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--acento); font-size: 1.3em; font-weight: 700; cursor: pointer; }
  #dCerrar:hover { color: #ffc890; }

  .detalle.filas { background: var(--fondo); border: 0; border-radius: 0; border-top: 1px solid var(--borde);
                   border-bottom: 1px solid var(--borde); padding: 14px 10px; }
  .detalle.filas h2 { font-weight: 500; font-size: 1.05em; }
  .detalle.filas h2 .hLugar { color: var(--suave); font-size: .8em; font-weight: 400; margin-left: 10px; }
  .detalle.filas p { color: var(--suave); }
  .detalle.filas p.fFecha { font-variant-numeric: tabular-nums; margin-top: 0; }
  .detalle.filas .cuerpo a { font-weight: 500; }
  .detalle.filas .cuerpo > img { border-radius: 3px; }
</style>
</head>
<body>
<div class="filtros">
 <div class="cabecera">
  <div class="linea1">
    <a id="info" href="#" title="KoKo Tango"><img src="img/koko.svg" alt="KoKo Tango"></a>
    <span class="busca"><input id="buscar" type="search" placeholder="search" autocomplete="off"><div id="sugs" class="oculto"></div></span>
    <label><select id="selArea" data-inicial="Asia"></select></label>
    <label><select id="selRol" data-inicial="evt"></select></label>
    <button id="bMapa" title="show / hide the map">map</button>
    <button id="bListado" title="grid / list">list</button>
  </div>
  <div id="mapaCaja" class="mapaCaja oculto">
    <div id="mapa" class="mapa"></div>
    <div id="ciudadesMapa" class="ciudadesMapa"></div>
    <div id="tipCiudad" class="tipCiudad oculto"></div>
  </div>
  <div id="mapaAviso" class="aviso oculto"></div>
  <div id="fechas" class="fechas oculto">
    <div id="fBotones" class="tira"></div>
    <div id="rBotones" class="tira oculto"></div>
  </div>
  <div id="ruta" class="ruta"></div>
 </div>
</div>
<div id="detalle" class="detalle oculto"><button id="dCerrar" title="close">&times;</button><div id="dCuerpo" class="cuerpo"></div></div>
<div id="parrilla" class="parrilla oculto"></div>
<div id="listado" class="listado"></div>
<dialog id="ficha"><button id="fCerrar" title="close">&times;</button><div id="fCuerpo" class="cuerpo"></div></dialog>

<script>
const FOTOS = 'foto';
const TODOS = '*';
const ESTILO_LISTADO = 'filas';
history.scrollRestoration = 'manual';   // al cargar (o recargar), arriba: a la vista la primera línea del listado
let enListado = true;   // listado o parrilla de caras (botón list; ?c=grid / ?c=list)
const ANCHO_CARA = 110;   // = --maxFoto del CSS: tamaño máximo de las fotos
let soloEventos = false;
function columnasParrilla(evts){
  soloEventos = evts;
  const div = $('parrilla'), w = div.clientWidth || window.innerWidth, ancho = evts ? 2 * ANCHO_CARA : ANCHO_CARA;
  div.style.setProperty('--cols', Math.max(4, Math.floor((w + 6) / (ancho + 6))));   // sin tope: cada cara, ANCHO_CARA como mucho (--maxFoto)
  div.classList.toggle('evts', evts);
}
const EVT = 'evt';
const SEM = 'sem';
const ACA = 'aca';
const MIL = 'mil';
const PRA = 'pra';
const regular = r => r == MIL || r == PRA;   // milongas y prácticas: por días de la semana
const deEventos = r => r == EVT || r == SEM || r == ACA || regular(r);
const sinFecha = r => r == ACA || regular(r);
const rolEvento = t => String(t).indexOf('seminar') != -1 ? SEM : String(t).indexOf('academy') != -1 ? ACA
                     : String(t).split(' ')[0] == 'milonga' ? MIL : String(t).split(' ')[0] == 'practica' ? PRA : EVT;
const PEO = 'peo';
const TIPOS_P = Object.keys(TIPOS_PERSONA).filter(t => t != 'person');   // group, shop, hostel: en el selector, sin tiras
const LIS = 'lis';
const MUNDIAL = 'World';
const $ = id => document.getElementById(id);

function foto(idfoto, evento){
  const f = fotoDeId(idfoto, evento);
  return f ? FOTOS + f.carpeta + '/' + f.fichero : '';
}

const coordCiudad = r => (typeof CIUDADES_COORD == 'undefined' ? null
                          : CIUDADES_COORD[String(r[CAMPO.country]).trim() + '|' + String(r[CAMPO.city]).trim()]) || null;
function coordDe(r){
  const v = leeVarios(r), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  return !isNaN(la) && !isNaN(lo) ? [la, lo] : coordCiudad(r);
}
let _venues = null;
function venueDe(e){
  const loc = (leeVarios(e).loc || [])[0];
  if (!loc) return null;
  if (!_venues || !_venues.size) _venues = new Map(eventosTango().filter(x => x[CAMPO.tipo] == 'venue')
                                 .map(x => [x[CAMPO.country] + '|' + x[CAMPO.city] + '|' + x[CAMPO.name], x]));
  return _venues.get(e[CAMPO.country] + '|' + e[CAMPO.city] + '|' + loc) || null;
}
function urlSala(e){   // el Facebook (o la web) del venue de su sala, si lo tiene
  const v = venueDe(e), u = v ? String(v[CAMPO.urlfb] || '') : '';
  return /^https?:\/\//.test(u) ? u : '';
}
function dirSala(e){   // la dirección (dir) de la milonga o, si no la tiene, la de su venue
  const v = venueDe(e);

}
function posEvento(e){   // de momento, un círculo por ciudad: el centro de su ciudad; sin él, su lat/lon o la de su sala
  if (coordCiudad(e)) return coordCiudad(e);
  const v = leeVarios(e), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  if (!isNaN(la) && !isNaN(lo)) return [la, lo];
  const venue = venueDe(e);
  return venue ? coordDe(venue) : coordCiudad(e);
}

function cargaFilas(filas){
  const porClave = new Map();
  for (const c of filas){
    const f = foto(c[CAMPO.idfoto], false);
    const url = c[CAMPO.urlfb] && c[CAMPO.urlfb] != '-' ? c[CAMPO.urlfb] : '';
    const clave = f || url || 'nombre:' + c[CAMPO.name];
    const v = leeVarios(c);
    const coments = [...(v.txt || []), ...(v.ins || []).map(u => 'Instagram @' + u), ...(v.wec || []).map(w => 'WeChat ' + w),
                     ...(v.kak || []).map(k => 'Kakao ' + k), ...(v.tel || []).map(t => '☎ ' + t), ...(v.ema || [])];
    const notas = [...(v.vid || []), ...(v.www || []), ...(v.prv || [])].filter(x => x && x != '-').join(',');
    const fb = /facebook\.com\//.test(url) ? url : '';
    const area  = c[CAMPO.area] && c[CAMPO.area] != '-' ? c[CAMPO.area] : '-';
    const pais  = c[CAMPO.country] && c[CAMPO.country] != '-' ? c[CAMPO.country] : '-';
    const lugar = [c[CAMPO.city], c[CAMPO.country]].filter(x => x && x != '-').join(', ');
    const ciudad = c[CAMPO.city] && c[CAMPO.city] != '-' ? String(c[CAMPO.city]).trim() : '';
    const roles = String(c[CAMPO.roles] || '').split(',').map(r => r.trim()).filter(r => ROLES[r]);   // el import ya los deja con su nombre de ROLES
    const video = (v.vid || [''])[0];
    const p = porClave.get(clave);
    const pos = coordCiudad(c) || coordDe(c);   // como los eventos: el centro de su ciudad (posEvento)
    const tipoP = String(c[CAMPO.tipo] || '').trim() in TIPOS_PERSONA ? String(c[CAMPO.tipo]).trim() : 'person';
    if (!p){ porClave.set(clave, {area, pais, lugar, ciudad, pos, roles, tipoP, nombre: c[CAMPO.name], video, foto: f, fb, notas: notas ? [notas] : [],
                                     coment: coments, ids: [idDe(c)].filter(Boolean)}); continue; }
    if (idDe(c)) p.ids.push(idDe(c));
    if (!p.pos) p.pos = pos;
    if (!p.fb) p.fb = fb;
    if (p.tipoP == 'person') p.tipoP = tipoP;
    for (const t of coments) if (!p.coment.includes(t)) p.coment.push(t);
    if (notas && !p.notas.some(n => n.includes(notas))){
      p.notas = p.notas.filter(n => !notas.includes(n));
      p.notas.push(notas);
    }
    if (p.area == '-') p.area = area;
    if (p.pais == '-') p.pais = pais;
    if (!p.lugar) p.lugar = lugar;
    if (!p.ciudad) p.ciudad = ciudad;
    if (!p.video) p.video = video;
    for (const r of roles) if (!p.roles.includes(r)) p.roles.push(r);
  }
  personas = [...porClave.values(), ...eventos(), ...listas()];
  personas.forEach((p, i) => p.id = i);
  fotosDeLista(porClave);
  sugerencias();

}

const claveNom = (n, f) => String(n).toLowerCase().replace(/[^\p{L}\p{N}]/gu, '') + '#' + f;
const orgsDe = e => leeVarios(e).org || [];
const wwwDe = e => (leeVarios(e).www || [''])[0];
const inicio = d => {
  const f = String(d || '').split('.'), dia = parseInt(String(f[3] || '').split('-')[0]), mes = parseInt(f[1]), anyo = parseInt(f[4]);
  return f[0] == 'EVT' && !isNaN(dia + mes + anyo) ? Math.round(Date.UTC(anyo, mes, dia) / 864e5) : null;
};
function proximaReg(f, solo){   // solo: días de la semana (0 = domingo) a los que se limita
  const r = leeReg(f), hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const dias = r ? r.dias.filter(d => !solo || solo.includes(d)) : [];
  if (!dias.length) return null;
  if (r.frec != 'M'){
    const k = Math.min(...dias.map(d => (d - hoy.getDay() + 7) % 7));
    return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
  }
  const fechas = [0, 1].flatMap(m => r.semanas.map(s => {
    const primero = new Date(hoy.getFullYear(), hoy.getMonth() + m, 1);
    const dia1 = 1 + (dias[0] - primero.getDay() + 7) % 7;
    const ult = new Date(primero.getFullYear(), primero.getMonth() + 1, 0).getDate();
    const dia = s == 'L' ? dia1 + 7 * Math.floor((ult - dia1) / 7) : dia1 + 7 * (s - 1);
    return dia <= ult ? new Date(primero.getFullYear(), primero.getMonth(), dia) : null;
  }));
  return fechas.filter(d => d && d >= hoy).sort((a, b) => a - b)[0] || null;
}
function mapaDe(e){
  const venue = venueDe(e), v = leeVarios(e), vv = venue ? leeVarios(venue) : {};
  const dir = (v.dir || vv.dir || [''])[0];
  const lugar = [e[CAMPO.city], e[CAMPO.country]].map(x => String(x || '').trim())
                .filter(x => x && x != '-' && !dir.toLowerCase().includes(x.toLowerCase()));
  const trozos = [(v.loc || [''])[0], dir, ...lugar].join(', ').split(',').map(x => x.trim()).filter(Boolean);
  const texto = trozos.filter((x, i) => trozos.findIndex(y => y.toLowerCase() == x.toLowerCase()) == i).join(', ');
  const la = parseFloat((v.lat || vv.lat || [])[0]), lo = parseFloat((v.lon || vv.lon || [])[0]);
  const conPos = !isNaN(la) && !isNaN(lo);
  const q = texto || (conPos ? la + ',' + lo : '');
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
}
function eventos(){

    const url = /^https?:\/\//.test(e[CAMPO.urlfb] || '') ? e[CAMPO.urlfb] : '';
    const n = inicio(fechaDe(e));
    const claves = d => [...[url, wwwDe(e)].filter(Boolean).map(u => 'u:' + claveUrl(u) + '#' + (n == null ? fechaDe(e) : n + d)), n != null && 'n:' + claveNom(e[CAMPO.name], n + d)].filter(Boolean);
    const ya = [0, -1, 1].flatMap(d => n == null && d ? [] : claves(d)).map(k => porClave.get(k)).find(Boolean);
    if (ya){
      if (idDe(e)) ya.ids.push(idDe(e));
      if (!ya.fb && url) ya.fb = url;
      if (!ya.foto) ya.foto = fotoEvento(e);
      if (!ya.pos) ya.pos = posEvento(e);
      const orgs = orgsDe(e);
      for (const o of orgs) if (!ya.orgs.includes(o)) ya.orgs.push(o);
      if (wwwDe(e) && !ya.www.includes(wwwDe(e))) ya.www.push(wwwDe(e));
      if (!ya.video) ya.video = (leeVarios(e).vid || [''])[0];
      for (const k of claves(0)) if (!porClave.has(k)) porClave.set(k, ya);
      continue;
    }
    const f = fechaDe(e).split('.');
    const prox = f[0] == 'REG' ? proximaReg(fechaDe(e)) : null;
    const fecha = f[0] == 'EVT' ? [f[4], f[2], f[3]].filter(Boolean).join('.')
                : prox ? [prox.getFullYear(), MESES[prox.getMonth()], prox.getDate()].join('.') : '';
    const reg = f[0] == 'REG' ? textoReg(fechaDe(e)) : '';
    const orden = f[0] == 'EVT' ? (parseInt(f[4]) || 9999) * 100 + (parseInt(f[1]) || 0) : prox ? prox.getFullYear() * 100 + prox.getMonth() : 999999;
    const mes = f[0] == 'EVT' ? parseInt(f[1]) : prox ? prox.getMonth() : NaN, dia = prox ? prox.getDate() : parseInt(f[3]) || 1;
    const orgs = orgsDe(e);

                         lugar: e[CAMPO.city] && e[CAMPO.city] != '-' ? String(e[CAMPO.city]).trim() : '',

                         mapa: regular(rolEvento(e[CAMPO.tipo])) ? mapaDe(e) : '', mes, dia, orgs, www: wwwDe(e) ? [wwwDe(e)] : [],
                         video: (leeVarios(e).vid || [''])[0], notas: [], coment: [], ids: [idDe(e)].filter(Boolean)};
    for (const k of claves(0)) porClave.set(k, ev);

function fotosDeLista(porClave){

  for (const l of personas.filter(p => p.lista)){
    const autor = (l.nombre.match(/\(([^()]+)\)\s*$/) || [])[1];
    const p = autor && conFoto.find(p => p.nombre == autor || p.nombre.startsWith(autor + ' ('));
    if (p) l.foto = p.foto;
    const logo = !l.foto && LOGOS.find(([re]) => re.test(l.fb));
    if (logo){ l.foto = logo[1]; l.logo = true; }
  }
}

function centroPais(pais){
  if (typeof PAISES_GEO == 'undefined') return null;
  const f = PAISES_GEO.features.find(f => f.properties.nombres.includes(pais));
  if (!f) return null;
  const polis = f.geometry.type == 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const cajas = polis.map(p => { const xs = p[0].map(c => c[0]), ys = p[0].map(c => c[1]);
                                 return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const [x0, y0, x1, y1] = cajas.reduce((m, c) => (c[2] - c[0]) * (c[3] - c[1]) > (m[2] - m[0]) * (m[3] - m[1]) ? c : m);
  return [(y0 + y1) / 2, (x0 + x1) / 2];
}

}

function opciones(sel, valores, etiqueta, cuenta, todos = 'all'){
  const actual = sel.value || sel.dataset.inicial || TODOS;
  sel.innerHTML = '';
  const opcion = (dentro, v) => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = (v == TODOS ? todos : etiqueta(v)) + (cuenta ? ' (' + cuenta(v) + ')' : '');
    dentro.appendChild(o);
  };
  opcion(sel, TODOS);
  for (const v of valores){
    if (typeof v != 'object'){ opcion(sel, v); continue; }
    const g = document.createElement('optgroup');
    g.label = v.grupo;
    for (const w of v.valores) opcion(g, w);
    sel.appendChild(g);
  }
  sel.value = actual;
  if (sel.selectedIndex < 0) sel.value = TODOS;
}

function organizadores(){
  const organiza = new Map();
  for (const e of eventosTango()){
    if (e[CAMPO.tipo] == 'venue') continue;
    const url = /^https?:\/\//.test(e[CAMPO.urlfb] || '') ? e[CAMPO.urlfb] : '';

      if (!organiza.has(o)) organiza.set(o, []);
      if (!organiza.get(o).some(x => x.nombre == e[CAMPO.name])) organiza.get(o).push({nombre: e[CAMPO.name], url});
    }
  }
  return organiza;
}

const esFb = u => /^https?:\/\/([a-z]+\.)?(facebook\.com|fb\.com|fb\.me)\//i.test(u);
function enlace(href, texto, icono){
  const a = document.createElement('a');
  a.href = href; a.textContent = texto; a.target = '_blank'; a.rel = 'noopener';
  if (icono){
    const img = document.createElement('img');
    img.src = icono; img.alt = ''; img.className = 'icono';
    a.prepend(img);
  }
  return a;
}

function logosFicha(d, img, texto, {mapa = '', fb = '', www = [], video = ''}){
  const dominio = u => u.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
  const logos = [...(mapa ? [enlace(mapa, 'map', 'img/mapa.svg')] : []),
                 ...(fb ? [enlace(fb, 'facebook', 'img/perfil.svg')] : []),
                 ...www.map(u => enlace(u, dominio(u), 'img/web.svg')),
                 ...(video ? [enlace(video, 'video', 'img/yt.svg')] : [])];
  if (!texto && !logos.length) return;
  const par = document.createElement('p');
  par.className = 'enlaces';
  if (texto) par.append(texto);
  par.append(...logos);
  d.appendChild(par);
  if (logos.length && img){
    img.classList.add('conEnlace');
    img.title = logos[0].href;
    img.onclick = () => window.open(logos[0].href, '_blank', 'noopener');
  }
}

// milongas por días de la semana: un solo día a la vez (diasSel, con uno o vacío = todos)
const DIAS_SEM = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
let diasSel = new Set();
function proximaEn(p, dias){   // próxima fecha (desde hoy) de la milonga p en alguno de esos días (todos si no se dan); null si no hay
  const f = String(p.fechaOrig || '').split('.');
  if (f[0] != 'EVT') return proximaReg(p.fechaOrig, dias);
  const n = inicio(p.fechaOrig), hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  if (n == null) return null;
  const u = new Date(n * 864e5), d = new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate());
  return d >= hoy && (!dias || dias.includes(d.getDay())) ? d : null;
}
const horaDe = p => (leeReg(p.fechaOrig) || {hora: ''}).hora.slice(0, 4) || '9999';
const textoDia = d => DIAS_SEM[d.getDay()] + ' ' + MESES[d.getMonth()] + '.' + d.getDate();
function filasMilongas(lista){   // [{p, dia}] por fecha desde hoy: con días elegidos, una por cada uno en que se hace
  const filas = diasSel.size ? lista.flatMap(p => [...diasSel].map(d => ({p, dia: proximaEn(p, [d])}))).filter(x => x.dia)
                             : lista.map(p => ({p, dia: proximaEn(p)}));
  const t = x => x.dia ? x.dia.getTime() : Infinity;
  return filas.sort((x, y) => t(x) - t(y) || horaDe(x.p).localeCompare(horaDe(y.p)) || x.p.nombre.localeCompare(y.p.nombre));
}

function pintaRoles(cuenta){
  const tira = (div, claves) => {
    div.innerHTML = '';
    for (const k of claves){
      const b = document.createElement('button');
      b.textContent = k === null ? 'ALL' : k == PTC ? 'PTC' : textoRol(k);
      const cuantos = cuenta(k);   // el contador, solo en el hover
      b.title = (k === null ? 'all people' : k == PTC ? PTCS.map(textoRol).join(', ') : (ROLES[k] || {}).desc || b.textContent)
                + ' (' + cuantos + ')';
      b.classList.toggle('activo', k === null ? !rolesSel.size : rolesSel.has(k));

      pinta();

    div.appendChild(b);

}

function rellenaPersona(c, p, conLugar){

  const publicos = roles.filter(r => ROLES[r].publico), privados = roles.filter(r => !ROLES[r].publico);
  if (p.tipoP && p.tipoP != 'person') linea('type', p.tipoP);
  if (publicos.length) linea('rol', publicos.map(textoRol).join(', '));
  if (privados.length) linea('pr', privados.map(textoRol).join(', '));
  const eventos = organiza.get(p.nombre) || [];
  if (eventos.length)
    linea('org', ...eventos.flatMap((ev, i) => [...(i ? [', '] : []), ev.url ? enlace(ev.url, ev.nombre) : ev.nombre]));
  const coments = [];
  for (const n of p.coment) for (const t of n.split(/,/).map(x => x.trim()))
    if (t && !coments.includes(t)) coments.push(t);
  if (coments.length) linea('', coments.join(', '));
  const urls = [], textos = [];
  for (const n of p.notas) for (const linea of n.split(/\s+\/\s+|,(?!\s)/)){
    let texto = '';
    for (const trozo of linea.split(/(https?:\/\/[^\s,]+)/)){
      if (/^https?:\/\//.test(trozo)){ if (!urls.includes(trozo)) urls.push(trozo); }
      else texto += trozo;
    }
    texto = texto.replace(/^[\s,]+|[\s,]+$/g, '');
    if (texto && !textos.includes(texto) && !coments.includes(texto)) textos.push(texto);
  }
  if (textos.length) linea('prv', textos.join(', '));
  if (par.childNodes.length) d.appendChild(par);
  const fb = p.fb && esFb(p.fb) ? p.fb : '';
  logosFicha(d, img, '', {fb, www: [...(p.fb && !fb ? [p.fb] : []), ...urls.filter(u => !/youtu/.test(u) && u != p.fb)],
                          video: urls.find(u => /youtu/.test(u)) || ''});
}

    const [n0, r0] = RADIOS[i - 1], [n1, r1] = RADIOS[i];

    const estilo = k == marcaFicha ? ESTILO_CIUDAD : ciudad ? ESTILO_LUGAR : {color: BORDE_MARCA, fillColor: COLOR_MARCA, weight: 2, fillOpacity: 0};
    const m = ps.every(p => p.lista) ? marcaLista(centroPos(ps[0].pos), estilo)
            : (ps.some(p => p.zona) ? marcaCuadrada : L.circleMarker)(centroPos(ps[0].pos), {radius: radioDe(ps.length), opacity: 1, ...estilo});
    const nombre = nombreMarca(ps);
    if (nombre) m.bindTooltip(nombre + ' (' + ps.length + ')', {direction: 'top', offset: [0, -6], className: 'tipNombre'});   // al pasar por encima: su ciudad o país (cuántos)
    m.on('tooltipopen', () => { if (trasClic) m.closeTooltip(); });
    m.on('mouseout', () => { trasClic = false; });
    m.on('click', () => {
      trasClic = true;
      m.closeTooltip();
      lugarSel = lugarSel == k ? null : k;
      ciudadSel = null;
      soloBuscado = false;
      // con la ciudad, su país: en el mapa el país con sus ciudades (encuadrado si cambia) y la elegida resaltada
      const antes = paisSel;
      if (lugarSel && capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(ps[0].pais)) paisSel = l; });
      if (lugarSel) etiqueta(centroPos(ps[0].pos), nombre, 'lugar');   // al pulsar: solo el nombre (su ciudad o país)
      sinEncuadre = paisSel === antes;
      pinta();
    });
    capaMapa.addLayer(m);
    marcadores.set(k, m);
    if (ciudad) m.bringToFront();
  }
  estiloPaises();
  if (etiquetaDe && !{pais: paisSel, lugar: lugarSel, ciudad: ciudadSel}[etiquetaDe]) mapa.closeTooltip(tipMapa);
  if (!sinEncuadre) encuadra(conPos);
  sinEncuadre = false;
  pintaCiudades();   // y otra vez al acabar de encuadrar (moveend)
}

// los lugares de las marcas que se ven en el mapa, a la izquierda: en el nivel de área o con un país elegido, los
// países (de baseLugares: todo el listado sin el país); con una ciudad o un lugar elegidos, sus ciudades. En cada columna los que caben en el alto del mapa (202px: 12; en el móvil, 144px: 8), hasta
// 2 columnas completas (24; en el móvil, 16); con más, solo 'more than N cities/countries'. En el hover, cuántas
// líneas tiene cada uno en el listado (lineasCiudad y lineasPais, de pinta); al pulsarlo, se elige
const COLUMNAS_CIUDAD = 2, ALTO_CIUDAD = 16;   // el line-height de .ciudadesMapa
let lineasCiudad = () => 0, lineasPais = () => 0, baseLugares = [];
// el hover de una ciudad: al momento (el title tarda) y a su derecha, sin salirse del mapa
function tipCiudad(s, texto){
  const t = $('tipCiudad'), caja = $('mapaCaja');
  s.onmouseenter = () => {
    if (trasClic) return;
    t.textContent = texto();
    t.classList.remove('oculto');
    const div = s.offsetParent;
    t.style.left = Math.max(0, Math.min(div.offsetLeft + s.offsetLeft + s.offsetWidth + 6, caja.clientWidth - t.offsetWidth - 2)) + 'px';
    t.style.top = (div.offsetTop + s.offsetTop - 2) + 'px';   // centrado en la línea (16px) del nombre
  };
  s.onmouseleave = () => { trasClic = false; t.classList.add('oculto'); };
}
// al pulsar una ciudad de la lista (con líneas en el listado) o elegirla en el buscador (CIT): como su marca,
// la ciudad c (pais|ciudad) elegida en el listado y en el mapa, con su país
function eligeCiudad(c, nombre){
  const pais = c.split('|')[0], p = personas.find(p => ciudadDe(p) == c && p.pos), antes = paisSel;
  lugarSel = null;
  ciudadSel = c;
  soloBuscado = false;
  if (capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(pais)) paisSel = l; });
  if (p && mapa) etiqueta(centroPos(p.pos), nombre, 'ciudad');
  sinEncuadre = paisSel === antes;
  pinta();
}
// al pulsar un país de la lista (nivel de área): como pulsarlo en el mapa
function eligePais(pais){
  let l = null;
  if (capaPaises) capaPaises.eachLayer(x => { if (!l && x.feature.properties.nombres.includes(pais)) l = x; });
  if (!l) return;
  paisSel = l;
  lugarSel = ciudadSel = null;
  soloBuscado = false;
  etiqueta(boundsPais(l).getCenter(), l.feature.properties.pais, 'pais');
  pinta();
}
function pintaCiudades(){
  $('tipCiudad').classList.add('oculto');
  const div = $('ciudadesMapa'), vista = mapa.getBounds(), nombres = new Map(), dePais = !!(ciudadSel || lugarSel || paisSel);   // con país, ciudad o lugar elegidos: las ciudades (del país); si no, países
  for (const p of dePais ? posMapa : baseLugares){   // las ciudades, de lo que pinta el mapa (con un país elegido, solo las suyas); los países, de todo el listado
    if (!vista.contains(centroPos(p.pos))) continue;
    if (dePais && p.ciudad) nombres.set(ciudadDe(p), p.ciudad);
    else if (!dePais && p.pais && p.pais != '-') nombres.set(p.pais, p.pais);
  }
  const ciudades = [...nombres].sort((x, y) => x[1].localeCompare(y[1]));
  const lineas = dePais ? lineasCiudad : lineasPais, elige = dePais ? eligeCiudad : eligePais;
  const filas = Math.max(1, Math.floor(($('mapa').clientHeight - 8) / ALTO_CIUDAD)), max = COLUMNAS_CIUDAD * filas;
  div.innerHTML = '';
  if (ciudades.length > max){   // con más, solo el aviso
    div.style.gridTemplateRows = '';
    const s = document.createElement('span');
    s.textContent = 'more than ' + max + (dePais ? ' cities' : ' countries');
    tipCiudad(s, () => ciudades.length);
    return div.appendChild(s);
  }
  div.style.gridTemplateRows = 'repeat(' + Math.min(ciudades.length, filas) + ', auto)';   // se llena una columna y luego la siguiente
  for (const [c, nombre] of ciudades){
    const s = document.createElement('span');
    s.textContent = nombre;
    tipCiudad(s, () => lineas(c));   // solo el número: el nombre ya se ve
    s.onclick = () => {   // con el listado a cero, nada; si no, fuera el hover: sale la etiqueta blanca del mapa
      if (!lineas(c)) return;
      trasClic = true;
      $('tipCiudad').classList.add('oculto');
      elige(c, nombre);
    };
    div.appendChild(s);
  }
}

const totalesArea = new Map();
function totalArea(v){
  if (!totalesArea.has(v)) totalesArea.set(v, personas.filter(p => enArea(p, v)).length);
  return totalesArea.get(v);
}

const PRIMEROS = {[LIS]: 'list', [EVT]: 'event', [SEM]: 'seminar', [ACA]: 'academy', [MIL]: 'milonga', [PRA]: 'practica', [PEO]: 'person', org: 'organizer', art: 'artist'};
function rutaListado(a, r, fs, dias, conRoles, n){   // la última línea de la cabecera: área > tipo > país > ciudad > resto de selecciones (n líneas)
  const lugar = lugarSel && (porLugarMapa.get(lugarSel) || [])[0];
  const [paisC, ciudadC] = (ciudadSel || '').split('|');
  const f = fs !== null ? FECHAS[fs] : null;
  // cada tramo, con lo que hace al pulsarlo: volver a ese nivel (quita lo que va detrás); sin acción, solo texto
  const quitaResto = () => { fechaSel = F_DOCE; diasSel.clear(); rolesSel.clear(); soloBuscado = false; };
  const quitaLugar = () => { lugarSel = ciudadSel = paisSel = null; quitaResto(); };
  const partes = [[a == TODOS ? 'World' : a == '-' ? 'no area' : a, quitaLugar],
                  [r == TODOS ? 'all' : PRIMEROS[r] || textoRol(r)],   // el tipo, sin clic: se cambia en su selector
                  [paisSel ? paisSel.feature.properties.nombres[0] : '', () => { lugarSel = ciudadSel = null; quitaResto(); }],
                  [ciudadSel ? ciudadC || paisC : lugar ? lugar.ciudad || lugar.lugar : '', quitaResto],
                  ...(soloBuscado && buscado ? [buscado.nombre]
                      : [!f ? '' : f.doce ? 'YEAR' : f.mes === undefined ? f.anyo : MESES[f.mes] + ' ' + f.anyo,
                         ...(dias || []).map(d => DIAS_SEM[d]),
                         ...(conRoles ? [...rolesSel].map(k => k == PTC ? 'PTC' : textoRol(k)) : [])]).map(t => [t])]
                 .filter(([t]) => t);
  const d = $('ruta');
  d.replaceChildren();
  partes.forEach(([texto, accion], i) => {
    if (i) d.append(' › ');
    const s = document.createElement('span');
    s.textContent = texto;
    if (accion && i < partes.length - 1){   // el último tramo es donde ya estamos
      s.className = 'paso';
      s.onclick = () => { accion(); pinta(); };
    }
    d.appendChild(s);
  });
  const ico = document.createElement('img');   // al final, tras otro ›, el contador con su icono
  ico.src = 'img/estadistica.svg';
  ico.className = 'icono';
  d.append(' › ', ico, ' ' + n);
}

// lo que se elige (mapa, tiras, selectores, búsqueda): si con ello el listado se queda a cero, no cambia nada y
// se vuelve a lo del último pinta con líneas
let estadoPintado = null;
const estado = () => ({lugarSel, ciudadSel, paisSel, fechaSel, diasSel: new Set(diasSel), rolesSel: new Set(rolesSel),
                       soloBuscado, buscado, areaPrevia, area: $('selArea').value, rol: $('selRol').value});
function vuelveA(e){
  ({lugarSel, ciudadSel, paisSel, fechaSel, soloBuscado, buscado, areaPrevia} = e);
  diasSel = new Set(e.diasSel);
  rolesSel = new Set(e.rolesSel);
  $('selArea').value = e.area;
  $('selRol').value = e.rol;
}
function pinta(){
  const val = sel => sel.value || sel.dataset.inicial || TODOS;
  const sa = $('selArea');
  if (paisSel){ if (sa.value) areaPrevia = sa.value; }
  else if (areaPrevia !== null){ if (!sa.value) sa.value = areaPrevia; areaPrevia = null; }
  const a = paisSel ? TODOS : val(sa), r = val($('selRol'));
  const areaCuenta = paisSel ? (areaPrevia || TODOS) : a;
  const deListado = personas;   // también las personas sin foto (recuadro gris): el listado cuadra con el selector
  const visibles = personas;
  const conFechas = deEventos(r) && !sinFecha(r), conDias = regular(r), conRoles = r == PEO;
  const fs = conFechas && !soloBuscado ? fechaSel : null;
  const dias = conDias && diasSel.size && !soloBuscado ? [...diasSel] : null;
  const enDias = p => !dias || !!proximaEn(p, dias);
  const enTiras = p => enDias(p) && (!conRoles || soloBuscado || enRoles(p));
  const enSel = p => (!lugarSel || (p.pos && claveMarca(p) == lugarSel))
                  && (!ciudadSel || ciudadDe(p) == ciudadSel)
                  && (!paisSel || paisSel.feature.properties.nombres.includes(p.pais));
  const base = visibles.filter(p => enArea(p, a) && enRol(p, r) && enFecha(p, fs) && enTiras(p));
  const areaPais = paisSel && paisSel.feature.properties.area, aMapa = areaPais && areaPais != '-' ? areaPais : a;
  const baseMapa = deListado.filter(p => enArea(p, aMapa) && enRol(p, r) && enFecha(p, fs) && enTiras(p)
                                         && (!paisSel || paisSel.feature.properties.nombres.includes(p.pais))
                                         && (p.area != MUNDIAL || aMapa == TODOS));
  const lista = (soloBuscado && buscado ? base.filter(p => p === buscado)
                                        : base.filter(enSel))
                        .sort((x, y) => !deEventos(r) ? x.nombre.localeCompare(y.nombre)
                                      : desdeHoy(x) - desdeHoy(y) || x.nombre.localeCompare(y.nombre));
  const filas = conDias && !soloBuscado ? filasMilongas(lista) : lista.map(p => ({p, dia: conDias ? proximaEn(p) : null}));
  if (!filas.length && estadoPintado){   // a cero: todo como estaba, sin repintar (el mapa sin moverse, la ficha abierta)
    vuelveA(estadoPintado);
    if (mapa && tipMapa) mapa.closeTooltip(tipMapa);
    sinEncuadre = false;
    return;
  }
  cierraFicha();
  const lineas = suyas => conDias && !soloBuscado ? filasMilongas(suyas).length : suyas.length;
  lineasCiudad = c => lineas(base.filter(p => ciudadDe(p) == c));   // las líneas que tendría el listado con la ciudad c (pais|ciudad)
  lineasPais = c => lineas(base.filter(p => p.pais == c));          // o con el país c
  baseLugares = base.filter(p => p.pos);
  const areas = [...new Set(personas.map(p => p.area))].filter(x => x != MUNDIAL)
                  .sort((x, y) => (x == '-') - (y == '-') || x.localeCompare(y));
  opciones(sa, areas, v => v == '-' ? 'no area' : v, v => totalArea(v), 'World');
  if (paisSel) sa.selectedIndex = -1;
  opciones($('selRol'), [{grupo: 'events', valores: [LIS, ACA, EVT, SEM, MIL, PRA]},
                         {grupo: 'people', valores: [PEO, ...TIPOS_P]}],
           v => PRIMEROS[v] || textoRol(v));   // sin contador: el número va al final de la ruta
  estadoPintado = filas.length ? estado() : null;   // con los selectores ya como se ven
  $('fechas').classList.remove('oculto');
  $('fechas').classList.toggle('sinFechas', !conFechas && !conDias && !conRoles);
  // la tira de roles privados, solo si hay datos privados (la local; en la publicada nadie los tiene)
  const hayPrivados = personas.some(p => !p.evento && p.roles.some(x => ROLES[x] && !ROLES[x].publico));
  $('rBotones').classList.toggle('oculto', !conRoles || !hayPrivados);
  const rFechas = conFechas ? r : EVT;
  if (conDias) pintaDias(d => deListado.filter(p => enArea(p, a) && enRol(p, r) && enSel(p) && (d === null || proximaEn(p, [d]))).length);
  else if (conRoles) pintaRoles(k => deListado.filter(p => enArea(p, a) && enRol(p, PEO) && enSel(p) && (k === null || conRol(p, k))).length);
  else pintaFechas(i => deListado.filter(p => enArea(p, a) && enRol(p, rFechas) && enFecha(p, i) && enSel(p)).length, !conFechas);
  pintaMapa(baseMapa, a);
  $('bListado').innerHTML = (enListado ? '☰' : '<span class="iParrilla">▦</span>') + ' list';
  $('parrilla').classList.toggle('oculto', enListado);
  $('listado').classList.toggle('oculto', !enListado);
  $('ruta').classList.toggle('oculto', !enListado);   // la ruta, solo con el listado
  window.scrollTo(0, 0);   // al cambiar el listado, arriba: a la vista su primera línea
  if (!enListado) return pintaParrilla(lista, deEventos(r) || r == LIS);
  const div = $('listado');
  div.innerHTML = '';
  div.classList.toggle('filas', ESTILO_LISTADO == 'filas');
  const conFecha = filas.some(({p}) => p.evento);   // con fecha: su columna al principio (vacía en las filas sin fecha)
  div.classList.toggle('conFecha', conFecha);
  rutaListado(areaCuenta, r, fs, dias, conRoles, filas.length);
  const vistos = new Set();
  for (const {p, dia} of filas){
    const c = document.createElement('div');
    if (!vistos.has(p.id)) c.id = 'f' + p.id;
    vistos.add(p.id);
    c.dataset.p = p.id;
    if (ESTILO_LISTADO == 'filas'){
      c.className = 'fila';
      const span = (clase, texto) => {
        const s = document.createElement('span');
        s.className = clase;
        s.textContent = texto || '';
        c.appendChild(s);
      };
      c.appendChild(iconoFila(p));   // el logo siempre al inicio de la línea; luego la fecha y el nombre
      if (conFecha) span('fFecha', p.evento ? (dia ? textoDia(dia) : fechaListado(p)) : '');
      span('fNombre', p.nombre);
      const sala = (p.tipo == 'milonga' || p.tipo == 'practica') && (p.sala || p.venue);
      if (sala){ const v = document.createElement('span'); v.className = 'fSala'; v.textContent = ' - ' + sala; c.lastChild.appendChild(v); }
      span('fLugar', p.ciudad || p.lugar);   // solo la ciudad (la sala va en la ficha)
      const mini = cara(p);   // la miniatura al final, de la altura de la línea
      mini.classList.add('fMini');
      c.appendChild(mini);
    } else {
      c.className = 'cuerpo linea';
      titulo(c, p, true);
    }
    c.onclick = () => abreFicha(p, c);
    div.appendChild(c);
  }
  marcaAbierta();
}
function pintaParrilla(lista, evts){

let buscado = null, encontradas = [], activa = -1;
let soloBuscado = false;
const MAX_SUGS = 50;
const tipoSug = p => p.geo || String(p.tipoP && p.tipoP != 'person' ? p.tipoP : p.roles[0] || PEO).slice(0, 3).toUpperCase();
let geos = null;
function lugaresSug(){
  if (geos) return geos;
  const areas = new Set(), paises = new Map(), ciudades = new Map();
  for (const p of personas){
    if (p.area && p.area != '-' && p.area != MUNDIAL) areas.add(p.area);
    if (p.pais && p.pais != '-' && p.pais[0] == p.pais[0].toUpperCase()){
      paises.set(p.pais, p.area);
      if (p.ciudad && !p.ciudad.startsWith('*')) ciudades.set(ciudadDe(p), {nombre: p.ciudad, pais: p.pais});
    }
  }
  geos = [...[...areas].map(a => ({geo: 'ARE', nombre: a})), ...[...paises].map(([n, a]) => ({geo: 'CON', nombre: n, area: a})),
          ...[...ciudades].map(([k, c]) => ({geo: 'CIT', nombre: c.nombre, pais: c.pais, ciudad: k}))];
  const n = new Map();
  for (const p of personas) for (const k of ['ARE|' + p.area, 'CON|' + p.pais, 'CIT|' + ciudadDe(p)]) n.set(k, (n.get(k) || 0) + 1);
  geos.forEach(g => { g.clave = normaliza(g.nombre); g.n = n.get(g.geo + '|' + (g.geo == 'CIT' ? g.ciudad : g.nombre)) || 0; });
  return geos;
}
const detalle = p => p.geo == 'ARE' ? 'area' : p.geo == 'CON' ? p.area : p.geo == 'CIT' ? p.pais : p.lista ? p.lugar || 'list' : p.evento ? [p.fecha, p.lugar].filter(Boolean).join(' ') || p.tipo : p.lugar || 'people';
const normaliza = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function sugerencias(){ personas.forEach(p => p.clave = normaliza(p.nombre)); }
function muestra(){
  const q = normaliza($('buscar').value.trim()), d = $('sugs');
  const orden = (x, y) => x.clave.startsWith(q) == y.clave.startsWith(q) ? x.nombre.localeCompare(y.nombre) : x.clave.startsWith(q) ? -1 : 1;
  const ordenGeo = (x, y) => x.clave.startsWith(q) == y.clave.startsWith(q) ? y.n - x.n || x.nombre.localeCompare(y.nombre) : x.clave.startsWith(q) ? -1 : 1;
  encontradas = !q ? [] : [...lugaresSug().filter(g => g.clave.includes(q)).sort(ordenGeo),
                           ...personas.filter(p => p.clave.includes(q)).sort(orden)].slice(0, MAX_SUGS);
  activa = encontradas.length ? 0 : -1;
  d.innerHTML = '';
  encontradas.forEach((p, i) => {
    const o = document.createElement('div');
    o.innerHTML = '';
    const tipo = document.createElement('span');
    tipo.className = 'tipo' + (p.geo ? ' geo' + p.geo : !p.evento && !p.lista && p.tipoP == 'person' ? ' gente' : '');
    tipo.textContent = tipoSug(p);
    o.appendChild(tipo);
    o.append(p.nombre + ' ');
    const s = document.createElement('small');
    s.textContent = '— ' + detalle(p);
    o.appendChild(s);
    if (i == activa) o.className = 'activa';
    o.onmousedown = e => { e.preventDefault(); ir(p); };
    d.appendChild(o);
  });
  d.classList.toggle('oculto', !encontradas.length);
}
function marca(i){
  activa = (i + encontradas.length) % encontradas.length;
  [...$('sugs').children].forEach((o, k) => o.classList.toggle('activa', k == activa));
  $('sugs').children[activa].scrollIntoView({block: 'nearest'});
}
function irGeo(g){
  soloBuscado = false;
  buscado = null;
  enListado = true;
  if (g.geo == 'CIT'){   // una ciudad: lo mismo que pulsarla en el mapa
    mapaAbierto = true;
    eligeCiudad(g.ciudad, g.nombre);
  } else if (g.geo == 'ARE'){
    lugarSel = ciudadSel = paisSel = null;
    $('selArea').value = g.nombre;
    pinta();
  } else {
    lugarSel = ciudadSel = paisSel = null;
    mapaAbierto = true;
    sinEncuadre = true;
    pinta();
    if (capaPaises) capaPaises.eachLayer(l => { if (!paisSel && l.feature.properties.nombres.includes(g.nombre)) paisSel = l; });
    pinta();
    if (paisSel) etiqueta(boundsPais(paisSel).getCenter(), g.nombre, 'pais');
  }
  $('buscar').value = '';
  $('sugs').classList.add('oculto');
  $('buscar').blur();
}
function ir(p){
  if (p.geo) return irGeo(p);
  buscado = p;
  soloBuscado = true;
  enListado = true;
  $('selRol').value = p.evento || p.lista ? p.roles[0] : PEO;
  $('selArea').value = p.area == MUNDIAL ? TODOS : p.area;
  fechaSel = F_DOCE;
  lugarSel = ciudadSel = paisSel = null;
  if (capaPaises && mapaAbierto) capaPaises.eachLayer(l => { if (!paisSel && l.feature.properties.nombres.includes(p.pais)) paisSel = l; });
  pinta();
  if (paisSel) etiqueta(p.pos || paisSel.getBounds().getCenter(), paisSel.feature.properties.pais, 'pais');
  iluminaFicha(p);
  const c = document.getElementById('f' + p.id);
  if (c){
    c.classList.add('encontrado');
    c.scrollIntoView({block: 'center'});
  }
  $('buscar').value = '';
  $('sugs').classList.add('oculto');
  $('buscar').blur();
}
function teclaBuscar(e){
  if (!encontradas.length) return;
  if (e.key == 'ArrowDown'){ marca(activa + 1); e.preventDefault(); }
  else if (e.key == 'ArrowUp'){ marca(activa - 1); e.preventDefault(); }
  else if (e.key == 'Enter') ir(encontradas[activa]);
  else if (e.key == 'Escape') $('sugs').classList.add('oculto');
}

function conecta(){
  $('buscar').oninput = muestra;
  $('buscar').onfocus = muestra;
  $('buscar').onblur = () => $('sugs').classList.add('oculto');
  $('buscar').onkeydown = teclaBuscar;
  $('info').onclick = muestraInfo;
  $('fCerrar').onclick = () => $('ficha').close();
  $('ficha').onclick = e => { if (e.target == $('ficha')) $('ficha').close(); };
  $('dCerrar').onclick = cierraFicha;
  $('bMapa').onclick = abreCierraMapa;
  $('bListado').onclick = () => { enListado = !enListado; sinEncuadre = true; pinta(); };
  window.addEventListener('resize', () => { if (!enListado) columnasParrilla(soloEventos); });
  document.addEventListener('keydown', e => { if (e.key == 'Escape') cierraFicha(); });
  $('selArea').onchange = () => { lugarSel = ciudadSel = paisSel = null; soloBuscado = false; pinta(); };
  $('selRol').onchange = () => {   // la ciudad elegida se mantiene: el lugar pinchado en el mapa pasa a ser su ciudad
    const p = lugarSel && (porLugarMapa.get(lugarSel) || []).find(p => p.ciudad);
    if (p) ciudadSel = ciudadDe(p);
    lugarSel = null;
    soloBuscado = false;
    pinta();
  };
  let areaAntes = null;
  $('selArea').addEventListener('pointerdown', () => {
    if ($('selArea').selectedIndex < 0) return;
    areaAntes = $('selArea').value;
    $('selArea').selectedIndex = -1;
  });
  $('selArea').addEventListener('blur', () => {
    if ($('selArea').selectedIndex < 0 && areaAntes !== null) $('selArea').value = areaAntes;
    areaAntes = null;
  });
}

function deUrl(){
  const q = new URLSearchParams(location.search);
  if (q.get('a')) $('selArea').dataset.inicial = q.get('a');
  if (q.get('b')) $('selRol').dataset.inicial = q.get('b');
  if (q.has('c')) enListado = !/^(grid|0|off|no)$/i.test(q.get('c'));
  if (q.has('d')) mapaAbierto = !/^(off|0|no)$/i.test(q.get('d'));
  idInicial = (q.get('id') || '').trim();
}
// ?id=<id del registro> (campo 10): abre esa ficha (evento, persona o lista) sola en el listado, como el buscador
let idInicial = '';
function abreId(){
  const p = idInicial && personas.find(x => (x.ids || []).includes(idInicial));
  if (!p) return;
  ir(p);
  abreFicha(p);
}

// los datos, en GitHub cifrados (cmd.publicar/cifra.py: datajs/datos.cifrados.js, AES-GCM): se
// descifran con la clave de la url, wwt/#k=<clave> (el # no llega al servidor); en local, sin cifrar
async function descifra(){
  if (typeof DATOS_CIFRADOS == 'undefined') return true;
  const k = new URLSearchParams(location.hash.slice(1)).get('k') || '';
  try {
    const bytes = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
    const datos = bytes(DATOS_CIFRADOS);
    const clave = await crypto.subtle.importKey('raw', bytes(k.replace(/-/g, '+').replace(/_/g, '/')), 'AES-GCM', false, ['decrypt']);
    const texto = await crypto.subtle.decrypt({name: 'AES-GCM', iv: datos.slice(0, 12)}, clave, datos.slice(12));
    (0, eval)(new TextDecoder().decode(texto));   // var publictango=[...]
    return true;
  } catch (e){
    $('listado').textContent = k ? 'la clave de la url no es válida' : 'falta la clave en la url (#k=...)';
    return false;
  }
}

async function arranca(){
  if (!await descifra()) return;
  deUrl();
  conecta();
  cargaFilas(personasTango());
  abreId();
}

arranca();
