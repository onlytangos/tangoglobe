function textoTira(b, texto, n){
  const nom = document.createElement('span');
  nom.className = 'nom';
  nom.textContent = texto;
  b.replaceChildren(nom);
  if (n === undefined || n === null) return;
  const num = b.appendChild(document.createElement('span'));
  num.className = 'num';
  num.textContent = n;
}

// people por roles: dos tiras (públicos y privados), varios a la vez; rolesSel vacío = todos
const PTC = 'ptc';   // los roles PTC (p24, p25, p26...) en un solo botón
const PTCS = Object.keys(ROLES).filter(r => String(ROLES[r].desc).startsWith('PTC'));
const rolesDe = k => k == PTC ? PTCS : [k];
const tiraRoles = pub => [...new Set(Object.keys(ROLES).filter(r => !!ROLES[r].publico == pub)
                                     .map(r => PTCS.includes(r) ? PTC : r)), ...(pub ? [CPL] : [])];   // (y couple, al final de los públicos: el tipo de las parejas)
let rolesSel = new Set();
const conRol = (p, k) => k == CPL ? p.tipoP == CPL : rolesDe(k).some(r => p.roles.includes(r));
const enRoles = p => !rolesSel.size || [...rolesSel].some(k => conRol(p, k));
function pintaRoles(cuenta){
  const tira = (div, claves) => {
    div.innerHTML = '';
    for (const k of claves){
      const b = document.createElement('button');
      b.textContent = k === null ? tr('ALL') : k == PTC ? 'PTC' : tr(textoRol(k)).toUpperCase();   // en mayúsculas, como meses y días
      const cuantos = cuenta(k);   // el contador, a la vista, como el de meses y días
      textoTira(b, b.textContent, cuantos);
      b.classList.toggle('activo', k === null ? !rolesSel.size : rolesSel.has(k));
      b.classList.toggle('cero', !cuantos && !b.classList.contains('activo'));   // a cero, sin clic (el activo, sí: se quita)
      if (b.classList.contains('cero')) return div.appendChild(b);
      b.onclick = () => {
        if (k === null) rolesSel.clear();
        else if (!rolesSel.delete(k)) rolesSel.add(k);
        soloBuscado = false;
        deTira = true;
        pinta();
      };
      div.appendChild(b);
    }
  };
  tira($('fBotones'), [null, ...tiraRoles(true)]);
  tira($('rBotones'), tiraRoles(false));
}

// la cuarta línea (2026-11-18, el usuario: "boton year/week active second in line", "year|week only one buttton", "only YEAR|week"; antes, YEAR> al principio y
// <WEEK al final, cada uno su botón, y un rato, one year / one week delante de YEAR|WEEK): YEAR|WEEK, un solo botón, con el modo activo resaltado: al pulsar, el
// otro (sin mes ni días elegidos); luego, en otro grupo, los meses o los días (pulsar el elegido, quitarlo: todos). Sin contador (2026-11-17, el usuario: "no
// pongas CONTADOR en year ni week"). Devuelve el grupo de los meses o días
function gruposTira(div, r){
  div.innerHTML = '';
  const grupo = clase => { const g = div.appendChild(document.createElement('span')); g.className = clase; return g; };
  const modo = modoDe(r), modos = grupo('grupo modos'), resto = grupo('grupo');
  const cambio = modos.appendChild(document.createElement('button'));
  cambio.className = 'cambiaModo';
  for (const [m, texto] of [['meses', 'YEAR'], [null, '|'], ['dias', 'WEEK']]){
    const s = cambio.appendChild(document.createElement('span'));
    s.textContent = m ? tr(texto) : texto;
    if (m) s.className = m == modo ? 'on' : 'off';
  }
  cambio.onclick = () => { modoTira[r] = modo == 'meses' ? 'dias' : 'meses'; fechaSel = F_DOCE; diasSel.clear(); soloBuscado = false; deTira = true; pinta(); };
  return resto;
}
function pintaDias(cuenta, r){
  const div = gruposTira($('fBotones'), r);
  const hoy = new Date().getDay();
  [0, 1, 2, 3, 4, 5, 6].map(k => (hoy + k) % 7).forEach(d => {   // (la semana entera: sin día elegido; pulsar el elegido lo quita)
    const b = document.createElement('button');
    b.textContent = tr(DIAS_SEM[d]);
    const cuantos = cuenta(d);   // el contador, a la vista
    textoTira(b, b.textContent, cuantos);
    b.classList.toggle('activo', diasSel.has(d));
    b.classList.toggle('cero', !cuantos && !b.classList.contains('activo'));   // a cero, sin clic
    if (b.classList.contains('cero')) return div.appendChild(b);
    b.onclick = () => {
      diasSel = diasSel.has(d) ? new Set() : new Set([d]);   // (el elegido, otra vez: quitarlo, toda la semana; 2026-11-18, sin el botón de one week)
      soloBuscado = false;
      deTira = true;
      pinta();
    };
    div.appendChild(b);
  });
}

function titulo(d, p){
  const h = document.createElement('h2');
  h.textContent = p.nombre;
  d.appendChild(h);
  if (p.evento && p.tipo){
    const t = document.createElement('span');
    t.className = 'hTipo';
    t.textContent = p.tipo;
    h.appendChild(t);
  }
  // la segunda línea: ciudad, país y el mapa (el venue va en su línea); en los eventos, sin el mapa: va al final de la ficha, con sus enlaces
  // (2026-11-10, el usuario: "en events tb link a map debe estar al final de la ficha")
  const lugar = p.ciudad ? [p.ciudad, p.pais != '-' ? p.pais : ''].filter(Boolean).join(', ') : p.lugar;
  const mapa = !p.evento && p.mapa;
  if (!lugar && !mapa) return;
  const par = document.createElement('p');
  par.className = 'enlaces';
  par.append(...[lugar, mapa && enlace(mapa, 'map', 'img/mapa.svg')].filter(Boolean));
  d.appendChild(par);
}

// el triángulo que abre y cierra un panel de la ficha, al principio de una línea (la de su lugar o, sin ella, la de su nombre); el panel, cerrado al pintar
// (2026-11-08, el usuario; el de las personas: rol, notas y contacto; el de los eventos: venue y org)
// el panel de rol, notas y contacto (en los eventos, venue y org): oculto en la ficha del listado, abierto en el popup (fichaEncima; se abre con la foto). Sin
// triángulo (2026-11-11, el usuario: "quita el triangulo de la ficha"; antes, un triángulo al final de su línea lo abría y cerraba)
function panelOculto(panel){
  panel.classList.add('panelInfo', 'oculto');
}

function rellenaEvento(c, p){
  const img = cara(p);
  c.appendChild(img);
  const d = document.createElement('div');
  d.className = 'texto';
  c.appendChild(d);
  titulo(d, p);
  // venue y org, en un panel tras la línea de su ciudad y antes de los enlaces (2026-11-10, el usuario: "events oculta con triangulo despues de ciudad y antes lo
  // los links"): oculto en la ficha del listado y abierto en el popup (panelOculto)
  const panel = document.createElement('div');
  const fb = p.fb && esFb(p.fb) ? p.fb : '';
  const enlaces = () => logosFicha(d, img, {mapa: p.mapa, fb, www: [...(p.fb && !fb ? [p.fb] : []), ...p.www.filter(u => u != p.fb)], video: p.video, fotoMapa: regular(p.roles[0]), textoFb: 'FB'});   // el mapa, el primero de los enlaces; Facebook, FB (2026-11-10, el usuario: "en las fichas de events usar FB en vez de facebook")
  if (p.sala){
    const par = document.createElement('p');
    par.append('venue: ', p.salaFb ? enlace(p.salaFb, p.sala) : p.sala);   // la dirección, en el enlace map
    panel.appendChild(par);
  }
  if (p.orgs.length){
    const par = document.createElement('p');
    par.appendChild(document.createTextNode('org: '));
    p.orgs.forEach((nombre, i) => {
      if (i) par.appendChild(document.createTextNode(', '));
      const url = (personas.find(x => !x.evento && x.nombre == nombre && x.fb) || {}).fb;
      par.appendChild(url ? enlace(url, nombre) : document.createTextNode(nombre));
    });
    panel.appendChild(par);
  }
  if (panel.childNodes.length){
    panelOculto(panel);
    d.appendChild(panel);
  }
  enlaces();
  // un evento extrapolado (la fecha del año anterior llevada a este): al final de la última línea, "○ not verified · last edition 2026.NOV.13-15" (2026-11-17,
  // el usuario: "como se muestra si el evento es extrapolado ?", "add en la ultima linea de la ficha del evento"; antes, solo en la ficha de quien lo organiza)
  if (p.noVerificado){
    const ult = d.lastElementChild && d.lastElementChild.classList.contains('enlaces') ? d.lastElementChild : d.appendChild(document.createElement('p'));
    const s = ult.appendChild(document.createElement('span'));
    s.className = 'noVerif';
    s.textContent = ESTADO_ORGANIZA.ext.join(' ') + (p.fechaExt ? ' · last ' + p.fechaExt : '');   // ("last", 2026-11-17, el usuario: "last iso last edition")
  }
  // (arriba) los enlaces, al final de la ficha: título y tipo, lugar, venue, org y estos; sin la fecha (2026-11-08, el usuario: "no necesitamos la fecha en el detalle del evento") (2026-11-10, el usuario: "para events los enlaces al final de la ficha"; antes, delante de org)
}

const TEXTO_ROL = {org: 'organizer', art: 'artist', vip: 'vip'};   // texto propio en app.tg (en aux.js, para app.tw)
const textoRol = r => TEXTO_ROL[r] || (ROLES[r] && ROLES[r].nombre) || r;

function rellenaPersona(c, p){
  const img = cara(p);
  c.appendChild(img);
  const d = document.createElement('div');
  d.className = 'texto';
  c.appendChild(d);
  titulo(d, p);
  const lineaLugar = d.lastElementChild.tagName == 'P' ? d.lastElementChild : null;    // la de su lugar, si titulo la pone (tras el h2 del nombre)
  // rol, org, comentarios y prv: un solo párrafo, seguidos y separados por " · "
  const par = document.createElement('p');
  const linea = (etiqueta, ...nodos) => {   // etiqueta (rol, org...) resaltada; sin etiqueta, solo el texto
    if (par.childNodes.length) par.append(' · ');
    if (etiqueta){
      const b = document.createElement('b');
      b.textContent = etiqueta + ': ';
      par.append(b);
    }
    par.append(...nodos);
  };
  const roles = p.roles.filter(r => ROLES[r]);
  const publicos = roles.filter(r => ROLES[r].publico), privados = roles.filter(r => !ROLES[r].publico);
  if (p.sala) linea('venue', p.salaFb ? enlace(p.salaFb, p.sala) : p.sala);
  if (p.tipoP && p.tipoP != 'person') linea('type', PRIMEROS[p.tipoP] || p.tipoP);   // como en el selector: couple
  if (publicos.length) linea('rol', publicos.map(textoRol).join(', '));
  if (privados.length) linea('pr', privados.map(textoRol).join(', '));
  const coments = [];
  for (const n of p.coment) for (const t of n.split(/,/).map(x => x.trim()))
    if (t && !coments.includes(t)) coments.push(t);
  if (coments.length) linea('', coments.join(', '));
  const urls = [], textos = [];
  for (const n of p.notas) for (const linea of n.split(/\s+\/\s+|,(?!\s)/)){
    let texto = '';
    for (const trozo of linea.split(/(https?:\/\/[^\s,]+)/)){
      if (/^https?:\/\//.test(trozo)){ if (!urls.includes(trozo)) urls.push(trozo); }
      else texto += trozo;
    }
    texto = texto.replace(/^[\s,]+|[\s,]+$/g, '');
    if (texto && !textos.includes(texto) && !coments.includes(texto)) textos.push(texto);
  }
  if (textos.length) linea('prv', textos.join(', '));
  if (par.childNodes.length){
    // rol, notas y contacto, en un panel que abre y cierra el triángulo al principio de la línea de su lugar (o de su nombre); cerrado al pintar (2026-11-08, el usuario)
    panelOculto(par);
    d.appendChild(par);
  }
  const fb = p.fb && esFb(p.fb) ? p.fb : '';
  // (sin las webs que ya salen en la lista de sus eventos: milonguero-milonguero.com en Victoria Huang; 2026-11-08, el usuario: "estan repetidos, no ponerlos")
  const eventos = organizaDe(p.nombre);
  const pagina = u => String(u).toLowerCase().replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/\/+$/, '');
  const deEventos = new Set(eventos.flatMap(ev => [ev.fb, ev.www]).filter(Boolean).map(pagina));
  // sus enlaces (Facebook, YouTube, sus webs), en la misma línea que su lugar: "▸ Benidorm, Spain  facebook  video" (2026-11-08, el usuario: "poner en una
  // linea los enlaces FB YT"); sin lugar, en la suya
  const logos = document.createElement('div');
  logosFicha(logos, img, {fb, www: [...(p.fb && !fb ? [p.fb] : []), ...urls.filter(u => !/youtu/.test(u) && u != p.fb)].filter(u => !deEventos.has(pagina(u))),
                              video: urls.find(u => /youtu/.test(u)) || ''});
  if (logos.firstElementChild){
    if (lineaLugar) lineaLugar.append(...logos.firstElementChild.childNodes);
    else d.insertBefore(logos.firstElementChild, par.parentNode == d ? par : null);
  }
  // los eventos que organiza (de los eventos: su org), tras la línea de su Facebook y su YouTube: uno por línea, con su estado, su nombre y
  // luego los logos de su Facebook y su web, si los tiene (2026-11-08, el usuario). El estado, en vez del punto de antes (2026-11-12, el usuario):
  // ● fecha confirmada, ○ la del año anterior llevada a este (no verificada), - sin fecha (antes ·; 2026-11-12, el usuario: "no date por -"); su significado, en una leyenda bajo la lista con los que
  // salen (no en title: en el móvil no se ve; 2026-11-12, el usuario: "no uses title no se ven en el movil")
  const estados = new Set();
  for (const ev of eventos){
    const e = document.createElement('p');
    e.className = 'organiza';
    const estado = ESTADO_ORGANIZA[ev.estado] ? ev.estado : 'sin';
    estados.add(estado);
    const s = document.createElement('span');
    s.className = 'estado';
    s.textContent = ESTADO_ORGANIZA[estado][0];
    s.setAttribute('aria-label', ESTADO_ORGANIZA[estado][1]);
    const m = document.createElement('span');      // su mes en tres letras (MESES, como el listado); sin fecha, el hueco: los nombres alineados
    m.className = 'mes';
    m.textContent = ev.cuando ? MESES[ev.cuando.getMonth()] : '';
    e.append(s, ' ', m, ' ' + ev.nombre);
    for (const [u, icono] of [[ev.fb, 'img/perfil.svg'], [ev.www, 'img/web.svg']]) if (u){
      const a = enlace(u, '', icono);
      a.setAttribute('aria-label', u);
      e.append(' ', a);
    }
    d.appendChild(e);
  }
  // la leyenda: solo los estados que salen, en el orden de ESTADO_ORGANIZA, tras "note:" ("note: ● date confirmed   ○ not verified"; 2026-11-12, el usuario)
  if (estados.size){
    const l = document.createElement('p');
    l.className = 'leyendaOrganiza';
    l.append('note: ');
    Object.keys(ESTADO_ORGANIZA).filter(k => estados.has(k)).forEach((k, i) => {   // (cada uno, entero: en el móvil, el ○ se quedaba sin su texto)
      const x = document.createElement('span');
      x.className = 'item';
      x.textContent = ESTADO_ORGANIZA[k].join(' ');
      l.append(i ? '   ' : '', x);
    });
    d.appendChild(l);
  }
}

let fichaAbierta = null, filaAbierta = null;   // la ficha abierta y su línea del listado (la pulsada: una milonga puede salir en varios días)
function marcaAbierta(){
  for (const f of document.querySelectorAll('.fila.abierta')) f.classList.remove('abierta');
  if (fichaAbierta) for (const f of document.querySelectorAll('.fila[data-p="' + fichaAbierta.id + '"]')) f.classList.add('abierta');
  iluminaCal();   // y sus días en el calendario
}
function abreFicha(p, fila){   // fila: la pulsada (una milonga puede salir en varios días)
  fichaAbierta = p;
  filaAbierta = fila || document.getElementById('f' + p.id);
  marcaAbierta();
  $('detalle').append($('dCopiar'), $('dFuentes'));   // fuera de la ficha que se borra (van al final de su primera línea y de su línea note: pintaCopiar, pintaFuentes)
  $('dCuerpo').innerHTML = '';
  rellena($('dCuerpo'), p);
  // la foto abre la ficha en el popup, con la información desplegada (2026-11-11, el usuario: "click en la imagen de la ficha popup de la ficha con la informacion
  // expandida"; antes, el mapa o su enlace, que es lo que sigue haciendo la foto del popup)
  const foto = $('dCuerpo').querySelector(':scope > img, :scope > .sinfoto');
  if (foto){ foto.classList.add('conEnlace'); foto.onclick = () => fichaEncima(p); }
  pintaCopiar(p);
  pintaFuentes(p);
  iluminaFicha(p);
  if (mapa && mapaAbierto && vistaMapa) mapa.flyTo(...vistaMapa, {duration: .8});   // vuelve al centro y zoom del último encuadre
  const d = $('detalle');
  d.classList.add('filas');
  d.classList.remove('oculto', 'larga');
  const arriba = parseFloat(getComputedStyle(d).top) || 0;
  if (d.offsetHeight > innerHeight - arriba - 16){
    d.classList.add('larga');
    window.scrollBy({top: d.getBoundingClientRect().top - arriba, behavior: 'smooth'});
    return;
  }
  const f = fila || document.getElementById('f' + p.id);
  if (f && f.classList.contains('fila')){
    const tapa = d.getBoundingClientRect().bottom + 16 - f.getBoundingClientRect().top;
    if (tapa > 0) window.scrollBy({top: -tapa, behavior: 'smooth'});
  }
}
// los cursores ↑ y ↓ mueven la línea elegida del listado: abren la ficha de la anterior o de la siguiente; sin ninguna elegida, ↓ elige la primera
// (2026-11-10, el usuario: "cursore en el listado , mover la linea seleccionada")
function mueveFila(n){
  const f = filaAbierta && filaAbierta.isConnected ? filaAbierta[n > 0 ? 'nextElementSibling' : 'previousElementSibling']
          : n > 0 ? $('listado').querySelector('.fila') : null;
  if (!f || !f.classList.contains('fila')) return;   // en la primera o en la última, se queda
  abreFicha(personas[f.dataset.p], f);   // (si la ficha la tapa, abreFicha sube el listado)
  const r = f.getBoundingClientRect();
  if (r.bottom > innerHeight) window.scrollBy(0, r.bottom - innerHeight + 8);   // bajo la ventana: a la vista
}

// copiar un enlace: al portapapeles (si no deja, en un prompt, para copiarlo a mano); el botón, un momento con ✓ (la ruta y los see by)
async function copiaUrl(b, url){
  try { await navigator.clipboard.writeText(url); }
  catch (e){ window.prompt('link', url); return; }
  b.innerHTML = ICONO_HECHO;
  setTimeout(() => b.innerHTML = ICONO_ENLACE, 1500);
}
// las fuentes que han formado la ficha (listafuentes.out.js; import/listafuentes.py): el logo, abajo a la derecha, y al pulsarlo un popup con ellas.
// Solo en local: en lo publicado no está ese fichero (run.sh) y no sale el logo
function pintaFuentes(p){
  const b = $('dFuentes');
  const urls = typeof LISTAFUENTES == 'undefined' ? [] : [...new Set((p.ids || []).flatMap(i => LISTAFUENTES[i] || []))];
  b.classList.toggle('oculto', !urls.length);
  const nota = $('dCuerpo').querySelector('.leyendaOrganiza');   // con línea note, el logo al final de ella, seguido; sin ella, abajo a la derecha
  b.classList.toggle('enNota', !!nota);
  if (nota) nota.append(b);
  b.onclick = () => {
    $('fCuerpo').innerHTML = '';
    const d = document.createElement('div');
    d.className = 'texto fuentes';
    const h = document.createElement('h3');
    h.textContent = 'sources';
    d.appendChild(h);
    for (const u of urls){
      const a = document.createElement('a');
      a.href = u.startsWith('http') ? u : RAIZ + 'import/' + u;     // (lo sin url, el json de su res)
      a.textContent = u;
      a.target = '_blank';
      a.rel = 'noopener';
      d.appendChild(a);
    }
    $('fCuerpo').appendChild(d);
    $('ficha').showModal();
  };
}

// sus bordes, se lava desigual y granula; las luces quedan en papel; los contornos de la foto, a lápiz suave; textura de papel y borde de la hoja sin pintar
function acuarela(src, lienzo, listo, ancho = 640, alto = 320){
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => {
    if (lienzo.dataset.src != src) return;   // ya se pidió otra
    const W = ancho, H = alto, N = W * H;
    lienzo.width = W; lienzo.height = H;
    const ctx = lienzo.getContext('2d', { willReadFrequently: true });
    const e = Math.max(W / im.naturalWidth, H / im.naturalHeight);   // cover, centrada
    const w = im.naturalWidth * e, h = im.naturalHeight * e;
    ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
    let px;
    try { px = ctx.getImageData(0, 0, W, H).data; } catch (err) { lienzo.dataset.error = 1; return; }   // sin CORS: se queda la foto tal cual
    const R = new Float32Array(N), G = new Float32Array(N), B = new Float32Array(N);
    for (let i = 0; i < N; i++){ R[i] = px[4*i] / 255; G[i] = px[4*i+1] / 255; B[i] = px[4*i+2] / 255; }

    // ruido: value noise suave y su suma en octavas (fbm), con semilla fija
    const hash = (x, y) => { let n = x * 374761393 + y * 668265263; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) & 0xffff) / 0xffff; };
    const vnoise = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
      const a = hash(xi, yi), b = hash(xi+1, yi), c = hash(xi, yi+1), d = hash(xi+1, yi+1); return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v; };
    const fbm = (x, y, oct) => { let s = 0, amp = .5, f = 1; for (let o = 0; o < oct; o++){ s += amp * vnoise(x*f, y*f); f *= 2; amp /= 2; } return s / (1 - Math.pow(.5, oct)); };
    const k = W / 640;   // las escalas, en píxeles de un lienzo de 640

    // 1. el color se corre: cada píxel toma el de un punto cercano, movido por un ruido lento
    const muestra = (A, x, y) => { x = Math.min(W-1, Math.max(0, x)); y = Math.min(H-1, Math.max(0, y)); return A[(y|0) * W + (x|0)]; };
    const r1 = new Float32Array(N), g1 = new Float32Array(N), b1 = new Float32Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const i = y*W + x, dx = (fbm(x/(40*k), y/(40*k), 3) - .5) * 14*k, dy = (fbm(x/(40*k)+50, y/(40*k)+50, 3) - .5) * 14*k;
      r1[i] = muestra(R, x+dx, y+dy); g1[i] = muestra(G, x+dx, y+dy); b1[i] = muestra(B, x+dx, y+dy);
    }

    // tablas de sumas (media de un rectángulo en O(1))
    const tabla = A => { const T = new Float64Array((W+1)*(H+1)); for (let y = 0; y < H; y++){ let s = 0; for (let x = 0; x < W; x++){ s += A[y*W+x]; T[(y+1)*(W+1)+x+1] = T[y*(W+1)+x+1] + s; } } return T; };
    const caja = (T, x0, y0, x1, y1) => { x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(W-1, x1); y1 = Math.min(H-1, y1);
      return (T[(y1+1)*(W+1)+x1+1] - T[y0*(W+1)+x1+1] - T[(y1+1)*(W+1)+x0] + T[y0*(W+1)+x0]) / ((x1-x0+1)*(y1-y0+1)); };

    // 2. manchas de pintura: Kuwahara (de los cuatro cuadrados, el color medio del más uniforme)
    const kuwahara = (r0, g0, b0, rad) => {
      const L = new Float32Array(N), L2 = new Float32Array(N);
      for (let i = 0; i < N; i++){ L[i] = .3*r0[i] + .59*g0[i] + .11*b0[i]; L2[i] = L[i]*L[i]; }
      const TR = tabla(r0), TG = tabla(g0), TB = tabla(b0), TL = tabla(L), TL2 = tabla(L2);
      const ro = new Float32Array(N), go = new Float32Array(N), bo = new Float32Array(N);
      const cuad = [[-rad,-rad,0,0],[0,-rad,rad,0],[-rad,0,0,rad],[0,0,rad,rad]];
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
        let mejor = 1e9, q = null;
        for (const c of cuad){ const m = caja(TL, x+c[0], y+c[1], x+c[2], y+c[3]), v = caja(TL2, x+c[0], y+c[1], x+c[2], y+c[3]) - m*m; if (v < mejor){ mejor = v; q = c; } }
        const i = y*W + x;
        ro[i] = caja(TR, x+q[0], y+q[1], x+q[2], y+q[3]); go[i] = caja(TG, x+q[0], y+q[1], x+q[2], y+q[3]); bo[i] = caja(TB, x+q[0], y+q[1], x+q[2], y+q[3]);
      }
      return [ro, go, bo];
    };
    let [r2, g2, b2] = kuwahara(r1, g1, b1, Math.round(5*k));
    [r2, g2, b2] = kuwahara(r2, g2, b2, Math.round(3*k));

    // 3. bordes húmedos: el pigmento se acumula en el borde de cada mancha (la mancha menos su media alrededor)
    const TR = tabla(r2), TG = tabla(g2), TB = tabla(b2), rb = Math.round(4*k);
    // 4. el lápiz: los contornos de la foto original (Sobel de la luminosidad)
    const Lo = new Float32Array(N); for (let i = 0; i < N; i++) Lo[i] = .3*R[i] + .59*G[i] + .11*B[i];
    const out = ctx.createImageData(W, H), o = out.data;
    const papel = [.97, .955, .925];
    const sm = (a, b, t) => { t = Math.min(1, Math.max(0, (t-a)/(b-a))); return t*t*(3-2*t); };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const i = y*W + x;
      let c = [r2[i], g2[i], b2[i]];
      const m = [caja(TR, x-rb, y-rb, x+rb, y+rb), caja(TG, x-rb, y-rb, x+rb, y+rb), caja(TB, x-rb, y-rb, x+rb, y+rb)];
      const lc = .3*c[0] + .59*c[1] + .11*c[2], lm = .3*m[0] + .59*m[1] + .11*m[2];
      const borde = Math.max(0, lm - lc);   // el lado oscuro de cada borde, más oscuro
      // densidad del pigmento (0, papel; 1, color pleno), lavada y desigual
      const nubes = fbm(x/(90*k)+7, y/(90*k)+3, 4), grano = fbm(x/(2.2*k), y/(2.2*k), 2);
      let lum = Math.max(lc, .001);
      let dens = .28 + (1 - lum) * .7;
      dens *= .65 + .7 * nubes;                      // zonas más y menos cargadas
      dens *= .8 + .4 * grano;                       // granulado del pigmento
      dens += borde * 2.2;                           // borde húmedo
      dens *= 1 - sm(.8, .95, lum);                  // las luces, papel en blanco
      dens = Math.min(1, Math.max(0, dens));
      // el color de la mancha, más vivo; sobre el papel, por capas (multiplica)
      const sat = 1.6; c = c.map(v => Math.min(1, Math.max(0, lc + (v - lc) * sat)));
      let rgb = [0, 1, 2].map(j => papel[j] * (1 - dens + dens * c[j] * .92));
      // lápiz, muy suave
      if (x > 0 && y > 0 && x < W-1 && y < H-1){
        const p = (dx, dy) => Lo[(y+dy)*W + x+dx];
        const gx = p(1,-1) + 2*p(1,0) + p(1,1) - p(-1,-1) - 2*p(-1,0) - p(-1,1), gy = p(-1,1) + 2*p(0,1) + p(1,1) - p(-1,-1) - 2*p(0,-1) - p(1,-1);
        const lap = sm(.25, .9, Math.hypot(gx, gy)) * .35 * (.6 + .8 * fbm(x/(6*k)+20, y/(6*k), 2));
        rgb = rgb.map(v => v * (1 - lap));
      }
      // textura del papel y borde irregular de la hoja, sin pintar
      const tex = .96 + .04 * fbm(x/(1.3*k)+90, y/(1.3*k)+90, 2);
      const dist = Math.min(x, y, W-1-x, H-1-y) / (W * .5);
      const hoja = sm(.015, .06, dist + (fbm(x/(25*k)+40, y/(25*k)+40, 3) - .5) * .06);
      for (let j = 0; j < 3; j++){ const v = (papel[j] + (rgb[j] - papel[j]) * hoja) * tex; o[4*i+j] = Math.round(Math.min(1, Math.max(0, v)) * 255); }
      o[4*i+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    listo();
  };
  lienzo.dataset.src = src;
  im.src = src;
}

// Al pulsarla, Google Maps con la ciudad
function pintaFotoCiudad(){
  const lugar = lugarSel && (porLugarMapa.get(lugarSel) || [])[0];
  const c = ciudadSel || (lugar && lugar.ciudad ? ciudadDe(lugar) : null);
  const f = c && typeof CIUDADES_FOTO != 'undefined' && CIUDADES_FOTO[c];
  $('fotoCiudad').classList.toggle('oculto', !f);
  if (!f) return;
  const [pais, ciudad] = c.split('|');
  if ($('fcImg').getAttribute('src') != f[0]){
    const lz = $('fcLienzo'), im = $('fcImg');   // la acuarela de antes, fuera sin fundido; la foto nueva en sepia, cuando esté: la acuarela se funde siempre sobre su misma foto
    lz.style.transition = 'none'; lz.classList.remove('pintada'); lz.offsetWidth; lz.style.transition = '';   // (2026-11-11, el usuario: "la misma foto para el sepia que para en canvas")
    im.style.visibility = 'hidden'; im.onload = im.onerror = () => { im.style.visibility = ''; };
    im.src = f[0];
    const r = $('fcImg').getBoundingClientRect(), dpr = window.devicePixelRatio || 1;   // el canvas, con la proporción con que se ve la foto (en pantalla estrecha no es 2:1)
    const an = r.width ? Math.min(900, Math.max(320, Math.round(r.width * dpr))) : 640, al = r.width && r.height ? Math.round(an * r.height / r.width) : an / 2;
    acuarela(f[0], $('fcLienzo'), () => $('fcLienzo').classList.add('pintada'), an, al);
  }
  $('fcImg').alt = ciudad; $('fcLienzo').setAttribute('aria-label', ciudad);
  $('fcMapa').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ciudad + ', ' + pais);
  $('fcMapa').setAttribute('aria-label', ciudad + ': map');
  $('fcPie').textContent = '© ' + [f[1], f[2]].filter(Boolean).join(' · ');
  $('fcPie').href = f[3] || f[0];
}
function pintaCiudades(){
  if (tiraEnVuelo) return;   // vacía hasta que el mapa acabe de moverse (tiraLlena)
  const div = $('ciudadesMapa'), dePais = !!(ciudadSel || lugarSel || paisSel), deMundo = !dePais && areaActual() == TODOS;   // con país, ciudad o lugar elegidos: sus ciudades; en World, las áreas; si no, los países del área
  const vista = mapa && mapaAbierto && !$('mapaCaja').classList.contains('oculto') ? mapa.getBounds() : null, nombres = new Map();
  if (deMundo) for (const x of areasLista) nombres.set(x, nombreArea(x));   // las áreas, todas las que tienen líneas (sin mirar el mapa)
  else for (const p of dePais ? posMapa : baseLugares){   // las ciudades, de lo que pinta el mapa (con un país elegido, solo las suyas); los países, de todo el listado
    if (vista && !vista.contains(centroPos(p.pos))) continue;   // con el mapa oculto, todos: la lista sigue viva
    if (dePais && p.ciudad) nombres.set(ciudadDe(p), p.ciudad);
    else if (!dePais && p.pais && p.pais != '-') nombres.set(p.pais, nombrePais(p.pais));
  }
  const lineas = deMundo ? lineasArea : dePais ? lineasCiudad : lineasPais, elige = deMundo ? eligeArea : dePais ? eligeCiudad : eligePais;
  const orden = deMundo ? ordenArea : dePais ? ordenCiudad : ordenPais;
  const n = new Map([...nombres.keys()].map(c => [c, lineas(c)]));
  const ciudades = [...nombres].filter(([c]) => !deMundo || n.get(c))   // las áreas, solo las que tienen líneas
                               .sort((x, y) => orden(y[0]) - orden(x[0]) || x[1].localeCompare(y[1]));   // primero las de más líneas en los doce meses
  div.scrollLeft = 0;
  // back y more..., solo con su logo (2026-11-11, el usuario: "cambia back y more por logos"; antes, el logo y el texto): triángulos llenos como la flecha ▼ del
  // selector de tipo, en amarillo ("vamos a usar triangulos como el del select de tipo, tb en amarillo"): back ◀ (al nivel de arriba o a la página anterior),
  // more... ▶. Antes, un rato, la flecha de volver (que sustituyó al «, 2026-11-10) y una flecha a la derecha
  const BACK = '<svg viewBox="0 0 10 12"><path d="M10 0L0 6l10 6z" fill="currentColor"/></svg>';
  const MAS = '<svg viewBox="0 0 10 12"><path d="M0 0l10 6L0 12z" fill="currentColor"/></svg>';
  const navega = (clase, html, pulsa, nombre) => {   // nombre: el que lee el lector de pantalla (sin title: el usuario no los quiere en estos botones)
    const s = document.createElement('span');
    s.className = clase;
    s.innerHTML = html;
    s.onclick = pulsa;
    if (nombre){ s.setAttribute('role', 'button'); s.setAttribute('aria-label', nombre); }
    return s;
  };
  // back: de las ciudades (con país, ciudad o lugar elegidos) a los países del área; de los países, a las áreas (World). Las fechas (año y mes), los días y
  // los roles, a cero
  const atras = !deMundo && navega('atras', BACK, () => {
    if (!dePais) $('selArea').value = TODOS;
    lugarSel = ciudadSel = paisSel = null;
    fechaSel = F_DOCE;
    diasSel.clear();
    rolesSel.clear();
    soloBuscado = false;
    clicEnTira = true;   // como un clic en un nombre: si el mapa vuela, la línea apagada hasta que termine de cargar (el usuario: "al usar el cursor de tercera linea apagar la linea")
    try { pinta(); } finally { clicEnTira = false; }
  }, tr('back'));
  const lugar = lugarSel && (porLugarMapa.get(lugarSel) || [])[0];
  const elegida = ciudadSel || (lugar ? ciudadDe(lugar) : null);   // la ciudad elegida (o la del lugar elegido)
  const celdas = ciudades.map(([c, nombre]) => {
    const s = document.createElement('span');
    s.classList.toggle('sel', dePais && c == elegida);
    const nom = document.createElement('span'), num = document.createElement('span');
    nom.className = 'nom';
    nom.textContent = nombre;   // sin title (2026-11-11, el usuario: "quita el title sobre paises")
    num.className = 'num';
    num.textContent = n.get(c);
    s.append(nom, num);
    s.classList.toggle('cero', !n.get(c));   // con el listado a cero, sin clic
    s.onclick = () => {   // con el listado a cero, nada; si no, sale la etiqueta azul del mapa
      if (!n.get(c)) return;
      clicEnTira = true;   // si el mapa vuela, la línea se queda vacía hasta que acabe (vuela, tiraVacia)
      try { elige(c, nombre); } finally { clicEnTira = false; }
    };
    return s;
  });
  // por páginas, las que quepan en la línea: en el primer botón back y en el último more... (en pantalla estrecha, todas, con scroll y sin more...).
  // Los dos, siempre en su sitio: sin nada que hacer (back en World, more... si caben todas), la casilla vacía (2026-11-12, el usuario: "linea 3 mantenemos
  // fijos los controles, sino tienen accion presentar vacios"); antes no salían y los nombres se movían
  const vacio = clase => { const s = document.createElement('span'); s.className = clase + ' vacio'; s.setAttribute('aria-hidden', 'true'); return s; };
  // el tope de cada uno, su texto más un 20 % (ver .ciudadesMapa en el css): medidos todos a la vez, sin estirarse
  div.classList.add('mide');
  div.replaceChildren(...celdas);
  const anchos = celdas.map(s => s.getBoundingClientRect().width);
  div.classList.remove('mide');
  celdas.forEach((s, k) => { s.style.maxWidth = anchos[k] ? anchos[k] * 1.2 + 'px' : ''; });
  const porPaginas = !isMovil();
  const vistas = [];   // dónde empezaba cada página anterior
  const pagina = desde => {
    const vuelve = vistas.length ? navega('atras', BACK, () => pagina(vistas.pop()), tr('back')) : atras || vacio('atras');
    const resto = celdas.slice(desde);
    div.replaceChildren(vuelve, ...resto);
    if (!porPaginas) return;
    const hueco = vacio('mas');
    div.append(hueco);   // del ancho de more...: si caben todas con él, se queda vacío
    if (div.scrollWidth <= div.clientWidth) return;
    let cuantas = resto.length;
    hueco.replaceWith(navega('mas', MAS, () => { vistas.push(desde); pagina(desde + cuantas); }, tr('more ...')));
    while (cuantas > 1 && div.scrollWidth > div.clientWidth) resto[--cuantas].remove();   // las que no caben, fuera (al menos una por página)
  };
  pagina(0);
  const sel = celdas.find(s => s.classList.contains('sel'));
  while (sel && !sel.isConnected && div.querySelector('.mas:not(.vacio)')) div.querySelector('.mas:not(.vacio)').click();   // la elegida, a la vista
  anchoBotones = div.clientWidth;
}

                      : [...(conRoles ? [...rolesSel].map(k => k == PTC ? 'PTC' : tr(textoRol(k)).toUpperCase()) : [])]).map(t => [t])]   // (el filtro de tiempo, ya no: va en la caja del total)

function irGeo(g){

function teclaBuscar(e){
  if (!encontradas.length) return;

  for (const e of fuente.querySelectorAll('td.enHoraParte')){
    const b = rel(e.getBoundingClientRect()), w = b.r - b.l, st = getComputedStyle(e);
    x.fillStyle = st.getPropertyValue('--agHora').trim();
    x.fillRect(b.l + w * parseFloat(st.getPropertyValue('--desde')) / 100, b.t, w * (parseFloat(st.getPropertyValue('--hasta')) - parseFloat(st.getPropertyValue('--desde'))) / 100, b.b - b.t);
  }
  // los logos del tipo: su círculo, relleno y con su borde (la letra, con los textos)
  for (const e of fuente.querySelectorAll('.logoTipo')){
    const st = getComputedStyle(e), b = rel(e.getBoundingClientRect()), w = parseFloat(st.borderTopWidth) || 0, radio = Math.min(b.r - b.l, b.b - b.t) / 2;
    if (radio <= w) continue;
    x.beginPath();
    x.arc((b.l + b.r) / 2, (b.t + b.b) / 2, radio - w / 2, 0, 2 * Math.PI);
    if (pinta_(st.backgroundColor)){ x.fillStyle = st.backgroundColor; x.fill(); }
    if (w && pinta_(st.borderTopColor)){ x.lineWidth = w; x.strokeStyle = st.borderTopColor; x.stroke(); }
  }
  for (const e of celdas){
    const st = getComputedStyle(e), b = rel(e.getBoundingClientRect());
    for (const lado of ['Top', 'Right', 'Bottom', 'Left']){
      const w = parseFloat(st['border' + lado + 'Width']);
      if (!w || st['border' + lado + 'Style'] == 'none' || !pinta_(st['border' + lado + 'Color'])) continue;
      x.fillStyle = st['border' + lado + 'Color'];
      if (lado == 'Top') x.fillRect(b.l, b.t, b.r - b.l, w);
      else if (lado == 'Bottom') x.fillRect(b.l, b.b - w, b.r - b.l, w);
      else if (lado == 'Left') x.fillRect(b.l, b.t, w, b.b - b.t);
      else x.fillRect(b.r - w, b.t, w, b.b - b.t);
    }
  }
  // los textos: cada letra, su caja; las de una misma línea, juntas, y escritas desde la primera, centradas en su alto
  x.textBaseline = 'middle';
  const andar = document.createTreeWalker(fuente, NodeFilter.SHOW_TEXT), rango = document.createRange();
  for (let t; (t = andar.nextNode());){
    if (!t.data.trim()) continue;
    const el = t.parentElement, st = getComputedStyle(el);
    if (st.visibility == 'hidden') continue;
    x.font = `${st.fontStyle} ${st.fontWeight} ${st.fontSize} ${st.fontFamily}`;
    x.fillStyle = st.color;
    let corta = el;   // el que corta con … (su letra no cabe): hasta su borde de la derecha
    while (corta != fuente && getComputedStyle(corta).textOverflow != 'ellipsis') corta = corta.parentElement;
    const tope = corta != fuente && corta.scrollWidth > corta.clientWidth + .5 ? rel(corta.getBoundingClientRect()).r - parseFloat(getComputedStyle(corta).paddingRight) : Infinity;
    const lineas = [];
    for (let i = 0; i < t.data.length;){
      const n = t.data.codePointAt(i) > 0xffff ? 2 : 1;
      rango.setStart(t, i); rango.setEnd(t, i + n);
      const r0 = rango.getClientRects()[0];
      if (r0 && r0.width){
        const r = rel(r0), y = (r.t + r.b) / 2, ult = lineas[lineas.length - 1];
        if (ult && Math.abs(ult.y - y) < 2) ult.letras.push({c: t.data.slice(i, i + n), r: r.r});
        else lineas.push({x: r.l, y, letras: [{c: t.data.slice(i, i + n), r: r.r}]});
      }
      i += n;
    }
    for (const {x: x0, y, letras} of lineas){
      let texto = letras.map(l => l.c).join('');
      if (letras[letras.length - 1].r > tope + .5){
        const puntos = x.measureText('…').width;
        const quedan = letras.filter(l => l.r + puntos <= tope + .5);
        texto = quedan.map(l => l.c).join('').trimEnd() + '…';
      }
      x.fillText(texto, x0, y);
    }
  }
  scroll.scrollTo(antes[0], antes[1]);
  const blob = await new Promise(ok => lienzo.toBlob(ok, 'image/jpeg', .92));
  if (!blob) return;
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url;
  a.download = (sinAcentos(titulo).replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'schedule') + '.jpg';
  fuente.closest('dialog').appendChild(a);   // (en el modal abierto: lo de fuera no se pulsa)
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function deUrl(){
  const q = new URLSearchParams(location.search);
  if (q.get('a')) $('selArea').dataset.inicial = q.get('a');
  if (q.get('b')) $('selRol').dataset.inicial = q.get('b') == EVT || q.get('b') == 'mar' ? FES : q.get('b');   // los enlaces de antes, con b=evt o b=mar
  const bRol = q.get('b') == CPL ? CPL : '';   // b=couple (de antes del 2026-11-18, cuando era un tipo): tanguer@ con couple encendido
  if (bRol) $('selRol').dataset.inicial = PEO;
  if (/^[wy]$/.test(q.get('m') || '')) modoTira[$('selRol').dataset.inicial || TODOS] = q.get('m') == 'w' ? 'dias' : 'meses';   // ?m=w (WEEK) o ?m=y (YEAR)
  if (q.has('c')) enListado = !/^(grid|0|off|no)$/i.test(q.get('c'));
  if (q.has('d')) mapaAbierto = !/^(off|0|no)$/i.test(q.get('d'));
  idInicial = (q.get('id') || '').trim();
  seeInicial = (q.get('s') || '').trim().toLowerCase();
  rutaInicial = {pa: q.get('pa'), ci: q.get('ci'), lu: q.get('lu'), f: q.get('f'), w: q.get('w'), r: q.get('r') || bRol};
  repiteReg = false;   // R, apagada al abrir, con cualquier tipo (también crazy mode: "no crazy always defaul R off")
}
// el resto de la ruta de la url (urlRuta): la fecha, los días y los roles; luego el lugar, la ciudad o el país, como al pulsarlos
let rutaInicial = {};
function abreRuta(){
  const {pa, ci, lu, f, w, r} = rutaInicial;
  if (f){
    const [anyo, mes] = f.split('-').map(Number), i = FECHAS.findIndex(x => !x.doce && x.anyo == anyo && (mes ? x.mes == mes - 1 : x.mes === undefined));
    if (i >= 0) fechaSel = i;
  }
  if (w) diasSel = new Set(w.split(',').map(Number).filter(d => d >= 0 && d <= 6));
  if (r) rolesSel = new Set(r.split(',').filter(Boolean));
  if (f || w || r) pinta();
  const enLu = lu && personas.find(p => p.pos && claveMarca(p) == lu);
  if (enLu){   // como pulsar su marca (aunque el mapa esté cerrado): el lugar, con su país
    lugarSel = lu;
    if (capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(enLu.pais)) paisSel = l; });
    pinta();
  }
  else if (ci) eligeCiudad(ci, ci.split('|')[1] || ci.split('|')[0]);
  else if (pa) eligePais(pa);
}
// ?id=<id del registro> (campo 10): abre esa ficha (evento, persona o lista) sola en el listado, como el buscador
