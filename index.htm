<!doctype html>

<html lang="es">

<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
  /* la letra de todos los textos, Inconsolata (2026-11-11, el usuario: "hay alguna fuente que ocupe menos ancho ?", "prueba"; antes, Courier New): de ancho fijo
     como Courier (las fechas, en columna), 0,5 em por letra (Courier, 0,6) y con eje de ancho: se estrecha de verdad (font-stretch), sin scaleX. Su copia en
     img/inconsolata/ (fontsource 5.3.0, licencia OFL en OFL.txt; sin pedirla a Google en cada visita); lo que no tiene (coreano, japonés...), la del sistema */
  @font-face { font-family: "Inconsolata"; font-style: normal; font-display: swap; font-weight: 200 900; font-stretch: 50% 200%;
               src: url(img/inconsolata/inconsolata-latin-ext-wdth-normal.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: "Inconsolata"; font-style: normal; font-display: swap; font-weight: 200 900; font-stretch: 50% 200%;
               src: url(img/inconsolata/inconsolata-latin-wdth-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  :root { --letra: "Inconsolata", "Courier New", Courier, monospace; --anchoEstrecho: 80%;   /* el listado y los títulos, estrechados: 0,4 em por letra (antes, Courier al 75 %: 0,45) */
          --maxFoto: 110px;   /* tamaño máximo de las fotos (= ANCHO_CARA) */ --altoTira: 25px; --altoFila: 27px; --altoEstado: calc(18px * 1.18 * 1.25 + 12px);   /* --altoEstado, la primera línea del listado, del alto de sus filas (2026-11-18, el usuario: "primera linea alto como las demas"; antes, 36 px): el listado tiene 18 px de letra; cada fila, 5,5 px arriba y abajo y 1 de borde (12) y, dentro, la caja del nombre (1.25 de línea × 1.18em); si cambian, cambiar esto y sus dos @media */ /* (2 px menos: 2026-11-16, el usuario: "tg/ reducir 2px altura botones"; antes 27 y 29; y el 15, "bajar 2px altura botones 1-4 filas": 29, antes 31) */   /* la fila de los selectores y las de la barra: así las migas quedan a la altura del mapa */ color-scheme: dark;
          /* la paleta: todos los colores de la página, aquí y solo aquí; el CSS, con var(--...), y el script, con paleta() (sus constantes, al principio del script:
             2026-11-17, el usuario: "pon como constantes del programa al inicio todos los colores , para css usa var") */
          --azulOscuro: #2f5a8f; --azulClaro: #8ab4f8; --amarillo: #ffd500; --grisClaro: #999; --grisNota: #666; --grisMedio: #444; --grisOscuro: #222; --negro: #000; --blanco: #fff; --rojo: #e53935; --verde: #43a047; --practica: #00fffe;
          /* los días de la ficha abierta en el calendario: el color de su tipo, más claro (55 % del color y 45 % de blanco; iluminaCal; 2026-11-18, el usuario:
             "ilumina en cal todo el evento, un rojo mas claro", "lo mismo para seminarios", "milongas y practicas") */
          --rojoClaro: #f19290; --verdeClaro: #98cb9a; --amarilloClaro: #ffe873; --practicaClaro: #73fffe;
          /* y los del mapa */
          --mapaMar: #0d1b2a; --mapaPais: #22406a; --mapaBorde: #888; --mapaMarca: #ffd8b0; --mapaAro: #e6d37e; --mapaLugar: #e53935; --mapaPaisSel: #f5c211;
          /* los de see by (la tabla de Beto, img/seoul.jpg; solo allí) */
          --agFondo: #fff; --agTexto: #000; --agLinea: #555; --agDias: #92d050; --agLocal: #ffd966; --agLocal2: #fff2cc; --agHora: #c9daf8;   /* (--agHora: en see by time, las horas en que está una milonga: azul claro) */   /* (--agLocal2: las fechas de see by country, en los meses alternos: amarillo claro; 2026-11-18, el usuario: "da colores alternos a la primera columna") */ --agGris: #e7e6e6; --agNombre: #1c2fc4; 
          /* las sombras y los velos: el negro con transparencia */
          --sombra: rgba(0,0,0,.6); --sombraSuave: rgba(0,0,0,.5); --sombraFuerte: rgba(0,0,0,.8); --velo: rgba(0,0,0,.7); --guia: rgba(0,0,0,.35);
          /* sus usos */
          --fondo: var(--negro); --barra: var(--grisOscuro); --tarjeta: var(--grisMedio); --sinfoto: var(--grisMedio);
          --texto: var(--blanco); --suave: var(--grisClaro); --enlace: var(--azulClaro); --borde: var(--negro);
          --acento: var(--amarillo); }
  .principal { --borde: var(--grisMedio); }   /* las líneas del listado, sobre el fondo negro */
  dialog, #sugs { --borde: var(--grisClaro); }   /* los popups y las sugerencias del buscador, con borde claro */
  /* los controles (los de la cabecera y el panel: buscador, tipo, cajas del total y las migas, botones), sin borde: transparente, el mismo tamaño; con el foco,
     el amarillo de siempre (2026-11-11, el usuario: "quita el borde blanco para los controles"; antes, gris claro) */
  .panel, .cabecera { --borde: transparent; }
  /* los controles (el panel y la barra de las migas), 2 px más grandes (2026-11-11, el usuario: "haz mas blanca para los controles y 2px mas grande"); lo que
     va en em, en proporción. Sin negrita, con la letra de los nombres del listado ("no pongas en negrita los controles, la misma fuente que los nombres en el
     listado"). La ficha, también más grande ("aplica tb al texto de la ficha"; en negrita hasta el 2026-11-11: ver abajo) */
  .panel, .cabecera, .detalle, #ficha { font-size: calc(1em + 2px); }
  /* en negrita, solo el contador del total (.cuenta) y los títulos: los nombres del listado, el de la ficha, el de OPEN SCHEDULER y los grupos del selector de tipo;
     el resto de los textos, sin negrita (2026-11-11, el usuario: "todos los textos de la pagina mismo estilo, sin negrita, negrita solo para el contador y los
     titulos"; antes, también la ficha, sus enlaces, la fecha y la ciudad del listado, "max 100 elements" y las etiquetas de las sugerencias) */
  html { overflow-y: scroll; }   /* la de la página, siempre: el listado no cambia de ancho al cambiar su largo */
  html:has(dialog[open]) { overflow-y: hidden; }   /* con un panel abierto (OPEN SCHEDULER, la ficha, KK), sin ella: solo la del panel, automática, si la necesita (2026-11-11, el usuario: "para los paneles la barra de scroll ponla automatica") */
  body { font-family: var(--letra); margin: 0; background: var(--fondo); color: var(--texto); }   /* todos los textos, con la letra de la fecha del listado (2026-11-11, el usuario: "usa la misma fuente para todos los terxtos"; antes, system-ui) */
  button, select, input, textarea, .leaflet-container { font-family: inherit; font-weight: inherit; }   /* todo con la letra del body: los controles y leaflet no la heredan (ni su grosor: los botones del panel, en negrita) */
  a { color: var(--enlace); }
  html { scrollbar-color: var(--grisClaro) var(--grisMedio); }
  ::selection { background: var(--azulClaro); color: var(--negro); }
  ::placeholder { color: var(--suave); opacity: 1; }
  :focus-visible { outline-color: var(--azulClaro); }

  .teselaBase { filter: sepia(1) hue-rotate(180deg) saturate(3) brightness(.85); }
  .teselaNombres { filter: sepia(.6) hue-rotate(180deg) saturate(1.5); }
  #mapa.leaflet-container { background: var(--mapaMar); }

  #mapa .leaflet-control-attribution { background: transparent; color: var(--grisClaro); font-size: 9px; }
  #mapa .leaflet-control-attribution a { color: inherit; }
  .cuerpo a { text-decoration: none; }
  /* los enlaces y sus logos, al pasar el ratón, como los demás controles: fondo azul claro y letra negra (2026-11-11, el usuario: "todos los logos de enlaces mismo
     over"; antes, la letra en blanco). El fondo, 2 px más allá del texto con una sombra: sin moverlo */
  .cuerpo a:hover, dialog .fuentes a:hover, #dCopiar:hover, #dFuentes:hover { background: var(--azulClaro); color: var(--negro); border-radius: 3px; box-shadow: 0 0 0 2px var(--azulClaro); }
  .cuerpo p.enlaces { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .cuerpo p.enlaces a { display: inline-flex; align-items: center; gap: 5px; }
  .cuerpo .icono { height: 16px; width: auto; }
  .cuerpo .icono[src$="yt.svg"] { height: 14px; }   /* el de YT, 2 px menos (2026-11-17, el usuario: "tg/ logo YT -2px"): 14 px de alto (19,6 de ancho; antes 16 x 22,4); centrado igual (inline-flex) */
  /* arriba, la cabecera, fija y de lado a lado (2026-11-11, el usuario: "extendemos la linea de miga a toda la pantalla", "movemos los botones de paises/ciudades
     debajo de migas en una tercera linea"): en la primera línea, el buscador (sobre el panel) y el total con sus botones (sobre el listado); en la segunda, las
     migas, tras el tipo ("tipo en la linea 2 luego las migas"); en la tercera, los botones de áreas, países o ciudades. Debajo, dos columnas: a la izquierda el panel (el mapa y las tiras), a la derecha
     el listado. Antes, el panel vertical desde arriba, con el buscador y los selectores, y sobre el listado la barra del total y las migas */
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); align-items: start; }
  .app.panelMitad { grid-template-columns: 130px minmax(0, 1fr); }   /* con el mapa y el calendario cerrados, el panel a la mitad (2026-11-16, el usuario: "los dos cerrados panel izq se reduce 50%"; ajustaPanel) */   /* el panel, 260 px (2026-11-11, el usuario: "reduce el panel de izquierda 20px", antes 320; luego "en el panel lateral reduce en 20px el ancho", antes 300; y "reduce alto ancho del mapa en 20px": el mapa es del ancho del panel, antes 280) */
  .cabecera { grid-column: 1 / -1; --altoTira: var(--altoFila); position: sticky; top: 0; z-index: 4; display: grid; grid-template-columns: var(--anchoTipo, 236px) minmax(0, 1fr);
              align-items: center; gap: 4px; padding: 8px 2px; background: var(--barra); box-shadow: 0 1px 6px var(--sombra); }   /* el buscador, del ancho del selector de tipo (--anchoTipo, lo pone anchoTipo; 2026-11-12, el usuario: "search mismo ancho que select tipo"): el total, a 4 px, encima de las migas. Antes, el buscador, del ancho de lo de dentro del panel (260 - 2 × 12, el del mapa), y el total a 4 px, como el tipo y las migas (2026-11-11, el usuario: "ajusta margin search y contador"; antes, a 28 px: donde empieza el listado) */
  /* el conjunto de las filas 1-4, a 2 px de los lados (2026-11-16, el usuario: "quitar los margin laterales de los botones", "dejar en 2px el margin lateral filas 1-4",
     "2px se refiere al conjunto de los botones filas 1-4"; antes, 12 px a la izquierda y 16 a la derecha: alineada con el panel) */
  .cabecera > .linea1, .cabecera > .lineaMigas, .cabecera > .fechas { grid-column: 1 / -1; }   /* (.fechas: los filtros, cuarta línea) */
  /* las líneas 2 y 3, en una (2026-11-18, el usuario: "vamos a fucionar linea2 y linea3 , migas el ancho se adapta al contenido, el resto de la linea para los
     botones de linea3"): las migas, del ancho de lo suyo (.ruta), y detrás, a 4 px, los botones de áreas, países o ciudades con el resto (.ciudadesMapa, por
     páginas: pintaCiudades mide lo que queda); sin botones, las migas solas. Antes, la línea 3 debajo, de todo el ancho, y sin botones no salía */
  /* el tipo, al inicio de la línea 1, delante del buscador (2026-11-18, el usuario: "pon sel tipo al inicio de linea 1"; antes, tras él); en pantalla estrecha,
     el buscador sigue solo en su línea, arriba (order), y el tipo abre la de debajo */
  .lineaRuta label { flex: none; display: flex; margin-right: auto; }   /* los botones (R, list, idioma, KK), a la derecha. Del 2026-11-17 al 18, el tipo tras el buscador (el usuario: "linea 1 : search + file type"; antes, en la línea 2, delante de las migas) */
  /* el buscador, en la misma línea, con todo el sitio que queda (2026-11-17, el usuario: "wider search all space in line couped"; antes, en su columna, del ancho
     del tipo: --anchoTipo). En pantalla estrecha, solo en su línea y el tipo y los botones debajo, como antes */
  .linea1 > .busca { flex: 1 1 0; }
  /* entre mapa, meses (controles) y calendario, 8 px (gap; 2026-11-15, el usuario: "margin mapa-meses-cal en 8px"; un rato, 4: "margin mapa, controles, calendario,
     foto en 4px"; antes, 10); la foto, abajo (margin-top: auto). A los lados,
     2 px (2026-11-15, el usuario: "margin lateral mapa-meses-cal-img 2px"; antes, 12), también en pantalla estrecha (el mismo padding: 2026-11-11); bajo la foto,
     2 px ("margin img bottom 2px"; antes, 12) */
  .panel { position: sticky; top: var(--altoBarra, 0px); z-index: 3; box-sizing: border-box; height: calc(100vh - var(--altoBarra, 0px)); height: calc(100dvh - var(--altoBarra, 0px));
           overflow-y: auto; scrollbar-width: thin;
           display: flex; flex-direction: column; gap: 8px; padding: 8px 2px 2px; background: var(--barra); box-shadow: 1px 0 6px var(--sombra); }   /* bajo la cabecera (--altoBarra, su alto) */
  .principal { min-width: 0; padding: 16px; }
  select { height: var(--altoFila); box-sizing: border-box; font-size: 1em; padding: 0 5px; background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  /* los controles (buscador, selectores y opciones, botones de tiras, mapa, lista, idioma, agenda y listado vacío, tercera línea, sugerencias, sesiones de la
     agenda): su padding, 1 px menos (2026-11-15, el usuario: "reduce el pading de todos los controles 1px") */
  #buscar { font-size: 1em; padding: 0 5px; height: var(--altoFila); width: 100%; box-sizing: border-box;
             background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  select:focus, #buscar:focus { outline: none; border-color: var(--acento); }   /* con el foco, el borde amarillo de los botones activos (2026-11-10, el usuario: "borde amarillo si select activo", "tb para el searh con foco"; antes, el azul de los enlaces) */
  #info { display: flex; }
  .busca { flex: 1 1 0; min-width: 0; }
  /* al principio de la línea de las migas, con su letra (.ruta, .85em; 2026-11-11, el usuario: "select tipo mismo tamaño de letra que las migas") y de ancho fijo,
     el del tipo más ancho ("seelctor tipo ancho fijo, ancho al texto mas ancho"; antes, un rato, el del elegido): lo mide anchoTipo con cada uno (field-sizing:
     content) y lo fija en su style */
  #selRol { box-sizing: border-box; font-size: .85em; width: auto; field-sizing: content; padding-right: 15px; white-space: nowrap; overflow: hidden; }   /* (en una línea: con los dos blancos de las opciones, "artist couple" partía en dos) */   /* 10 px más ancho (2026-11-11, el usuario: "ancho sel tipo 10 px mas ancho"): a la derecha, antes de la flecha */
  #sugs { position: fixed; width: min(28em, 90vw); z-index: 2;
          background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 4px; box-shadow: 0 2px 8px var(--sombra);
          max-height: calc(10 * 26px); overflow-y: auto; }
  #sugs div { height: 26px; line-height: 26px; padding: 0 7px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sugs div.activa, #sugs div:hover { background: var(--azulOscuro); }
  #sugs small { color: var(--suave); }
  #sugs .tipo { display: inline-block; width: 3.2em; margin-right: 6px; font-size: .75em;
                text-align: center; color: var(--suave); border: 1px solid var(--borde); border-radius: 3px; line-height: 1.5; }

  #sugs .tipo.geoARE, #sugs .tipo.geoCON { background: var(--blanco); border-color: var(--blanco); color: var(--negro); }
  #sugs .tipo.geoCIT { background: var(--amarillo); border-color: var(--amarillo); color: var(--negro); }
  #sugs .tipo.gente { background: var(--grisClaro); border-color: var(--grisClaro); color: var(--negro); }   /* personas de tipo people */
  #info img { width: 28px; height: 28px; opacity: .8; }
  #info:hover img { opacity: 1; }

  .parrilla { --cols: 8; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: stretch; }
  .parrilla .cara { flex: 0 0 calc((100% - (var(--cols) - 1) * 6px) / var(--cols)); max-width: var(--maxFoto); }
  .cara { position: relative; margin: 0; background: var(--negro); display: flex; flex-direction: column;
           border-radius: 6px; overflow: hidden; box-shadow: 0 1px 3px var(--sombraSuave); }
  .cara img, .cara .sinfoto { display: block; flex: none; width: 100%; aspect-ratio: 1; object-fit: contain; background: var(--negro); }   /* también los eventos: una cara cuadrada, la foto entera sobre negro (2026-10-28; antes dos caras, 16:9 y cover) */
  .cara img.sinfoto, .cuerpo > img.sinfoto { background: var(--sinfoto); }

  .cara figcaption { flex: none; height: calc(3.75em + 6px);   /* hasta 3 líneas */ box-sizing: border-box; padding: 3px; background: var(--barra); color: var(--texto);
                     font-size: .7em; line-height: 1.25; display: flex; align-items: center; justify-content: center;
                     text-align: center; overflow-wrap: anywhere; }
  .cara figcaption span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .yt { position: absolute; top: 3px; right: 3px; display: flex; filter: drop-shadow(0 1px 2px var(--sombra)); }
  .yt img { width: 18px; height: 12px; }   /* 2 px menos (2026-11-17, el usuario: "tg/ logo YT -2px"; antes 20 x 14) */
  .cara img, .cara figcaption { cursor: pointer; }

  .cuerpo > .conEnlace { cursor: pointer; }   /* la foto que abre algo (su enlace o, en la ficha del listado, el popup), también sin foto (.sinfoto) */

  .cara.evt img.logo, .cuerpo > img.logo { object-fit: contain; background: var(--blanco); padding: 6%; box-sizing: border-box; }

  dialog { border: 1px solid var(--borde); border-radius: 8px; padding: 16px; width: min(520px, 90vw);
           background: var(--barra); color: var(--texto); box-shadow: 0 4px 24px var(--sombraFuerte); }
  dialog { margin-top: 56px; }
  dialog::backdrop { background: var(--velo); }
  .cuerpo { display: flex; gap: 14px; align-items: flex-start; }

  .cuerpo > img, .cuerpo > .sinfoto { flex: none; align-self: flex-start; width: min(50%, var(--maxFoto)); height: auto;
                                        aspect-ratio: 1; object-fit: cover; border-radius: 6px; }   /* cuadrada: el alto, el del ancho (antes el del texto) */
  .cuerpo > img { background: var(--negro); }
  #ficha { width: min(780px, 90vw); }   /* el popup de la ficha, un 50% más ancho (2026-11-11, el usuario: "haz el popup de la ficha un 50% mas ancho"; antes, 520 px como los demás dialog) */
  #ficha .cuerpo > img, #ficha .cuerpo > .sinfoto { width: min(50%, calc(var(--maxFoto) * 1.875)); }   /* en el popup, más grande (2026-11-11, el usuario: "popup ficha aumenta imagen en un 25%", 137,5 px; luego "aumenta 50% la imagen del popup": 206 px); como mucho, la mitad del popup */
  .texto { flex: 1; min-width: 0; }
  dialog .texto { padding-right: 28px; }
  dialog .texto p.enlaces { margin-top: 0; }   /* el popup de KK: sin líneas en blanco */
  #kkTexto { display: block; width: 100%; height: 190px; border: 0; }   /* atribucionkk.htm; su alto, el que avisa (conecta) */
  .cuerpo h2 { margin: 0 0 8px; font-size: 1.1em; }
  .cuerpo p { margin: 0; font-size: .9em; overflow-wrap: anywhere; }   /* líneas de texto seguidas; los enlaces, aparte (p.enlaces) */
  .cuerpo p.enlaces + p.organiza, .cuerpo p.panelInfo + p.organiza { margin-top: 6px; }   /* los eventos que organiza: tras su lugar y sus enlaces, uno por línea */
  .cuerpo p.organiza .icono { vertical-align: -3px; margin-left: 2px; }   /* sus logos, tras su nombre */
  .cuerpo p.organiza { padding-left: 3.5em; text-indent: -3.5em; }   /* un nombre largo sigue bajo el nombre, no bajo su ● ni su mes (● APR y sus espacios: 3,5 letras) */
  .cuerpo p.organiza .estado { display: inline-block; width: 1em; text-align: center; text-indent: 0; }   /* ● ○ -: del mismo ancho, los nombres alineados */
  .cuerpo p.organiza .mes { display: inline-block; width: 1.5em; text-indent: 0; color: var(--suave); }   /* su mes, APR (letra de ancho fijo: 3 x .5em); sin fecha, el hueco */
  /* en la ficha del listado (el detalle), en gris oscuro (--grisNota), y al final de su línea, seguido, el logo de las fuentes (2026-11-13, el usuario: "si existe la
     linea note en detalle poner en gris oscuro; poner el logo fuente en la misma linea al final consecutivo"); sin línea note, el logo sigue abajo a la derecha */
  #dCuerpo p.leyendaOrganiza { color: var(--grisNota); }
  #dFuentes.enNota { position: static; display: inline-block; width: 12px; height: 12px; margin-left: 8px; vertical-align: -2px; }

  .calendario { flex: none; height: 178px; box-sizing: border-box; padding-top: 0; overflow: hidden; }   /* la tabla, dentro: el nombre del mes, de 8 px de línea (con su línea normal, 12 filas de unos 12 px no cabían en 112 y la foto la tapaba) */   /* la mitad de 225 (2026-11-15, el usuario: "reduce altura calendario 50%"; antes, 150 + 50 %) */   /* 20 % más alto (2026-11-15, el usuario: "aumenta un 20% la altura del calendario"; antes 112): con puntos, tres en cada fila */   /* (el selector, encima, en su línea: .calBarra) */   /* 12 filas de 12 px, sus 13 huecos de 1 y la leyenda (10 y su hueco) */

  .calTabla .cal { display: grid; grid-template-rows: repeat(var(--nAnyo, 4), var(--hAnyo, 3px)); row-gap: 0; grid-template-columns: 100%; justify-items: start; align-content: start; height: 100%; box-sizing: border-box; padding-top: 0; }   /* el año: las filas de los tipos que salen (--nAnyo, de festival, seminario, milonga, práctica), repartiéndose los 12 px (--hAnyo: uno, 12; cuatro, 3; pintaCalendario) */

  .calBarra:not(:has(> :not(.oculto))) { display: none; }
  #bCal { flex: none; display: inline-flex; align-items: center; justify-content: flex-start; gap: .4em; height: 18px; padding: 0 6px; border: 0; border-radius: 4px; font-size: .85em; line-height: 18px; background: var(--tarjeta); color: var(--texto); cursor: pointer; }   /* el ocultador del calendario: ▲ o ▼ calendar, como el del mapa ("mismas fuestes y triangiulos que los demas") */

    .fila .fTexto { flex-direction: column; align-items: stretch; gap: 0; }   /* la ciudad, bajo el título */
    .listado .fila { column-gap: 8px; }   /* el ancho, para el título */
    .fila .fMini { min-height: 2.3em; }   /* las dos líneas de la fila: con este mínimo, su columna ya mide la miniatura entera */
    :root { --altoEstado: calc(18px * 2.3 + 12px); }   /* la primera línea, como las filas aquí: la miniatura, 2.3em */
  }

  /* los tooltips del mapa, en azul (2026-11-15, el usuario: "tooltip del mapa en azul"): el de pasar el ratón (.tipNombre; antes gris) y la etiqueta de
     después del clic (antes blanca), con el azul claro de los controles bajo el ratón y la letra negra */
  /* todos, otra vez en azul claro y más pequeños (2026-11-17, el usuario: "tg/ todos los tooltip del mapa mas pequeños y fondo azul"; el 16, en blanco por
     "leyendas mapa en blanco"): la letra, 10 px (antes 12, la de Leaflet), interlineado 1,2 (antes 1,5) y el relleno, 2 px 5 px (antes 6): de 32 px de alto a 18.
     La flecha, de 4 px (antes 6), con la punta en el mismo sitio (los dos son direction: 'top') */
  .leaflet-tooltip { background: var(--azulClaro); color: var(--negro); border-color: var(--azulClaro); font-size: 10px; line-height: 1.2; padding: 2px 5px; }
  .leaflet-tooltip.tipNombre { border: 1px solid var(--borde); box-shadow: 0 1px 4px var(--sombra); }
  .leaflet-tooltip-top { margin-top: -4px; }
  .leaflet-tooltip-top::before { border-width: 4px; margin-left: -4px; margin-bottom: -8px; border-top-color: var(--azulClaro); }
  .leaflet-tooltip-bottom::before { border-bottom-color: var(--azulClaro); }
  .leaflet-tooltip-left::before { border-left-color: var(--azulClaro); }
  .leaflet-tooltip-right::before { border-right-color: var(--azulClaro); }
  .marcaLista { box-sizing: border-box; border-radius: 2px; background: var(--mapaMarca); color: var(--negro); }
  .marcaLista > div { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 8px; line-height: 1; }
  .mapaCaja { position: relative; z-index: 0; display: flex; }
  .zonaMapa { --altoMapa: 135px; position: relative; min-width: 0; }   /* la mitad y + 25 % (2026-11-15, el usuario: "tg/ reduce la altura del mapa 50%", "alto mapa + 25%"; antes, 172 px) */   /* + 25 % (2026-11-15, "aumenta el mapa en alto un 25%"; antes 108) */
  .zonaMapa:has(.mapaCaja:not(.cerrado, .oculto)) #bMapa { position: absolute; z-index: 1; top: 0; left: 0; width: 23px; }   /* abierto, dentro del mapa, en su esquina de arriba a la izquierda: el triángulo, en el mismo sitio que cerrado (2026-11-16, el usuario: "triangulo igual cuando esta abierto"; antes, a 5 px; y antes, arriba a la derecha) */
  /* la tercera línea de la cabecera: los botones del nivel de abajo, primero los de más líneas en el listado: en World las áreas, en un área sus
     países, en un país sus ciudades (de las marcas que se ven en el mapa) (2026-11-11, el usuario: "eliminamos el selector de area, y ponemos las areas como
     botones siguiendo la misma regla que para paises/ciudades"). En la primera celda back y, si no caben, en la última more... (pintaCiudades). Antes, en
     el panel, en dos columnas sobre el mapa */
  .ciudadesMapa { flex: 1 1 0; min-width: 0; display: flex; gap: 1px; overflow: hidden; font-size: .85em; }   /* entre ellos, 1 px (2026-11-11, el usuario: "areas/pais/ciudades margin 1px") */
  .ciudadesMapa:empty { display: none; }
  .ciudadesMapa > * { transition: opacity .2s; }
  /* tras pulsar en ella un área, un país o una ciudad, mientras el mapa vuela a su encuadre: la línea, vacía y en su sitio; se rellena al acabar de moverse el mapa
     (tiraVacia, tiraLlena; 2026-11-13, el usuario: "al cambiar de pais o ciudad haciendo click en la tercera linea, dejar vacia la linea y recargarla cuando
     termina el evento de mover el mapa") */
  .ciudadesMapa.enVuelo { pointer-events: none; }
  .ciudadesMapa.enVuelo > * { opacity: .4; }   /* deshabilitada, no vacía (2026-11-15, el usuario: "en vez de apagar la linea 3 usa deshabilitar"; antes, visibility: hidden): se ve, atenuada y sin clic, hasta que el mapa termina de cargar */
  option { background: var(--grisMedio); color: var(--blanco); }
  option:checked { background: var(--amarillo); color: var(--negro); }   /* la elegida */
  #selRol option.negrita { font-weight: 700; }
  #selRol option.negrita:checked { font-weight: 700; }
  /* el desplegable con la paleta, también al pasar el ratón; sin base-select, el del navegador con las opciones de arriba */
  @supports (appearance: base-select) {
    select, ::picker(select) { appearance: base-select; }
    select { display: flex; align-items: center; }
    select::picker-icon { color: var(--blanco); }
    ::picker(select) { padding: 2px 0; background: var(--grisMedio); color: var(--blanco); border: 1px solid var(--grisClaro); border-radius: 4px; box-shadow: 0 2px 8px var(--sombra); }
    option { padding: 1px calc(.5em - 1px); }   /* (.5em: donde el navegador pone el título del grupo) */
    #selRol option.dentro { padding-left: calc(.5em + 1ch - 1px); }   /* los tipos de community y de events, sangrados un carácter (2026-11-11, el usuario: "identa 1 caracter"; antes, dos y luego ninguno) */
    option::checkmark { display: none; }
    option:not(:disabled):hover, option:not(:disabled):focus-visible { background: var(--azulClaro); color: var(--negro); outline: 0; }
    option:checked, option:checked:hover, option:checked:focus-visible { background: var(--amarillo); color: var(--negro); font-weight: 400; }
  }
  .ciudadesMapa > span { flex: 1 0 auto; box-sizing: border-box; height: var(--altoTira); display: flex; justify-content: center; gap: 1ch; padding: 0 6px; cursor: pointer;
                       white-space: nowrap; align-items: center; border-radius: 4px; background: var(--tarjeta); color: var(--texto); }   /* cada uno, un botón como los meses: los de la página, todo el ancho de la línea, con el texto en el centro (2026-11-11, el usuario: "tercera linea que los botones ocupen todo el ancho"; antes, cada uno de su ancho) */
  .ciudadesMapa > span:hover { background: var(--azulClaro); color: var(--negro); }   /* el nombre bajo el ratón */
  /* cada nombre, al espacio que haya: como poco, el ancho de su texto; como mucho, un 20 % más (2026-11-16, el usuario: "linea 3 ajustar al espacion disponible,
     min ajustado al contenido, max 20% del ancho minimo"; el tope lo pone pintaCiudades, que mide el texto). Antes, un rato, solo su texto ("para linea 3
     siempre ajustar al texto contenido") y otro, hasta 1/8 de la línea; lo que sobra, vacío, y more... en su sitio, a la derecha ("sino hay mas valores dejar
     vacia la linea"; antes, los de la página llenaban la línea) */
  .ciudadesMapa > span:not(.atras):not(.mas) { flex: 1 0 auto; }
  .ciudadesMapa.mide > span { flex-grow: 0 !important; max-width: none !important; }   /* (midiendo el ancho de su texto) */
  /* more... ▶, pegado al último nombre, a 1 px como los demás (2026-11-18, el usuario: "pegar triangulos en linea 3 , copy/paste como esta"; antes, a la derecha
     de la línea, margin-left: auto): lo que sobra, entre él y el de copiar, que sigue al final de la línea */
  .ciudadesMapa > span.atras:not(:hover), .ciudadesMapa > span.mas:not(:hover) { color: var(--amarillo); }   /* back y more..., en amarillo */
  .ciudadesMapa > span.atras, .ciudadesMapa > span.mas { justify-content: center; flex: 0 0 var(--altoTira); padding: 0; }   /* cuadrados, del ancho de los de la línea 1 (C, list / grid, idioma, KK) y del de copiar: --altoTira (2026-11-18, el usuario: "botones triangulos y copy/paste mismo ancho que los botones cuadrados de la priemera linea"; antes, 40 px). Siempre del mismo ancho: lo que sobra en la línea, para los nombres (2026-11-11, el usuario: "los botones de navegacion en la tercera linea siempre del mismo ancho") */
  .ciudadesMapa > span.vacio, .ciudadesMapa > span.vacio:hover { background: var(--tarjeta); cursor: default; }   /* back o more... sin nada que hacer: la casilla, vacía y en su sitio (2026-11-12, el usuario: "linea 3 mantenemos fijos los controles, sino tienen accion presentar vacios") */
  .ciudadesMapa > span.sel, .ciudadesMapa > span.sel:hover { background: var(--acento); color: var(--negro); }   /* la ciudad elegida, del color de los botones activos */
  .ciudadesMapa > span.cero, .ciudadesMapa > span.cero:hover { background: none; color: var(--grisClaro); cursor: default; }
  .ciudadesMapa .nom { max-width: 16em; overflow: hidden; text-overflow: ellipsis; }   /* el nombre; uno muy largo, cortado con … */
  .ciudadesMapa > span:not(.sel):not(.cero):not(:hover) .nom { color: var(--acento); }   /* el nombre, en amarillo, como lo que se pulsa en las migas (2026-11-12, el usuario: "tercera linea nombres en amarillo"); el número, en blanco. Al pasar el ratón y la elegida, en negro; a cero, en gris */
  /* a la derecha del nombre, con C, el contador, a un blanco (gap: 1ch, un carácter de la letra; 2026-11-18, el usuario: "si contadores de en ciudades separados 1
     blanco del texto"; antes, a 8 px y de ancho fijo, tres cifras alineadas a la derecha: un número corto quedaba más lejos. Ese ancho fijo era del 2026-11-11, el
     usuario, al elegir un mes: "hay un ligero desplazamiento"; ahora, como en la cuarta línea, lo justo) */
  .ciudadesMapa .num { flex: none; font-variant-numeric: tabular-nums; }
  .ciudadesMapa span.atras svg, .ciudadesMapa span.mas svg { flex: none; width: .6em; height: .71em; display: block; }   /* del tamaño de la flecha ▼ del selector de tipo, girada (medida: 0,71 em de lado y 0,6 de fondo, con la misma letra; 2026-11-11, el usuario: "mismo tamaño") */   /* back (volver al nivel de arriba o a la página anterior) y more... (la siguiente): solo su logo, centrado */
  .mapa { flex: 1; min-width: 0; height: var(--altoMapa); max-height: 19.1vh; border-radius: 6px; }   /* (antes, 24.5vh: la mitad y + 25 %, como el alto) */
  #bMapa:disabled { opacity: .45; cursor: default; }
  /* list / grid: su icono, dibujado (ICONO_LISTA, ICONO_PARRILLA) y centrado en vertical con flex (2026-11-11, el usuario: "el logo de grid algo mas grande, los
     dos logos centrados verticalmente"). Antes, las letras ☰ y ▦, el ▦ subido 2 px a mano: Courier no las tiene y cada equipo las pinta con otra letra, de otro
     tamaño y a otra altura (aquí el ☰ quedaba 2,5 px alto). El de grid, más grande */
  #bListado { display: inline-flex; align-items: center; justify-content: center; gap: .45em; }
  #bListado .iBoton { display: block; flex: none; width: 13px; height: 13px; color: var(--acento); }   /* en amarillo (2026-11-11, el usuario: "el logo de list y grid amarillo"), como los de back, more... y copiar */
  #bListado .iParrilla, #bListado .iLista { width: 16px; height: 16px; }   /* (la lista, también: con 13 px las viñetas no se ven) */
  #bListado:hover { background: var(--azulClaro); color: var(--negro); }   /* al pasar el ratón, como las migas y los botones de áreas, países y ciudades (2026-11-11, el usuario: "list/grid el mismo over") */
  #bListado:hover .iBoton { color: inherit; }
  /* (el botón R, delante de C, ya no (2026-11-18, el usuario: "quita el boton R"): R se cambia con su texto, en la primera línea del listado, «(R) condensed» /
     «(R) expand» (#total .pasoR, cambiaRepite). Del 2026-11-16 al 18, un botón cuadrado como list / grid, encendido en amarillo) */
  /* C, tras R, como ella (2026-11-17, el usuario: "add boton after R : C , on show counter in linea 3,4 ; off no show", "default is off"): encendida, en
     amarillo, los contadores de las líneas 3 y 4 a la vista; apagada (al abrir), sin ellos (.sinContadores en la cabecera). No se guarda: al abrir, apagada */
  #bContador { flex: none; width: var(--altoTira); height: var(--altoTira); padding: 0; box-sizing: border-box; font-size: .85em; cursor: pointer;
               background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  #bContador.activo { background: var(--acento); color: var(--negro); }
  #bContador:not(.activo):hover { background: var(--azulClaro); color: var(--negro); }
  .sinContadores .ciudadesMapa .num, .sinContadores .tira button .num { display: none; }
  /* el triángulo del botón map, como los demás: relleno, amarillo y del tamaño de la flecha ▼ del selector de tipo (el botón, con la misma letra: .85em), hacia
     arriba con el mapa abierto y hacia abajo cerrado; al pasar el ratón, el botón en azul claro y negro (2026-11-11, el usuario: "triangulo del boton map como los
     demas"; antes, las letras ▴ y ▾, subidas 2 px) */
  #bMapa { display: inline-flex; align-items: center; justify-content: flex-start; gap: .4em; }   /* el triángulo y el texto, a la izquierda (2026-11-16, el usuario: "alinear texto izq") */
  .iMapa { display: block; flex: none; width: .71em; height: .6em; color: var(--acento); }   /* como la flecha ▼ del selector de tipo y los triángulos de back y more (.71 × .6 em); el del calendario, igual (.iCal) */
  #bMapa:not(:disabled):hover { background: var(--azulClaro); color: var(--negro); }
  #bMapa:hover .iMapa { color: inherit; }
  .vacio { padding: 24px 12px; text-align: center; color: var(--suave); }   /* el listado a cero */
  .vacio button { margin-top: 10px; font-size: .9em; padding: 3px 9px; cursor: pointer; background: var(--tarjeta); color: var(--texto); border: 1px solid var(--borde); border-radius: 4px; }
  @media (max-width: 600px) { .zonaMapa { --altoMapa: 95px; } }   /* + 25 % (antes 76) */   /* (antes, 122 px; la mitad, 61, y + 25 %) */
  .aviso { color: var(--suave); }
  /* la foto de la ciudad elegida, en el panel tras las tiras (2026-11-11, el usuario: "situala en el panel izquierdo a continuacion, muestra la imagen de la ciudad
     selccionada"): el banner de Wikivoyage o una de Openverse, enlazada (CIUDADES_FOTO de paises.js: import/ciudadfoto.py); del ancho del panel, 2:1 y recortada; al pulsarla, Google
     Maps con la ciudad ("click en la imagen abrimos maps con la ciudad"). Debajo, su autor y su licencia (CC: se dicen), con su página en Commons. No encoge:
     si no cabe, el scroll es el de las tiras */
  .fotoCiudad { flex: none; margin: 0; display: flex; flex-direction: column; gap: 2px; }   /* en el panel, bajo el calendario (2026-11-15, el usuario: "pon la imagen en el panel izquierdo"; un rato, al final del listado) */
  .fotoCiudad #fcMapa { display: block; position: relative; border-radius: 6px; }
  .fotoCiudad img, .fotoCiudad canvas { display: block; width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 6px; background: var(--tarjeta); }   /* como una acuarela (2026-11-11, el usuario: "usa css filter para poner la foto como una acuarela"; luego "eso es desenfocada pero no acuarela", "es bastante pobre"): la pinta acuarela() en el canvas #fcLienzo; mientras, o si no se puede, la foto tal cual */   /* 2:1: el centro del banner de Wikivoyage (7:1; 2026-11-11, el usuario: "usa 1"; antes, 4:3) */
  .fotoCiudad img { filter: sepia(1); }   /* en sepia mientras se pinta la acuarela, o si no se puede (2026-11-11, el usuario: "tarda un poco en cargarla, pon en css sepia la foto hasta que carga el canvas") */
  .fotoCiudad canvas { position: absolute; inset: 0; height: 100%; opacity: 0; transition: opacity 3s ease; }   /* 3 s (2026-11-11, el usuario: "pon 3s en la transicion"; antes, .9 s) */   /* encima de la foto: aparece fundiéndose sobre su misma foto; al cambiar de ciudad, la de antes se quita sin fundido (pintaFotoCiudad) (2026-11-11, el usuario: "haz una transicion de una foto a otra") */
  .fotoCiudad canvas.pintada { opacity: .5; }   /* la acuarela, al 50 % sobre la foto (2026-11-16, el usuario: "img ciudad, dejar el css al 50% opacidad sobre la foto"; antes, opaca) */
  .fotoCiudad img { transition: filter 3s ease; }
  .fotoCiudad:has(canvas.pintada) img { filter: none; }   /* pintada la acuarela, la foto debajo con sus colores (el sepia, solo mientras se pinta) */
  .fotoCiudad #fcMapa:hover { outline: 2px solid var(--azulClaro); }   /* el enlace, al pasar el ratón: con el azul de los demás */
  .fotoCiudad figcaption { font-size: .7em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fotoCiudad #fcPie { color: var(--suave); text-decoration: none; border-radius: 3px; }
  .fotoCiudad #fcPie:hover { background: var(--azulClaro); color: var(--negro); box-shadow: 0 0 0 2px var(--azulClaro); }
  .oculto { display: none !important; }

  .detalle { position: relative; box-sizing: border-box; margin: 0 0 16px; padding: 16px; background: var(--barra);
             border: 1px solid var(--borde); border-radius: 8px; }

  /* arriba del listado, tapando su primera línea (#estado), también sin bajar la página: sube su alto (margen negativo) y va encima (z-index); fija bajo la cabecera
     (2026-11-18, el usuario: "abrir detalle top listado, tapando primera linea"; antes, fija bajo la primera línea, que se veía) */
  .detalle { position: sticky; top: var(--altoBarra, 0px); z-index: 3; margin-top: calc(-1 * var(--altoEstado));
             box-shadow: 0 16px 0 var(--fondo); }   /* (por debajo, 16 px de fondo: el listado no se ve pegado a ella; por encima ya está la cabecera) */
  .detalle.larga { position: relative; top: auto; }   /* sin scroll propio: la que no cabe en la ventana no se queda fija, se lee bajando la página */
  .detalle .texto { margin-right: 30px; }
  /* título, fecha, org, enlaces...: todas las líneas con el mismo interlineado; también en el popup (2026-11-11, el usuario: "en el popup el interlineado no es
     igual"; antes, con los márgenes de cada línea: 8 px bajo el título, 4 sobre el panel) */
  .detalle .texto > *, #ficha .texto > * { margin: 0; line-height: 22px; }
  .detalle .texto p.enlaces, #ficha .texto p.enlaces { margin-top: 0; row-gap: 0; }
  #dCerrar, #fCerrar, #aCerrar, #aBajar, #vCerrar, #pCerrar, #pBajar, #aCopiar, #pCopiar { position: absolute; top: 6px; right: 8px; box-sizing: border-box; width: 26px; height: 26px; padding: 0; border: 2px solid currentColor; border-radius: 50%;
             display: flex; align-items: center; justify-content: center; background: none; color: var(--acento); cursor: pointer; }   /* en amarillo, como los demás logos (2026-11-11, el usuario: "logo cerrar es amarillo"; antes, blanco) */
  #dCerrar svg, #fCerrar svg, #aCerrar svg, #aBajar svg, #vCerrar svg, #pCerrar svg, #pBajar svg, #aCopiar svg, #pCopiar svg { display: block; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }   /* la X dibujada: la × de la letra se descentraba según la fuente */
  #fCerrar, #aCerrar, #aBajar, #vCerrar, #pCerrar, #pBajar, #aCopiar, #pCopiar { top: 8px; }
  /* el vídeo de YouTube, en un popup (2026-11-11, el usuario: "podemos reproducir YT en un popup en vez de abrir nueva pestaña?"): 16:9, del ancho de la
     ventana como mucho, encima de la ficha; abajo, el enlace para verlo en YouTube (si no deja insertarlo: abierto como file://, sin referer) */
  #video { width: min(960px, 92vw); padding: 36px 12px 10px; box-sizing: border-box; }
  #video iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 4px; background: var(--negro); }
  #video #vEnYt { display: inline-block; margin-top: 6px; font-size: .8em; color: var(--suave); }
  #video #vEnYt:hover { color: var(--azulClaro); }   /* el del popup, a la misma distancia arriba y a la derecha */
  #dCerrar:hover, #fCerrar:hover, #aCerrar:hover, #aBajar:hover, #vCerrar:hover, #pCerrar:hover, #pBajar:hover, #aCopiar:hover, #pCopiar:hover { border-radius: 4px; background: var(--azulClaro); border-color: var(--azulClaro); color: var(--negro); }   /* bajo el ratón, de círculo a cuadrado y azul claro con la X negra, como los demás (2026-11-11, el usuario: "over de cerrar tb azul") */
  /* la primera línea de la ficha: el nombre, su tipo y el logo de copiar el enlace, seguidos en la misma línea, el logo a un blanco del tipo; si no caben,
     saltan a la siguiente (2026-11-10, el usuario: "debe salir en la mismalinea : nombre+tipo+copy", "sino cabe salta", "copy ... separado 1 blanco,
     despues del tipo de evento"). La última palabra del nombre, el tipo y el logo no se separan (.finTitulo): el logo nunca queda solo en una línea */
  .cuerpo h2 .finTitulo { white-space: nowrap; }
  #dFuentes { position: absolute; right: 13px; bottom: 8px; width: 16px; height: 16px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--azulClaro); }   /* su logo, del color del texto (currentColor): en negro al pasar el ratón */
  #dFuentes svg { width: 100%; height: 100%; display: block; }
  dialog .fuentes a { display: block; margin: 8px 0; overflow-wrap: anywhere; }
  #dCopiar { display: inline-flex; vertical-align: -2px; margin-left: .3em; border: 0; background: none; color: var(--acento); padding: 0; cursor: pointer; }   /* .3em: un blanco */
  #dCopiar svg { width: 16px; height: 16px; display: block; }

  .detalle.filas { background: var(--fondo); border: 0; border-radius: 0; border-top: 1px solid var(--borde);
                   border-bottom: 1px solid var(--borde); padding: 14px 10px; }
  .detalle.filas h2 { font-weight: bold; font-size: 1.05em; }
  .detalle.filas p { color: var(--suave); }
  .detalle.filas h2 .hTipo, #ficha h2 .hTipo { color: var(--suave); font-size: .8em; margin-left: 10px; }
  /* el título de la ficha, con la letra del nombre del listado: en negrita, su tamaño y estrechado con la letra (font-stretch) (2026-11-11, el usuario: "titulo de
     la ficha , misma fuentes que nombre del listado"). Sin scaleX (2026-11-12, el usuario: "no uses scale, usa solo em"); antes, con Courier, se pintaba al 75 % y el botón de copiar se ensanchaba */
  .detalle h2, .detalle.filas h2, #ficha h2 { font-size: calc(.85em + 6px); font-weight: bold; font-stretch: var(--anchoEstrecho); }
  .detalle h2 #dCopiar { margin: 0 3px 0 calc(.3em + 3px); }   /* 3 px más a cada lado */
  .detalle.filas .cuerpo > img { border-radius: 3px; }

  /* pantalla ancha: el panel vertical. Bajo los selectores, el mapa; debajo los países o ciudades en 2 columnas, del alto de
     su contenido; al final, meses, días y roles, en rejilla (no caben en una tira) */
  /* OPEN SCHEDULER: sin scroll lateral, las 7 columnas caben siempre; cada milonga, dos líneas: la hora y el nombre, cortado si no cabe */
  /* los open, see by venue y see by time, bajo el calendario, a partes iguales y con el estilo de los botones del panel (como el ocultador: 18 px, .85 em, fondo de
     tarjeta) (2026-11-16, el usuario: "no veo los see , ponerlos debajo del calendario , mismo estilo de los otros botones, para week or moth de milongas y
     practicas"; antes, en la línea de encima del calendario, a la derecha, con letra de 8 px) */
  #bAgendas { flex: none; display: flex; gap: 4px; }
  #bAgendas button { flex: 1 1 0; min-width: 0; height: 18px; padding: 0 6px; border: 0; border-radius: 4px; font-size: .85em; line-height: 18px; white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; background: var(--tarjeta); color: var(--texto); cursor: pointer; }
  #bAgendas button:not(:disabled):hover, #aAtras:hover, #aSigue:hover { background: var(--azulClaro); color: var(--negro); }
  /* OPEN SCHEDULER, a toda la pantalla, de ancho y de alto (2026-11-11, el usuario: "haz open ocupe todo el ancho alto de la pantalla"; antes, hasta 1280 px de
     ancho, con 8 px de margen y del alto de su contenido): sin margen, sin borde ni esquinas redondas; lo que no cabe, con el scroll de su tabla (#aScroll) */
  /* (con inset 0 y sin ancho ni alto: el de la ventana sin su barra de scroll; con 100vw, la incluía y el botón de cerrar quedaba debajo de ella, fuera; 2026-11-11, el
     usuario: "cerrar del panel open esta fuera del panel") */
  #agenda { box-sizing: border-box; inset: 0; width: auto; height: auto; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; border-radius: 0; overflow: hidden; }
  #agenda[open] { display: flex; flex-direction: column; }
  /* con el formato de la tabla de Beto (img/seoul.jpg; 2026-11-11, el usuario: "para los paneles open usa este formato"): sobre blanco, el título grande en el
     centro y la semana en rojo a la derecha; la fila de los días en verde, arriba y otra vez abajo; los locales (o las horas) en amarillo, a la izquierda y otra
     vez a la derecha; las filas, blancas y grises alternas; en cada celda, el nombre de la milonga en azul y debajo su horario (20:00 ~ 24:30), centrados y en
     las líneas que necesiten. En negrita, los títulos: el de la tabla, los días, los locales y los nombres. Antes, oscuro como el resto, con la hora sobre el
     nombre, cortado si no cabía. Sus colores, los de la tabla de Beto, solo aquí */
  #agenda { background: var(--agFondo); color: var(--agTexto); }   /* (sus colores, --ag..., en la paleta: :root) */
  #aCabeza { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 10px 110px; }   /* el cursor, el título en el centro y la semana; a los lados, sitio para copiar, descargar y la X (y el título, en el centro) */
  #aCursor { justify-self: start; display: flex; }
  #aTitulo { margin: 0; font-size: 1.6em; font-weight: bold; text-align: center; }
  #aCerrar, #aBajar, #pCerrar, #pBajar, #aCopiar, #pCopiar { background: var(--barra); }   /* sobre el blanco, con el fondo oscuro de la página: su X amarilla se ve */
  /* see by venue / see by time, otra vez en html, como see by country (2026-11-18, el usuario: "haz html los otros see by, add en todos descargar para descargar
     la imagen"; del 2026-11-17 al 18, como imagen JPG en el modal: "abre imagen iso tabla"): la tabla a la vista, y cada milonga se pulsa (su ficha encima).
     Arriba a la derecha, junto a la X, descargar (#aBajar, #pBajar): la imagen JPG del título y la tabla entera (#aFuente, #pFuente; bajaImagen) */
  #aBajar, #pBajar { right: 42px; display: flex; align-items: center; justify-content: center; color: var(--acento); }
  /* y a su izquierda, copiar el enlace que abre este see by (#aCopiar, #pCopiar; 2026-11-18, el usuario: "podemos añadir un parametro a la url para tener los see by
     desde la url ? pon el copy/paste en el boton del see by"): la url de la ruta con ?s= (copiaSee, abreSee) */
  #aCopiar, #pCopiar { right: 76px; display: flex; align-items: center; justify-content: center; color: var(--acento); }
  #aFuente, #pFuente { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: var(--agFondo); color: var(--agTexto); }
  #aScroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; padding: 0 12px 12px; }
  #aTitulo .logoTipo, #pTitulo .logoTipo { margin-right: 10px; vertical-align: .15em; }   /* el logo del tipo, si todo es de uno (ponTitulo) */
  #aTitulo { grid-column: 2; }   /* el título, en la columna del centro aunque el cursor (la primera) esté oculto: si no, caía en la primera, a la izquierda */
  /* los see by, cada celda en una línea, también a media pantalla (2026-11-18, el usuario: "una linea para media pantalla en todos los see"): las columnas, del ancho de lo suyo (lo que sobra, para los
     días, las horas o el nombre); si no caben, la tabla se desliza a lo ancho (y la imagen sale entera) */
  #agenda table { display: grid; grid-template-columns: max-content max-content repeat(7, minmax(max-content, 1fr));
                  width: max-content; min-width: 100%; font-size: .85em; border-right: 1px solid var(--agLinea); border-bottom: 1px solid var(--agLinea); }   /* by venue: el local y la milonga, del ancho de su nombre (con tope); los días, iguales. Las columnas, las pone pintaAgenda (by time: el nombre y las horas) */
  #agenda thead, #agenda tbody, #agenda tfoot, #agenda tr { display: contents; }
  #agenda th, #agenda td { box-sizing: border-box; padding: 4px; border-top: 1px solid var(--agLinea); border-left: 1px solid var(--agLinea); white-space: nowrap;
                           font-weight: 400; text-align: center; align-content: center; }
  #agenda tbody tr:nth-child(even) td { background: var(--agGris); }
  #agenda tbody th { background: var(--agLocal); font-weight: bold; }
  #agenda tbody th.alterno { background: var(--agLocal2); }   /* by time, los días alternos */
  #aDias th, #aPie th { background: var(--agDias); font-weight: bold; }
  #aDias th { position: sticky; top: 0; z-index: 1; }
  #aDias small { display: block; font-size: .85em; font-weight: 400; font-variant-numeric: tabular-nums; }   /* bajo el día, su fecha */
  #aDias .hoy { background: var(--acento); }
  #agenda td.aNom { text-align: left; }   /* by venue, el nombre de la milonga */
  #agenda .pNom { white-space: nowrap; }   /* by venue y by time, el nombre de la milonga, en una línea (2026-11-18, el usuario: "milonha name en una fila") */
  #agenda tbody tr td.enHora { background: var(--agHora); }   /* by time, las horas en que está */
  /* by time, una hora en parte (empieza o acaba a :30): su trozo, proporcional, de --desde a --hasta (2026-11-18, el usuario: "see by time si empieza a :30 poner
     proporcional en la celda"); el resto, del color de su fila */
  #agenda tbody tr td.enHoraParte { background-image: linear-gradient(to right, transparent var(--desde), var(--agHora) var(--desde), var(--agHora) var(--hasta), transparent var(--hasta)); }
  #aFilas td .sesion { display: flex; flex-direction: column; align-items: center; }   /* by venue, la hora, centrada también si no cabe (2026-11-18, el usuario: "see by venue centrar horas") */
  #aFilas tr.aNoRegular:last-of-type th, #aFilas tr.aNoRegular:has(+ tr:not(.aNoRegular)) > * { border-bottom: 2px solid var(--agDias); }   /* lo no regular, arriba: separado de lo regular */
  #agenda td.vacio { grid-column: 1 / -1; padding: 12px; }
  #aAtras, #aSigue { width: 2.6em; height: var(--altoTira); margin: 0 2px; padding: 0; font-size: 1.2em; line-height: 1; cursor: pointer;
                     background: var(--tarjeta); color: var(--texto); border: 1px solid var(--tarjeta); border-radius: 4px; }
  .sesion { display: block; box-sizing: border-box; width: 100%; padding: 1px 3px; border: 0; border-radius: 3px; font-size: inherit; text-align: center; cursor: pointer;
            background: none; color: inherit; }
  .sesion:hover { background: var(--azulClaro); color: var(--negro); }
  .sesion:not(.local) { font-size: .85em; padding-top: 0; padding-bottom: 0; }   /* la letra, más pequeña: cada una en sus tres líneas (2026-11-16, el usuario: "reducir la letra para que entre en 3 lineas cada") */
  /* el mismo interlineado en todas las líneas de una celda, también de una milonga a la siguiente (2026-11-16, el usuario: "see x mismo interlineado en todas las
     lineas"; antes, 4 px y su relleno, 2, más entre una y otra) */
  .sesion .hora { display: block; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sesion .hora .guion { display: inline-block; width: .35em; text-align: center; }   /* el guion de 1930-2330, estrecho: los tiempos, más juntos (2026-11-19, el usuario: "un guion mas corto") */   /* by venue, la hora (2000-2330): en una línea (2026-11-18, el usuario: "hora HHMM-HHMM one line") */
  .sesion.local { font-weight: bold; }   /* el nombre del local */
  .pNom .estrella, .pNom .estrella.go { color: var(--rojo); }   /* en rojo, también las de home y think (2026-11-18, el usuario: "start see by red"; un rato, en azul, el del nombre: "start see by blue"; antes, amarilla y roja) */
  .pNom .estrella { font-size: calc(1em + 6px); }   /* la ★ de los favoritos, 6 px más grande (2026-11-18, el usuario: "size +2px start", "sz start fav +2pc", "+2px"); en su sitio ("start see by red , up -2px"; un rato, 2 px más arriba: "up start fav 2px") */
  .pNom .logoTipo { margin-right: 3px; }   /* el logo de su tipo, delante del nombre (2026-11-18, el usuario: "incluye delante del nombre en see by el logo del tipo de artefacto") */
  .sesion .logoTipo { margin: 0; }   /* by venue, sin hora: el logo, solo en su celda */
  .pNom .pLocal { color: var(--agTexto); }   /* by time, el local delante de la milonga, en negro: «En Paz Studio - Wol Luminoso» */
  .pNom small { font-weight: 400; color: var(--agTexto); }   /* detrás del nombre: las semanas de una mensual, (1ª3ª); by time, no time */
  /* see by country (2026-11-18, el usuario: "creamos otra tabla, esta vez en html, mismo formato que las see by, se llamara see by country"): como los see by,
     a toda la pantalla y con los colores de la tabla de Beto, pero la tabla en html, a la vista (sin imagen: cada evento se pulsa y abre su ficha encima). La
     primera columna, las fechas, fijas a la izquierda; las demás, de 130 px como poco: con muchas, scroll a lo ancho (pintaPais) */
  #pais { box-sizing: border-box; inset: 0; width: auto; height: auto; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; border-radius: 0; overflow: hidden;
          background: var(--agFondo); color: var(--agTexto); }
  #pais[open] { display: flex; flex-direction: column; }
  #pCabeza { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 10px 110px; }   /* el título en el centro y el periodo a la derecha; a los lados, sitio para copiar, descargar y la X */
  #pTitulo { grid-column: 2; margin: 0; font-size: 1.6em; font-weight: bold; text-align: center; }
  #pScroll { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; margin: 0 12px 12px; }
  /* una fila por evento: la fecha, su nombre entero y, en la columna de su país (o ciudad, o área), el logo de su tipo (2026-11-18, el usuario: "see by month ,
     segunda columna name(completo) , siguientes cada pais con 3 letras, en las celdas de los paises , el logo"); antes, una fila por fecha y los eventos en
     las celdas de los países, de 130 px */
  /* sin scroll a lo ancho a media pantalla (2026-11-19, el usuario: "see by mont ajusta columnas para no poner scroll horizontal a media pantalla"): la fecha y los
     países, del ancho de lo suyo (CHN, el logo); el nombre, lo que queda (6em como poco), en una línea, cortado con … si no cabe (entero, en su ficha). Con muchos
     países (Europa) puede no caber: entonces, el scroll. Antes, el nombre entero y los países de 3em */
  #pais table { display: grid; grid-template-columns: max-content minmax(6em, 1fr) repeat(var(--columnas, 1), max-content); width: 100%;
                font-size: .85em; border-right: 1px solid var(--agLinea); border-bottom: 1px solid var(--agLinea); }
  #pais thead, #pais tbody, #pais tr { display: contents; }
  #pais th, #pais td { box-sizing: border-box; padding: 4px; border-top: 1px solid var(--agLinea); border-left: 1px solid var(--agLinea); white-space: nowrap;
                       font-weight: 400; text-align: center; align-content: center; }
  #pais tbody tr:nth-child(even) td { background: var(--agGris); }
  #pais tbody th { position: sticky; left: 0; background: var(--agLocal); font-weight: bold; white-space: nowrap; font-variant-numeric: tabular-nums; }   /* las fechas */
  #pais tbody tr.mesAlterno th { background: var(--agLocal2); }   /* las fechas, por meses alternos: amarillo y amarillo claro (2026-11-18, el usuario: "da colores alternos a la primera columna", "alterna colore por meses alternos"; un rato, fila a fila) */
  #pCols th { position: sticky; top: 0; z-index: 1; background: var(--agDias); font-weight: bold; }   /* los países (o ciudades, o áreas), arriba */
  #pCols th:first-child { left: 0; z-index: 2; }
  #pais td.vacio { grid-column: 1 / -1; padding: 12px; }
  #pais td.pCeldaNom { text-align: left; overflow: hidden; }
  #pais .pNom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* el nombre, en una línea; si no cabe, con … */
  .pNom { display: block; width: 100%; box-sizing: border-box; padding: 1px 3px; border: 0; border-radius: 3px; background: none; font: inherit; font-weight: bold;
          text-align: left; color: var(--agNombre); cursor: pointer; }   /* el nombre entero, en azul, con la ★ delante si es favorito */
  .pLogo { display: inline-flex; padding: 0; border: 0; border-radius: 50%; background: none; font: inherit; color: var(--agNombre); cursor: pointer; }   /* el logo del tipo, en su país */
  .pNom:hover, .pLogo:hover { background: var(--azulClaro); color: var(--negro); }
  .pLogo .logoTipo { font-size: 1em; margin: 0; }   /* más grande que delante de un nombre: solo, en su celda */
  /* (sin las reglas del popup estrecho, de 800 y 600 px: la tabla, fuera de la vista, siempre del mismo ancho; la imagen se ve a lo ancho del modal) */
  /* el límite del panel vertical: 720 px (2026-11-10, el usuario: "mueve el punto de ruptura para ver a media pantalla el menú lateral"; antes 800,
     y Brave a media pantalla mide 768). El mismo en estos tres @media y en isMovil() */
  @media (min-width: 721px) {
    /* (las tiras de meses, días y roles, en rejilla en el panel: ya no; desde el 2026-11-15, en la cabecera, en una fila, como en pantalla estrecha) */
    /* arriba del panel, el mapa, cuadrado (2026-11-11, el usuario: "manten el mapa cuadrado, mismo alto que ancho"; antes, bajo los países), y su botón dentro,
       arriba a la derecha ("boton map arriba derecha"); cerrado, el botón en su fila. No encoge: si no cabe en la ventana, el scroll del panel */
    .zonaMapa { flex: none; display: flex; flex-direction: column; }
    .mapaCaja { flex-direction: column; }
    .mapa { flex: none; box-sizing: border-box; height: auto; aspect-ratio: 1.28; max-height: none; }   /* + 25 % de alto (2026-11-15, el usuario: "aumenta el mapa en alto un 25%"): 1,6 / 1,25 = 1,28 (antes 1,6:1; antes, 2:1 y cuadrado) */
    .fotoCiudad { margin-top: auto; }   /* abajo del panel (2026-11-15, el usuario: "foto pegada abajo de la pagina"); si no cabe todo, tras el calendario y con el scroll del panel */
  }
  /* el listado estrecho junto al panel (menos de 600 px, como en el móvil): la fecha, más pequeña y apretada, y menos hueco entre columnas: el ancho, para el título
     (2026-11-10, el usuario: "la fecha puede hacerse q ocupe menos ancho ?") */
  @media (min-width: 721px) and (max-width: 920px) {
    .listado .fila { column-gap: 8px; padding-left: 6px; padding-right: 6px; }
    .fila .fNombre, .listado .filaMax { font-size: 1.03em; }   /* (los 18,6 px de antes, .7em + 6px) */
    .fila .fFecha { font-size: .82em; }   /* .1em menos, como en la ancha; antes, .92em (los 16,6 px de .7em + 4px) */   /* MMM.DD.CCC, 2 px menos que el nombre, como en la ancha */   /* 4 px más, como la ancha (2026-11-11, el usuario); el título, como la fecha */
    .detalle h2, .detalle.filas h2, #ficha h2 { font-size: calc(.7em + 6px); }   /* el de la ficha, como el del listado */
    .fila .fTexto { gap: 10px; }
    :root { --altoEstado: calc(18px * 1.03 * 1.25 + 12px); }   /* la primera línea, como las filas aquí: el nombre, a 1.03em */
  }
  /* pantalla estrecha: una columna: la cabecera arriba, sus líneas una bajo otra, y debajo el panel, los dos fijos */
  @media (max-width: 720px) {
    .app { display: block; }
    .cabecera { grid-template-columns: minmax(0, 1fr); }   /* con el mismo padding que la ancha: alineada con el panel */
    .ciudadesMapa { overflow-x: auto; scrollbar-width: thin; }   /* aquí, todos, con scroll (sin more...) */
    /* el mapa, de todo el ancho, con el mismo padding que en el panel vertical (8 px arriba, 12 a los lados; 2026-11-11, el usuario: "cuando la pantalla cambia y
       el mapa pasa a ocupar todo el ancho el padding para el mapa debe mantenerse"; antes, 4 px arriba y 16 a los lados) */
    .panel { height: auto; overflow: visible; flex-flow: row wrap; align-items: center; gap: 8px; box-shadow: none; }   /* (8 px, como en el ancho; antes, 4) */
    .zonaMapa, .calendario, .calBarra, .fotoCiudad { flex: 0 0 100%; min-width: 0; }
    .fotoCiudad img, .fotoCiudad canvas { aspect-ratio: auto; height: 120px; }   /* de todo el ancho: más baja */
    #rBotones, #bAgendas, .fechas { margin-top: 0; }
    .mapaCaja.cerrado { display: none; }   /* aquí cerrar el mapa libera sitio */
    #estado { top: calc(var(--altoPanel, 0px) + var(--altoBarra, 0px)); }   /* bajo el panel, que aquí va encima */
    .linea1 { flex-wrap: wrap; row-gap: 4px; }
    .linea1 > .busca { flex-basis: 100%; order: -1; }
    .detalle { top: calc(var(--altoPanel, 0px) + var(--altoBarra, 0px)); }   /* bajo el panel, tapando la primera línea, como en la ancha */
  }
</style>

<body>
<div class="app">
 <header id="cabecera" class="cabecera">
  <div class="lineaRuta linea1"><label><select id="selRol" data-inicial="evs"><button><selectedcontent></selectedcontent></button></select></label><span class="busca"><input id="buscar" type="search" placeholder="search tango…" autocomplete="off"><div id="sugs" class="oculto"></div></span><button id="bContador" type="button" aria-label="counters" aria-pressed="false">C</button><button id="bListado">list</button><span class="selIdioma"><button id="bIdioma" type="button" aria-label="language" aria-haspopup="true" aria-expanded="false"></button><div id="menuIdioma" class="menuIdioma oculto" role="menu"></div></span><a id="info" href="#"><img src="img/koko.svg" alt="KoKo Tango"><span class="kkOver" aria-hidden="true">KK</span></a></div>
  <div class="lineaRuta lineaMigas"><div class="ruta"><span id="ruta"></span></div><div id="ciudadesMapa" class="ciudadesMapa"></div><span id="rutaCopia" class="rutaCopia"></span></div>
  <!-- los filtros, meses o días (y los roles privados), cuarta línea, bajo la de áreas, países y ciudades (2026-11-15, el usuario: "pon los filtros como cuarta
       linea debajo de la tercera", "filtro meses o dias en cuarta fila"; antes, en el panel, bajo el mapa) -->
  <div id="fechas" class="fechas oculto">
    <div id="fBotones" class="tira"></div>
    <div id="rBotones" class="tira oculto"></div>
  </div>
  <!-- el área elegida: sin selector a la vista (2026-11-11, el usuario: "eliminamos el selector de area"); se elige con sus botones (pintaCiudades) y aquí se
       guarda, con sus opciones (pinta) y su ?a= (deUrl, buscaRuta) -->
  <select id="selArea" class="oculto" data-inicial="Asia" aria-hidden="true" tabindex="-1"></select>
 </header>
 <aside id="panel" class="panel">
  <div class="zonaMapa">
    <button id="bMapa">map</button>
    <div id="mapaCaja" class="mapaCaja oculto">
      <div id="mapa" class="mapa"></div>
    </div>
    <div id="mapaAviso" class="aviso oculto"></div>
  </div>
  <!-- encima del calendario, en una línea: su selector (show annual month week) y los open, see by venue y see by time (2026-11-15, el usuario: "selector de
       calendario arriba del calendario", "en la misma linea los botones open"; antes, el selector debajo y los open en su línea bajo el calendario) -->

<script>

const EVT = 'evt';   // un evento; en el selector, festivals (rolesEvento)

// todos los eventos y todas las regulares ("crazy mode muestra todos los events y todos los regulares"), como events, pero con R encendido al elegirlo ("crazy activa la R por defecto, los demas la apagan por defecto"); en negrita, como events ("crazy mode mismo tipo
// de letra que events"; un rato, desactivado y en gris)
const LOCO = 'loco';
const comoEventos = r => r == EVS || r == LOCO;   // events y crazy mode: todos los eventos
const FAV = 'fav';   // favorite: los eventos favoritos (favorito; 2026-11-15, el usuario: "añade favoritos en el select al final de events"): por fecha, como events
const MUNDIAL = 'World';
const $ = id => document.getElementById(id);
// la única pregunta al navegador por el móvil: pantalla estrecha (sin panel vertical; el mismo límite que los @media de 720 px del CSS, donde no caben variables)
// y, con conDedo, también sin ratón (el dedo: una tableta ancha); la colocación solo mira el ancho, para ir con el CSS
const isMovil = (conDedo = false) => matchMedia('(max-width: 720px)').matches || (conDedo && !matchMedia('(pointer: fine)').matches);

function foto(idfoto, evento){
  const f = fotoDeId(idfoto, evento);
  return f ? FOTOS + f.carpeta + '/' + f.fichero : '';
}

const coordCiudad = r => (typeof CIUDADES_COORD == 'undefined' ? null
                          : CIUDADES_COORD[String(r[CAMPO.country]).trim() + '|' + String(r[CAMPO.city]).trim()]) || null;
function coordDe(r){
  const v = leeVarios(r), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  return !isNaN(la) && !isNaN(lo) ? [la, lo] : coordCiudad(r);
}
let _venues = null;
function venueDe(e){
  const loc = (leeVarios(e).loc || [])[0];
  if (!loc) return null;
  if (!_venues || !_venues.size) _venues = new Map(eventosTango().filter(x => x[CAMPO.tipo] == 'venue')
                                 .map(x => [x[CAMPO.country] + '|' + x[CAMPO.city] + '|' + x[CAMPO.name], x]));
  return _venues.get(e[CAMPO.country] + '|' + e[CAMPO.city] + '|' + loc) || null;
}
function urlSala(e){   // el Facebook (o la web) del venue de su sala, si lo tiene
  const v = venueDe(e), u = v ? String(v[CAMPO.urlfb] || '') : '';
  return /^https?:\/\//.test(u) ? u : '';
}
function dirSala(e){   // la dirección (dir) de la milonga o, si no la tiene, la de su venue
  const v = venueDe(e);
  const d = (leeVarios(e).dir || (v ? leeVarios(v).dir : null) || [''])[0];
  return d == '?' ? '' : d;     // (? = sala sin dirección: el mapa usa su ciudad)
}
function posEvento(e){   // de momento, un círculo por ciudad: el centro de su ciudad; sin él, su lat/lon o la de su sala
  if (coordCiudad(e)) return coordCiudad(e);
  const v = leeVarios(e), la = parseFloat((v.lat || [])[0]), lo = parseFloat((v.lon || [])[0]);
  if (!isNaN(la) && !isNaN(lo)) return [la, lo];
  const venue = venueDe(e);
  return venue ? coordDe(venue) : coordCiudad(e);
}
function fotoEvento(e){
  const venue = venueDe(e);
  return foto(e[CAMPO.idfoto], true) || (venue ? foto(venue[CAMPO.idfoto], true) : '');
}

let personas = [];
function cargaFilas(filas){
  const porClave = new Map();
  for (const c of filas){
    const f = foto(c[CAMPO.idfoto], false);
    const url = c[CAMPO.urlfb] && c[CAMPO.urlfb] != '-' ? c[CAMPO.urlfb] : '';
    const clave = f || url || 'nombre:' + c[CAMPO.name];
    const v = leeVarios(c);
    const coments = [...(v.txt || []), ...(v.ins || []).map(u => 'Instagram @' + u), ...(v.wec || []).map(w => 'WeChat ' + w),
                     ...(v.kak || []).map(k => 'Kakao ' + k), ...(v.tel || []).map(t => '☎ ' + t), ...(v.ema || [])];
    const notas = [...(v.vid || []), ...(v.www || []), ...(v.prv || [])].filter(x => x && x != '-').join(',');
    const fb = /facebook\.com\//.test(url) ? url : '';
    const area  = c[CAMPO.area] && c[CAMPO.area] != '-' ? c[CAMPO.area] : '-';
    const pais  = c[CAMPO.country] && c[CAMPO.country] != '-' ? c[CAMPO.country] : '-';
    const lugar = [c[CAMPO.city], c[CAMPO.country]].filter(x => x && x != '-').join(', ');
    const ciudad = c[CAMPO.city] && c[CAMPO.city] != '-' ? String(c[CAMPO.city]).trim() : '';
    const roles = String(c[CAMPO.roles] || '').split(',').map(r => r.trim()).filter(r => ROLES[r]);   // el import ya los deja con su nombre de ROLES
    const video = (v.vid || [''])[0];
    const p = porClave.get(clave);
    const pos = coordCiudad(c) || coordDe(c);   // como los eventos: el centro de su ciudad (posEvento)
    const tipoP = String(c[CAMPO.tipo] || '').trim() in TIPOS_PERSONA ? String(c[CAMPO.tipo]).trim() : 'person';
    // (un grupo con sala propia la apunta en loc: la sala es su venue, con su dirección; 2026-11-02, el usuario)
    const sala = (v.loc || [''])[0], salaFb = sala ? urlSala(c) : '', mapa = sala && dirSala(c) ? mapaDe(c) : '';
    if (!p){ porClave.set(clave, {area, pais, lugar, ciudad, pos, roles, tipoP, nombre: c[CAMPO.name], video, foto: f, fb, notas: notas ? [notas] : [],
                                     coment: coments, ids: [idDe(c)].filter(Boolean), sala, salaFb, mapa}); continue; }
    if (!p.sala && sala){ p.sala = sala; p.salaFb = salaFb; p.mapa = mapa; }
    if (idDe(c)) p.ids.push(idDe(c));
    if (!p.pos) p.pos = pos;
    if (!p.fb) p.fb = fb;
    if (p.tipoP == 'person') p.tipoP = tipoP;
    for (const t of coments) if (!p.coment.includes(t)) p.coment.push(t);
    if (notas && !p.notas.some(n => n.includes(notas))){
      p.notas = p.notas.filter(n => !notas.includes(n));
      p.notas.push(notas);

  personas.forEach((p, i) => p.id = i);
  fotosDeLista(porClave);
  sugerencias();
  pinta();
}

const porNombre = new Intl.Collator().compare;   // ordenar por nombre: el mismo orden que localeCompare, con un solo comparador (2026-11-10)
const claveNom = (n, f) => String(n).toLowerCase().replace(/[^\p{L}\p{N}]/gu, '') + '#' + f;
const orgsDe = e => leeVarios(e).org || [];
const wwwDe = e => (leeVarios(e).www || [''])[0];
const inicio = d => {
  const f = String(d || '').split('.'), dia = parseInt(String(f[3] || '').split('-')[0]), mes = parseInt(f[1]), anyo = parseInt(f[4]);
  return f[0] == 'EVT' && !isNaN(dia + mes + anyo) ? Math.round(Date.UTC(anyo, mes, dia) / 864e5) : null;
};
function proximaReg(f, solo){   // solo: días de la semana (0 = domingo) a los que se limita
  const r = leeReg(f), hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const dias = r ? r.dias.filter(d => !solo || solo.includes(d)) : [];
  if (!dias.length) return null;
  if (r.frec == 'Q'){     // cada 2 semanas: el primero de los 14 días que viene que le toca (aux.js saleReg)
    for (let k = 0; k < 14; k++){
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
      if (dias.includes(d.getDay()) && saleReg(r, d)) return d;
    }
    return null;
  }
  if (r.frec != 'M'){
    const k = Math.min(...dias.map(d => (d - hoy.getDay() + 7) % 7));
    return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + k);
  }
  const fechas = [0, 1].flatMap(m => r.semanas.map(s => {
    const primero = new Date(hoy.getFullYear(), hoy.getMonth() + m, 1);
    const dia1 = 1 + (dias[0] - primero.getDay() + 7) % 7;
    const ult = new Date(primero.getFullYear(), primero.getMonth() + 1, 0).getDate();
    const dia = s == 'L' ? dia1 + 7 * Math.floor((ult - dia1) / 7) : dia1 + 7 * (s - 1);
    return dia <= ult ? new Date(primero.getFullYear(), primero.getMonth(), dia) : null;
  }));
  return fechas.filter(d => d && d >= hoy).sort((a, b) => a - b)[0] || null;
}
function mapaDe(e){
  const venue = venueDe(e), v = leeVarios(e), vv = venue ? leeVarios(venue) : {};
  const dir = dirSala(e);
  const lugar = [e[CAMPO.city], e[CAMPO.country]].map(x => String(x || '').trim())
                .filter(x => x && x != '-' && !dir.toLowerCase().includes(x.toLowerCase()));
  const trozos = [locDe(e), dir, ...lugar].join(', ').split(',').map(x => x.trim()).filter(Boolean);
  const texto = trozos.filter((x, i) => trozos.findIndex(y => y.toLowerCase() == x.toLowerCase()) == i).join(', ');
  const la = parseFloat((v.lat || vv.lat || [])[0]), lo = parseFloat((v.lon || vv.lon || [])[0]);
  const conPos = !isNaN(la) && !isNaN(lo);
  const q = texto || (conPos ? la + ',' + lo : '');
  return q ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q) : '';
}
// festivals: los eventos, también las maratones y los encuentros (2026-11-04, el usuario: "queda más claro"); el resto de tipos, en su opción
const rolesEvento = e => { const r = rolEvento(e[CAMPO.tipo]); return [r == EVT ? FES : r]; };
function eventos(){
  const porClave = new Map(), lista = [];
  for (const e of eventosTango()){
    // los eventos y las milongas de un día (fecha EVT, rol iti; 2026-10-31: fuera milonga+)
    if (!String(e[CAMPO.tipo]).startsWith('event') && !String(fechaDe(e)).startsWith('EVT') && !sinFecha(rolEvento(e[CAMPO.tipo]))) continue;
    const url = /^https?:\/\//.test(e[CAMPO.urlfb] || '') ? e[CAMPO.urlfb] : '';
    const n = inicio(fechaDe(e));
    const claves = d => [...[url, wwwDe(e)].filter(Boolean).map(u => 'u:' + claveUrl(u) + '#' + (n == null ? fechaDe(e) : n + d)), n != null && 'n:' + claveNom(e[CAMPO.name], n + d)].filter(Boolean);
    const ya = [0, -1, 1].flatMap(d => n == null && d ? [] : claves(d)).map(k => porClave.get(k)).find(Boolean);
    if (ya){
      if (idDe(e)) ya.ids.push(idDe(e));
      if (!ya.fb && url) ya.fb = url;
      if (!ya.foto) ya.foto = fotoEvento(e);
      if (!ya.pos) ya.pos = posEvento(e);
      const orgs = orgsDe(e);
      for (const o of orgs) if (!ya.orgs.includes(o)) ya.orgs.push(o);
      if (wwwDe(e) && !ya.www.some(u => claveUrl(u) == claveUrl(wwwDe(e)))) ya.www.push(wwwDe(e));   // la misma web aunque se escriba distinto (http/https, / final)
      if (!ya.video) ya.video = (leeVarios(e).vid || [''])[0];
      for (const k of claves(0)) if (!porClave.has(k)) porClave.set(k, ya);
      continue;
    }
    const f = fechaDe(e).split('.');
    const prox = f[0] == 'REG' ? proximaReg(fechaDe(e)) : null;
    const fecha = f[0] == 'EVT' ? [f[4], f[2], (f[3] || '').replace(/\d+/g, dos)].filter(Boolean).join('.')
                : prox ? [prox.getFullYear(), MESES[prox.getMonth()], dos(prox.getDate())].join('.') : '';
    // un evento extrapolado: la fecha real, la del año anterior (ext, EVT.10.NOV.13-15.2026), como la de la línea: 2026.NOV.13-15 (la ficha la dice: rellenaEvento)
    const fx = String(leeVarios(e).ext || '').split('.'), fechaExt = fx[0] == 'EVT' ? [fx[4], fx[2], (fx[3] || '').replace(/\d+/g, dos)].filter(Boolean).join('.') : '';
    const orden = f[0] == 'EVT' ? (parseInt(f[4]) || 9999) * 100 + (parseInt(f[1]) || 0) : prox ? prox.getFullYear() * 100 + prox.getMonth() : 999999;
    const mes = f[0] == 'EVT' ? parseInt(f[1]) : prox ? prox.getMonth() : NaN, dia = prox ? prox.getDate() : parseInt(f[3]) || 1;
    const orgs = orgsDe(e);
    const ev = {evento: true, area: e[CAMPO.area] && e[CAMPO.area] != '-' ? e[CAMPO.area] : '-', pais: e[CAMPO.country] && e[CAMPO.country] != '-' ? e[CAMPO.country] : '-', roles: rolesEvento(e), nombre: e[CAMPO.name], foto: fotoEvento(e),
                         fb: url, tipo: String(e[CAMPO.tipo]).replace(/^event\s*/, '') || 'event', pos: posEvento(e),
                         ciudad: e[CAMPO.city] && e[CAMPO.city] != '-' ? String(e[CAMPO.city]).trim() : '',
                         lugar: e[CAMPO.city] && e[CAMPO.city] != '-' ? String(e[CAMPO.city]).trim() : '',
                         sala: locDe(e), salaFb: urlSala(e), fecha, orden, fechaOrig: fechaDe(e), noVerificado: Boolean(leeVarios(e).ext), fechaExt,
                         mapa: regular(rolEvento(e[CAMPO.tipo])) || dirSala(e) ? mapaDe(e) : '', mes, dia, orgs, www: wwwDe(e) ? [wwwDe(e)] : [],
                         video: (leeVarios(e).vid || [''])[0], notas: [], coment: [], ids: [idDe(e)].filter(Boolean)};
    for (const k of claves(0)) porClave.set(k, ev);
    lista.push(ev);
  }
  return lista;

function centroPais(pais){
  if (typeof PAISES_GEO == 'undefined') return null;
  const f = PAISES_GEO.features.find(f => f.properties.nombres.includes(pais));
  if (!f) return null;
  const polis = f.geometry.type == 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const cajas = polis.map(p => { const xs = p[0].map(c => c[0]), ys = p[0].map(c => c[1]);
                                 return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; });
  const [x0, y0, x1, y1] = cajas.reduce((m, c) => (c[2] - c[0]) * (c[3] - c[1]) > (m[2] - m[0]) * (m[3] - m[1]) ? c : m);
  return [(y0 + y1) / 2, (x0 + x1) / 2];
}

    const webs = [...(u && !esFb(u) ? [u] : []), ...(leeVarios(e).www || []).filter(w => /^https?:\/\//.test(w))];
    const fb = esFb(u) ? u : '', www = webs.find(w => !esAgendaWeb(w)) || webs[0] || '';
    // su estado (ESTADO_ORGANIZA): la fecha llevada desde el año anterior (ext: no verificada), con fecha o sin ella (2026-11-12, el usuario)
    const estado = leeVarios(e).ext ? 'ext' : fechaDe(e) ? 'fecha' : 'sin';

    const f = fechaDe(e).split('.');

    const ev = {nombre: e[CAMPO.name], fb, www, estado, cuando: cuando && !isNaN(cuando) ? cuando : null};

function normalizarFav(s){
  s = String(s).replace(/\(.*?\)/g, ' ').trim().toLowerCase().normalize('NFD').replace(/\p{Mn}/gu, '');
  s = s.replace(/[^\p{L}\p{N}_\s]/gu, ' ').replace(/[^\x00-\x7f]/g, '');
