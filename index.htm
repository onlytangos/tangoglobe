// entero de la pantalla: a cualquier escala (125 %, 150 %...) todos iguales (2026-11-15, el usuario: "en cal year los puntos no se ven igual, usar logos svg";
// con elementos, redondeados o en SVG, cada uno caía en otra fracción de píxel y se suavizaba distinto). Los elementos se quedan, ocultos: el sitio de cada punto
function dibujaPuntos(div){
  div.querySelector('canvas.puntosCal')?.remove();
  div.classList.remove('conLienzo');
  const puntos = calPuntos ? [...div.querySelectorAll('.cal i:not(.tramo)')] : [];
  if (!puntos.length) return;
  const dpr = window.devicePixelRatio || 1, caja = div.getBoundingClientRect(), W = div.clientWidth, H = div.scrollHeight;
  const lienzo = document.createElement('canvas'), ctx = lienzo.getContext('2d'), imagenes = new Map(), colores = new Map();
  lienzo.className = 'puntosCal';
  // el lienzo, un píxel suyo por cada píxel de la pantalla, empezando en uno entero: del tamaño de sus píxeles en CSS, reducido con transform (scale 1/dpr, y
  // movido lo que falte hasta el píxel entero): con el tamaño en CSS (lo que mide / dpr), el navegador lo redondeaba y lo reescalaba un poco, y a 110 % o 125 %
  // cada punto se suavizaba distinto
  const ox = Math.floor(caja.left * dpr), oy = Math.floor(caja.top * dpr);
  lienzo.width = Math.ceil((caja.left + W) * dpr) - ox; lienzo.height = Math.ceil((caja.top + H) * dpr) - oy;
  lienzo.style.width = lienzo.width + 'px'; lienzo.style.height = lienzo.height + 'px';
  lienzo.style.transform = `translate(${ox / dpr - caja.left}px, ${oy / dpr - caja.top}px) scale(${1 / dpr})`;
  const imagen = (color, w, h) => {   // un punto (w = h) o una píldora (más alta que ancha), con las puntas redondas
    const k = color + ' ' + w + ' ' + h;
    if (!imagenes.has(k)){
      const c = document.createElement('canvas'), x = c.getContext('2d'), r = w / 2;
      c.width = w; c.height = h; x.fillStyle = color; x.beginPath();
      x.arc(r, r, r, Math.PI, 0); x.arc(r, h - r, r, 0, Math.PI); x.closePath(); x.fill();
      imagenes.set(k, c);
    }
    return imagenes.get(k);
  };
  for (const i of puntos){
    if (!colores.has(i.className)) colores.set(i.className, getComputedStyle(i).backgroundColor);
    const r = i.getBoundingClientRect(), w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(w, Math.round(r.height * dpr));
    ctx.drawImage(imagen(colores.get(i.className), w, h), Math.round(r.left * dpr) - ox, Math.round(r.top * dpr) - oy);
  }
  div.appendChild(lienzo);
  div.classList.add('conLienzo');
}

function centroPos(pos){

    for (const c of Object.values(typeof CIUDADES_COORD == 'undefined' ? {} : CIUDADES_COORD)){

      _centros.get(k).push(c);
    }
  }

const RADIOS = [[1, 4.5], [2, 6.75], [4, 9], [8, 11.25], [16, 13.5], [32, 15.75]];
function radioDe(n){
  for (let i = 1; i < RADIOS.length; i++){
    const [n0, r0] = RADIOS[i - 1], [n1, r1] = RADIOS[i];
    if (n <= n1) return r0 + (r1 - r0) * (n - n0) / (n1 - n0);
  }
  return RADIOS[RADIOS.length - 1][1];
}

function boundsPais(l){
  const partes = l.getLatLngs().map(p => L.latLngBounds(p[0]));
  const tam = b => (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
  const mayor = Math.max(...partes.map(tam));
  return partes.filter(b => tam(b) >= mayor / 4)
               .reduce((a, b) => a ? a.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast()), null);
}

function encuadra(conPos){

  }

    const b = L.latLngBounds(VISTA_AREA[areaMapa]);
    for (const p of conPos) b.extend(p.pos);
    return vuela(b, null, MAS_AREA, conPos.length ? L.latLngBounds(conPos.map(p => p.pos)) : b);
  }

    if (!l.feature.properties.nombres.some(n => paises.has(n))) return;

const MAS_PAIS = .5;
const MAS_AREA = .5;

const mapaMovido = () => !!(mapa && mapaAbierto && vistaMapa)

function vuela(b, tope, mas = 0, puntos = b){   // puntos: los de los marcadores (b puede ser más grande: el área entera)
  // (el margen: el círculo mayor y 4 px, también arriba y abajo; antes VERT = PAD + 26, por el botón map: en el mapa del panel, de 142 px de alto, 92 eran margen y
  // los puntos cabían en 50; 2026-11-08, el usuario: "aumenta el zoom del mapa para tener menos padding")
  const PAD = Math.ceil(RADIOS[RADIOS.length - 1][1]) + 4;
  const z = x => mapa.getBoundsZoom(x, false, L.point(2 * PAD, 2 * PAD));
  // los marcadores de los extremos, siempre dentro (2026-11-08, el usuario: "los marcadores maximos deben estar dentro del mapa, alto,bajo,derecha,izquierda"):
  // nunca más zoom del que los encaja, y el centro movido lo justo para que quepan

  // el usuario: "centra el mapa en funcion de circulo mas alto y bajo, mas a la izq y mas a la derecha"): el mismo margen a cada lado. Las marcas, las de dentro
  // de puntos, con 0,02° de holgura (centroPos las lleva al centro de su ciudad, a menos de 1 km). Sin ninguna (un país sin puntos), el de b, movido lo justo
  // para que quepan los puntos (antes, siempre así: con un área, el centro de su vista)
  const holgura = L.latLngBounds([puntos.getSouth() - .02, puntos.getWest() - .02], [puntos.getNorth() + .02, puntos.getEast() + .02]);
  const radio = m => m.getRadius ? m.getRadius() + (m.options.weight || 0) / 2 : 7;   // un círculo (o un cuadrado de zona): su radio y medio borde; una lista, su logo de 13 px
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const m of marcadores.values()){

    const atenua = () => paises.style.opacity = Math.max(.1, Math.min(1, 1 - (mapa.getZoom() - 7) * .45));
    mapa.on('zoomend', atenua);
    const nombres = mapa.createPane('nombres');
    nombres.style.zIndex = 260;
    nombres.style.pointerEvents = 'none';
    teselas.push(L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom: 16, className: 'teselaNombres', pane: 'nombres'}).addTo(mapa));
    if (creaPaises()) capaPaises.addTo(mapa);

    mapa.on('moveend', trasMoverMapa);   // la tercera línea, con lo que se ve en el mapa ya encuadrado (tras un clic en ella, con sus teselas ya cargadas)
  }
  mapa.invalidateSize();
  capaMapa.clearLayers();
  const porLugar = new Map();
  for (const p of conPos){
    const k = claveMarca(p);

  }
  marcadores.clear();
  porLugarMapa = porLugar;
  for (const [k, ps] of porLugar){
    const ciudad = deCiudadSel(k) || k == marcaFicha;
    const estilo = k == marcaFicha ? ESTILO_CIUDAD : ciudad ? ESTILO_LUGAR : {color: BORDE_MARCA, fillColor: COLOR_MARCA, weight: 1, fillOpacity: 0};

      const antes = paisSel;

    // 3. bordes húmedos: el pigmento se acumula en el borde de cada mancha (la mancha menos su media alrededor)
    const TR = tabla(r2), TG = tabla(g2), TB = tabla(b2), rb = Math.round(4*k);

    const Lo = new Float32Array(N); for (let i = 0; i < N; i++) Lo[i] = .3*R[i] + .59*G[i] + .11*B[i];

    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const i = y*W + x;
      let c = [r2[i], g2[i], b2[i]];
      const m = [caja(TR, x-rb, y-rb, x+rb, y+rb), caja(TG, x-rb, y-rb, x+rb, y+rb), caja(TB, x-rb, y-rb, x+rb, y+rb)];

      const borde = Math.max(0, lm - lc);   // el lado oscuro de cada borde, más oscuro
      // densidad del pigmento (0, papel; 1, color pleno), lavada y desigual
      const nubes = fbm(x/(90*k)+7, y/(90*k)+3, 4), grano = fbm(x/(2.2*k), y/(2.2*k), 2);
      let lum = Math.max(lc, .001);

      dens *= .65 + .7 * nubes;                      // zonas más y menos cargadas
      dens *= .8 + .4 * grano;                       // granulado del pigmento
      dens += borde * 2.2;                           // borde húmedo
      dens *= 1 - sm(.8, .95, lum);                  // las luces, papel en blanco
      dens = Math.min(1, Math.max(0, dens));
      // el color de la mancha, más vivo; sobre el papel, por capas (multiplica)
      const sat = 1.6; c = c.map(v => Math.min(1, Math.max(0, lc + (v - lc) * sat)));
      let rgb = [0, 1, 2].map(j => papel[j] * (1 - dens + dens * c[j] * .92));
      // lápiz, muy suave
      if (x > 0 && y > 0 && x < W-1 && y < H-1){

        const lap = sm(.25, .9, Math.hypot(gx, gy)) * .35 * (.6 + .8 * fbm(x/(6*k)+20, y/(6*k), 2));
        rgb = rgb.map(v => v * (1 - lap));
      }
      // textura del papel y borde irregular de la hoja, sin pintar
      const tex = .96 + .04 * fbm(x/(1.3*k)+90, y/(1.3*k)+90, 2);
      const dist = Math.min(x, y, W-1-x, H-1-y) / (W * .5);
      const hoja = sm(.015, .06, dist + (fbm(x/(25*k)+40, y/(25*k)+40, 3) - .5) * .06);

    }
    ctx.putImageData(out, 0, 0);
    listo();
  };

  im.src = src;
}

                               .sort((x, y) => orden(y[0]) - orden(x[0]) || x[1].localeCompare(y[1]));   // primero las de más líneas en los doce meses
  div.scrollLeft = 0;

function teclaBuscar(e){
  if (!encontradas.length) return;
  if (e.key == 'ArrowDown'){ marca(activa + 1); e.preventDefault(); }

// el horario de una regular, 20:00 ~ 24:30 (su fecha REG lleva 2000-2430; solo el inicio, 20:00); y las semanas de una mensual, (1st, 3rd), como en la de Beto
const horario = p => { const m = ((leeReg(p.fechaOrig) || {}).hora || '').match(/^(\d\d)(\d\d)(?:-(\d\d)(\d\d))?$/); return m ? m[1] + ':' + m[2] + (m[3] ? ' ~ ' + m[3] + ':' + m[4] : '') : ''; };
const ORDINAL = {1: '1st', 2: '2nd', 3: '3rd', 4: '4th', 5: '5th', L: 'last'};
const semanasMes = p => { const r = leeReg(p.fechaOrig); return r && r.frec == 'M' && r.semanas.length ? '(' + r.semanas.map(x => ORDINAL[x] || x).join(', ') + ')' : ''; };

// el horario de los open, una semana de lunes a domingo (2026-11-15, el usuario: "en see queremos ver los eventos regulares por dia de la semana, añadimos las
// filas de no regulares al inicio si esta semana hay alguno"; un rato, por meses): las regulares (milongas y prácticas semanales, mensuales...), en su día de la
// semana, igual todas las semanas (las mensuales, con sus semanas del mes: botonSesion); arriba, las que no son regulares (festivales, seminarios, milongas con
// fecha) que caen en esta semana: por local, una fila para cada una; por hora, una para cada tipo. semanaAgenda: semanas desde la de hoy (o la del primer día
// del mes elegido en la tira; las columnas, de lunes a domingo, con los días desde hoy); los días de los filtros (los de la semana elegidos; lo no regular, también el periodo)
const TIPO_FILA = {F: 'festival', S: 'seminar', M: 'milonga', P: 'practice'};
function pintaAgenda(){
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  // las columnas, de lunes a domingo, y en cada una su día de la semana desde hoy (2026-11-15, el usuario: "presentamos mon-sun, y rellenamos todas las celdas
  // usando desde hoy una semana"): hoy y los 6 que siguen, cada uno en su columna; con las flechas, los 7 siguientes (o los de antes)
  const desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + 7 * semanaAgenda);
  const dias = [1, 2, 3, 4, 5, 6, 0].map(wd => new Date(desde.getFullYear(), desde.getMonth(), desde.getDate() + (wd - desde.getDay() + 7) % 7));
  const enDias = d => !agendaFiltro.dias || agendaFiltro.dias.includes(d.getDay());
  const vale = d => enDias(d) && (!agendaFiltro.periodo || d >= agendaFiltro.periodo[0] && d <= agendaFiltro.periodo[1]);
  const grupos = new Map();
  for (const p of agendaDe()){
    const r = !leeEvt(p.fechaOrig) && leeReg(p.fechaOrig), regular = !!(r && r.dias.length), lt = letraTipo(p);
    dias.forEach((d, k) => {
      if (regular ? !r.dias.includes(d.getDay()) || !enDias(d) : !saleEl(p, d) || !vale(d)) return;   // regular: su día de la semana; lo demás: si cae esta semana
      // lo no regular, arriba: por local, su fila; por hora, la de su tipo; lo regular, por local o por hora
      const nombre = !regular ? (horasAgenda ? 'no regular ' + lt : p.nombre) : horasAgenda ? horaDe(p) : localDe(p);
      const clave = !regular ? (horasAgenda ? nombre : 'ev ' + p.id) : sinAcentos(nombre);
      if (!grupos.has(clave)) grupos.set(clave, {nombre, celdas: dias.map(() => []), arriba: !regular, tipo: lt, texto: !regular && horasAgenda ? TIPO_FILA[lt] || lt : null});
      if (!regular && !horasAgenda){ grupos.get(clave).evento = p; grupos.get(clave).celdas[k] = [p]; }
      else grupos.get(clave).celdas[k].push(p);
    });
  }
  const inicio = f => { const e = f.evento && leeEvt(f.evento.fechaOrig); return e && e.ini ? e.ini.getTime() : Infinity; };
  const ordenTipo = f => 'FSMP'.indexOf(f.tipo);
  const filas = [...grupos.values()].sort((x, y) => y.arriba - x.arriba || (x.arriba ? ordenTipo(x) - ordenTipo(y) || inicio(x) - inicio(y) : 0) || x.nombre.localeCompare(y.nombre));   // arriba lo no regular (festival, seminario, milonga, práctica; por su día de empezar); luego por local o por horas, 9999 (sin hora) al final
  const donde = textoDonde($('selArea').value), tipo = PRIMEROS[$('selRol').value] || 'milonga', nombreRol = tipo + 's';
  const celda = (tipo, clase) => {
    const c = document.createElement(tipo);
    if (clase) c.className = clase;
    return c;
  };
  const claseDia = d => d.getTime() == hoy.getTime() ? 'hoy' : '';
  // como la de Beto: "Seoul Tango Milonga Schedule", y la semana a la derecha (NOV.10 - NOV.16)
  $('aTitulo').textContent = donde + ' Tango ' + tipo[0].toUpperCase() + tipo.slice(1) + ' Schedule';
  $('aSemana').textContent = '';   // el resumen semanal: sin fechas (2026-11-15, el usuario: "en see no usamos fechas", "es el resumen semanal")
  // la fila de los días, arriba (con su fecha) y abajo; a los lados, Place (o Time)
  const esquina = derecha => { const c = celda('th', derecha ? 'aDer' : ''); c.textContent = horasAgenda ? 'Time' : 'Place'; return c; };
  const DIAS_LARGOS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  $('aDias').replaceChildren(esquina(false), ...dias.map(d => { const c = celda('th', claseDia(d)); c.textContent = DIAS_LARGOS[d.getDay()]; return c; }), esquina(true));   // (sin su fecha; hoy, resaltado)
  $('aPie').replaceChildren(esquina(false), ...dias.map(d => { const c = celda('th'); c.textContent = DIAS_LARGOS[d.getDay()]; return c; }), esquina(true));
  // cada local (o cada hora), a la izquierda y otra vez a la derecha; lo no regular: su nombre (por local) o su tipo (por hora)
  const cabezaFila = (f, derecha) => {
    const c = celda('th', derecha ? 'aDer' : '');
    if (f.evento) c.textContent = f.nombre;
    else if (f.texto) c.textContent = f.texto;
    else if (horasAgenda) c.textContent = horaTexto(f.nombre);
    else c.appendChild(botonLocal(f));
    c.scope = 'row';
    return c;
  };
  $('aFilas').replaceChildren(...filas.map(f => {
    const tr = celda('tr', f.arriba ? 'aNoRegular' : '');
    tr.appendChild(cabezaFila(f, false));
    for (const ps of f.celdas){
      const c = celda('td');
      ps.sort((x, y) => horaDe(x).localeCompare(horaDe(y)) || localDe(x).localeCompare(localDe(y)) || x.nombre.localeCompare(y.nombre)).forEach(p => c.appendChild(botonSesion(p)));
      tr.appendChild(c);
    }
    tr.appendChild(cabezaFila(f, true));
    return tr;
  }));
  if (!filas.length){
    const c = celda('td', 'vacio'), tr = celda('tr');
    c.textContent = 'No ' + nombreRol + ' in ' + donde + ' this week';
    tr.appendChild(c);
    $('aFilas').appendChild(tr);
  }
  $('aScroll').scrollTop = 0;
}
const mueveSemana = n => { semanaAgenda += n; pintaAgenda(); };

function conecta(){
  $('buscar').oninput = muestra;
  $('buscar').onfocus = muestra;
  $('buscar').onblur = () => $('sugs').classList.add('oculto');
  $('buscar').onkeydown = teclaBuscar;
  $('info').onclick = muestraInfo;
  window.addEventListener('message', e => {
    const f = $('kkTexto');
    if (f && e.source == f.contentWindow && e.data.kkAlto > 0) f.style.height = e.data.kkAlto + 'px';
  });
  $('fCerrar').onclick = () => $('ficha').close();
  $('vCerrar').onclick = () => $('video').close();
  $('video').addEventListener('close', () => { $('vMarco').src = 'about:blank'; });   // (se para)
  $('video').addEventListener('click', e => { if (e.target == $('video')) $('video').close(); });   // fuera del vídeo (el fondo), se cierra
  // se abre en la semana de hoy o, con un periodo que empieza más adelante (un mes), en la de su primer día
  const abreAgenda = porHoras => {
    horasAgenda = porHoras;
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    const ini = agendaFiltro.periodo && agendaFiltro.periodo[0];
    semanaAgenda = ini && ini > hoy ? Math.floor(Math.round((ini - hoy) / 864e5) / 7) : 0;   // los 7 días que tienen el primero del periodo
    pintaAgenda();
    $('agenda').showModal();
  };
  $('bAgenda').onclick = () => abreAgenda(false);
  $('bAgenda2').onclick = () => abreAgenda(true);
  $('aCerrar').onclick = () => $('agenda').close();
  $('agenda').onclick = e => { if (e.target == $('agenda')) $('agenda').close(); };
  $('agenda').onkeydown = e => { if (e.key == 'ArrowLeft') mueveSemana(-1); else if (e.key == 'ArrowRight') mueveSemana(1); };
  $('aAtras').onclick = () => mueveSemana(-1);
  $('aSigue').onclick = () => mueveSemana(1);
  $('ficha').onclick = e => { if (e.target == $('ficha')) $('ficha').close(); };
  $('dCerrar').onclick = cierraFicha;
  $('bMapa').onclick = abreCierraMapa;
  $('bListado').onclick = () => { enListado = !enListado; sinEncuadre = true; pinta(); };
  $('bIdioma').onclick = e => { e.stopPropagation(); abreIdioma($('menuIdioma').classList.contains('oculto')); };
  document.addEventListener('click', e => { if (!e.target.closest('.selIdioma')) abreIdioma(false); });   // fuera del selector, se cierra
  document.addEventListener('keydown', e => { if (e.key == 'Escape') abreIdioma(false); });
  pintaIdioma();
  window.addEventListener('resize', () => { if (!enListado) columnasParrilla(); });
  document.addEventListener('keydown', e => {
    if (e.key == 'Escape') return cierraFicha();
    if ((e.key != 'ArrowDown' && e.key != 'ArrowUp') || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    // los cursores, para el listado: no con la parrilla, ni con un popup abierto, ni en un selector, ni en el buscador con texto o con sugerencias (son suyos)
    const t = e.target, deOtro = /^(SELECT|OPTION|TEXTAREA)$/.test(t.tagName) || (t.tagName == 'INPUT' && (t.value || encontradas.length));
    if (!enListado || deOtro || document.querySelector('dialog[open]')) return;
    e.preventDefault();   // sin mover la página
    mueveFila(e.key == 'ArrowDown' ? 1 : -1);
  });
  $('selRol').onchange = () => {   // la ciudad elegida se mantiene: el lugar pinchado en el mapa pasa a ser su ciudad
    const p = lugarSel && (porLugarMapa.get(lugarSel) || []).find(p => p.ciudad);
    if (p) ciudadSel = ciudadDe(p);
    lugarSel = null;
    soloBuscado = false;
    deTira = deTipo = true;   // (a cero, el listado vacío, no lo de antes)
    pinta();
  };
}

function deUrl(){
  const q = new URLSearchParams(location.search);
  if (q.get('a')) $('selArea').dataset.inicial = q.get('a');
  if (q.get('b')) $('selRol').dataset.inicial = q.get('b') == EVT || q.get('b') == 'mar' ? FES : q.get('b');   // los enlaces de antes, con b=evt o b=mar
  if (/^[wy]$/.test(q.get('m') || '')) modoTira[$('selRol').dataset.inicial || TODOS] = q.get('m') == 'w' ? 'dias' : 'meses';   // ?m=w (WEEK) o ?m=y (YEAR)
  if (q.has('c')) enListado = !/^(grid|0|off|no)$/i.test(q.get('c'));
  if (q.has('d')) mapaAbierto = !/^(off|0|no)$/i.test(q.get('d'));
  idInicial = (q.get('id') || '').trim();
  rutaInicial = {pa: q.get('pa'), ci: q.get('ci'), lu: q.get('lu'), f: q.get('f'), w: q.get('w'), r: q.get('r')};
}
// el resto de la ruta de la url (urlRuta): la fecha, los días y los roles; luego el lugar, la ciudad o el país, como al pulsarlos
let rutaInicial = {};
function abreRuta(){
  const {pa, ci, lu, f, w, r} = rutaInicial;
  if (f){
    const [anyo, mes] = f.split('-').map(Number), i = FECHAS.findIndex(x => !x.doce && x.anyo == anyo && (mes ? x.mes == mes - 1 : x.mes === undefined));
    if (i >= 0) fechaSel = i;
  }
  if (w) diasSel = new Set(w.split(',').map(Number).filter(d => d >= 0 && d <= 6));
  if (r) rolesSel = new Set(r.split(',').filter(Boolean));
  if (f || w || r) pinta();
  const enLu = lu && personas.find(p => p.pos && claveMarca(p) == lu);
  if (enLu){   // como pulsar su marca (aunque el mapa esté cerrado): el lugar, con su país
    lugarSel = lu;
    if (capaPaises) capaPaises.eachLayer(l => { if (l.feature.properties.nombres.includes(enLu.pais)) paisSel = l; });
    pinta();
  }
  else if (ci) eligeCiudad(ci, ci.split('|')[1] || ci.split('|')[0]);
  else if (pa) eligePais(pa);
}
// ?id=<id del registro> (campo 10): abre esa ficha (evento, persona o lista) sola en el listado, como el buscador
let idInicial = '';
function abreId(){
  const p = idInicial && personas.find(x => (x.ids || []).includes(idInicial));
  if (!p) return;
  ir(p);
  abreFicha(p);
}

async function arranca(){
  if (!await descifra(t => $('listado').textContent = t)) return;
  deUrl();
  creaPaises();
  conecta();
  cargaFilas(personasTango());
  abreRuta();
  abreId();
  sinHistoria = false;
  if (!isMovil(true)) $('buscar').focus({preventScroll: true});   // al cargar, el foco en search (en el móvil no: sacaría el teclado)
}

arranca();
